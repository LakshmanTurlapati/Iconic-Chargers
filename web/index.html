<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tesla Iconic Charger badges — world map</title>

<!-- Tiles are the long pole once the script is local, so open the connection
     while the HTML is still parsing. Deliberately NO crossorigin: Leaflet
     requests tiles as plain no-CORS <img>, and a CORS-mode preconnect would
     sit unused while the browser opened a second connection anyway. -->
<link rel="preconnect" href="https://basemaps.cartocdn.com">

<!-- Vendored rather than CDN-loaded. Browsers partition the HTTP cache by
     top-level site, so a shared CDN copy is never reused across sites -- the
     third-party origin buys nothing and costs a DNS + TLS round trip that
     blocks map init. Both files are byte-identical to unpkg's leaflet@1.9.4
     (verified against the SRI hashes this page used to pin). -->
<link rel="stylesheet" href="vendor/leaflet.css">
<script defer src="vendor/leaflet.js"></script>
<script defer src="sites.js"></script>
<style>
  :root {
    color-scheme: dark;
    --surface-1:      #1b1b1b;
    --page:           #0d0d0d;
    --panel:          #141414;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --hairline:       #2c2c2a;
    --rule:           #383835;
    /* categorical slots 1-3, validated all-pairs against --surface-1
       (CVD ΔE 9.4, normal-vision ΔE 20.9, all >= 3:1 contrast).
       These now identify a badge's reason in the LIST only - the map is one colour. */
    --reason-flagship:     #3987e5;
    --reason-significance: #d95926;
    --reason-destination:  #199e70;
    /* Map pin, styled after Tesla's own Supercharger marker.
       Gold on the dark basemap: 9.35:1 over water, 8.03:1 over land.
       Bolt on gold: 7.59:1. Swap --pin-gold to #d4af37 for antique gold. */
    --pin-gold: #e8b923;
    --pin-bolt: #2c2c2a;
    --pin-edge: #1b1b1b;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    display: grid;
    grid-template-columns: 380px 1fr;
    grid-template-rows: auto 1fr;
    grid-template-areas: "head head" "side map";
    background: var(--page);
    color: var(--text-primary);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  header {
    grid-area: head;
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--hairline);
    background: var(--panel);
  }
  h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
  h1 span { color: var(--text-muted); font-weight: 400; }

  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    min-height: 28px; padding: 0 11px;
    border: 1px solid var(--rule); border-radius: 999px;
    background: transparent; color: var(--text-secondary);
    font: inherit; font-size: 12.5px; cursor: pointer;
  }
  .chip:hover { background: #ffffff0d; }
  .chip:focus-visible { outline: 2px solid var(--reason-flagship); outline-offset: 2px; }
  .chip[aria-pressed="false"] { color: var(--text-muted); opacity: 0.5; }
  .chip .n { color: var(--text-muted); font-variant-numeric: tabular-nums; }

  #side {
    grid-area: side;
    display: flex; flex-direction: column; min-height: 0;
    border-right: 1px solid var(--hairline);
    background: var(--panel);
  }
  .side-head { padding: 12px 14px; border-bottom: 1px solid var(--hairline); }
  #q {
    width: 100%; height: 34px; padding: 0 11px;
    border: 1px solid var(--rule); border-radius: 7px;
    background: var(--page); color: var(--text-primary); font: inherit;
  }
  #q::placeholder { color: var(--text-muted); }
  #q:focus { outline: none; border-color: var(--reason-flagship); }
  #count { margin-top: 9px; color: var(--text-muted); font-size: 12px; }

  #list { flex: 1; min-height: 0; overflow-y: auto; padding: 6px 0 20px; }
  .region-head {
    position: sticky; top: 0; z-index: 1;
    padding: 12px 14px 5px;
    background: var(--panel); color: var(--text-muted);
    font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase;
  }
  .item {
    display: grid; grid-template-columns: 9px 1fr auto; align-items: baseline;
    gap: 10px; width: 100%;
    padding: 9px 14px;
    border: 0; border-left: 2px solid transparent;
    background: none; color: inherit; font: inherit; text-align: left; cursor: pointer;
  }
  /* `display: grid` above outranks the UA's `[hidden] { display: none }`,
     so filtered-out rows need this or they stay on screen. */
  .item[hidden] { display: none; }
  .item:hover { background: #ffffff0d; }
  .item:focus-visible { outline: 2px solid var(--reason-flagship); outline-offset: -2px; }
  .item[aria-current="true"] { background: #ffffff14; border-left-color: var(--accent); }
  .item .dot { width: 9px; height: 9px; border-radius: 50%; transform: translateY(1px); }
  .item .nm { color: var(--text-primary); }
  .item .sub { display: block; color: var(--text-muted); font-size: 12px; }
  .item .tag {
    color: var(--text-secondary); font-size: 11px; white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .item .approx {
    display: inline-block; margin-left: 6px; padding: 0 5px;
    border: 1px solid var(--rule); border-radius: 4px;
    color: var(--text-muted); font-size: 10px; letter-spacing: 0.03em;
  }
  .empty { padding: 24px 14px; color: var(--text-muted); }

  #map { grid-area: map; min-height: 0; background: var(--surface-1); }
  .leaflet-container { background: var(--surface-1); font: inherit; }
  .leaflet-control-attribution {
    background: #0d0d0dcc !important; color: var(--text-muted) !important; font-size: 10px;
  }
  .leaflet-control-attribution a { color: var(--text-secondary) !important; }
  .leaflet-bar a { background: var(--panel); color: var(--text-primary); border-bottom-color: var(--hairline); }
  .leaflet-bar a:hover { background: #262626; color: var(--text-primary); }

  .legend {
    padding: 10px 12px;
    border: 1px solid var(--hairline); border-radius: 8px;
    background: #0d0d0de6; color: var(--text-secondary); font-size: 12px; line-height: 1.6;
  }
  .legend b {
    display: block; margin-bottom: 6px;
    color: var(--text-muted); font-size: 10.5px; font-weight: 600;
    letter-spacing: 0.07em; text-transform: uppercase;
  }
  .legend .row { display: flex; align-items: center; gap: 8px; }
  .legend .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .legend .sizes {
    display: flex; align-items: center; gap: 9px;
    margin-top: 9px; padding-top: 9px; border-top: 1px solid var(--hairline);
  }
  .legend hr { margin: 9px 0; border: 0; border-top: 1px solid var(--hairline); }

  /* ------------------------------------------------------ Supercharger pill */
  /* Modelled on Tesla's map marker: a capsule holding a bolt and the charger
     count. Built from HTML rather than a fixed SVG so the capsule grows with
     its digits - "164" needs more room than "6". */
  /* The capsule itself is position-independent, so the legend can reuse it. */
  .cap {
    display: inline-flex; align-items: center; gap: 3px;
    height: 24px; padding: 0 8px;
    border: 1.5px solid var(--pin-edge); border-radius: 999px;
    background: var(--pin-gold);
    color: var(--pin-bolt);
    font: 600 12px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    transition: transform 90ms ease-out;
  }
  .cap svg { display: block; fill: var(--pin-bolt); flex: none; }

  /* Only map markers are pinned to a coordinate. Leaflet drives the OUTER
     element with translate3d(), so the centring transform lives on .cap. */
  .pin { background: none; border: 0; width: auto !important; height: auto !important; }
  .pin .cap {
    position: absolute;
    transform: translate(-50%, -50%);
    transform-origin: 50% 50%;
  }

  .leaflet-marker-icon.pin:hover .cap { transform: translate(-50%, -50%) scale(1.12); }
  .pin.is-selected .cap {
    transform: translate(-50%, -50%) scale(1.15);
    filter: drop-shadow(0 0 7px #e8b92399);
  }

  .leaflet-tooltip.tip {
    padding: 5px 9px; border: 1px solid var(--rule); border-radius: 6px;
    background: #0d0d0df2; color: var(--text-primary);
    font: inherit; font-size: 12.5px; box-shadow: none;
  }
  .leaflet-tooltip.tip::before { display: none; }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip {
    background: var(--panel); color: var(--text-primary);
    border: 1px solid var(--rule); box-shadow: 0 8px 28px #00000080;
  }
  .leaflet-popup-content-wrapper { border-radius: 10px; }
  .leaflet-popup-content { margin: 13px 15px; width: 296px !important; line-height: 1.55; }
  .leaflet-popup-close-button { color: var(--text-muted) !important; }
  .pop h2 { margin: 0 0 2px; font-size: 14.5px; font-weight: 600; }
  .pop .meta { display: flex; align-items: center; gap: 7px; color: var(--text-muted); font-size: 12px; }
  .pop .meta .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .pop .why { margin: 10px 0 0; color: var(--text-secondary); font-size: 12.5px; }
  .pop .note {
    margin: 8px 0 0; padding: 7px 9px;
    border: 1px solid var(--rule); border-radius: 6px;
    color: var(--text-muted); font-size: 11.5px;
  }
  .pop dl {
    display: grid; grid-template-columns: auto 1fr; gap: 3px 12px;
    margin: 11px 0 0; padding-top: 10px; border-top: 1px solid var(--hairline); font-size: 12px;
  }
  .pop dt { color: var(--text-muted); }
  .pop dd { margin: 0; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .pop dd.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; }
  .pop .links { display: flex; gap: 12px; margin-top: 11px; font-size: 12px; }
  .pop .links a { color: var(--reason-flagship); }

  @media (max-width: 820px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto 45vh 1fr; grid-template-areas: "head" "map" "side"; }
    #side { border-right: 0; border-top: 1px solid var(--hairline); }
    .filters { margin-left: 0; }
  }
</style>
</head>
<body>

<header>
  <h1>Tesla Iconic Charger badges <span id="total"></span></h1>
  <div class="filters" id="filters" role="group" aria-label="Filter by region"></div>
</header>

<div id="side">
  <div class="side-head">
    <input id="q" type="search" placeholder="Search badge, city or country…" autocomplete="off"
           aria-label="Search badges">
    <div id="count" aria-live="polite"></div>
  </div>
  <div id="list"></div>
</div>

<div id="map"></div>

<script>
// leaflet.js and sites.js are deferred from <head>, so they start downloading
// during parse instead of being discovered down here. Deferred scripts run
// after parsing but before DOMContentLoaded, so waiting on that event is what
// keeps this inline block -- and the single-file app -- ordered behind them.
document.addEventListener("DOMContentLoaded", function () {
  "use strict";

  var DATA = window.ICONIC;
  var BADGES = DATA.badges;
  var REGIONS = DATA.regions;

  var COLOR = {
    flagship:     "#3987e5",
    significance: "#d95926",
    destination:  "#199e70"
  };
  var REASON_LABEL = {
    flagship:     "Flagship Tesla site",
    significance: "Special significance",
    destination:  "Famous destination"
  };

  var sitesOf = {};
  DATA.sites.forEach(function (s) {
    (sitesOf[s.badge] = sitesOf[s.badge] || []).push(s);
  });

  var active = new Set(REGIONS);
  var query = "";
  var selected = null;

  var map = L.map("map", {
    worldCopyJump: true, minZoom: 2, maxZoom: 17,
    // Zoom stays snapped to whole levels. Continuous zoom (zoomSnap: 0) was
    // tried and reverted for two measured reasons: a wheel notch moved only
    // ~0.2 levels instead of a full one, so zooming felt sluggish, and these
    // are raster tiles -- between two levels the basemap is a scaled bitmap,
    // so a map that is usually mid-level is usually soft.
    // Only the debounce is tightened, which starts the zoom sooner without
    // changing where it lands.
    wheelDebounceTime: 20
  });

  // No {s} sharding: a/b/c/d are one Fastly host behind a *.basemaps wildcard
  // cert, so the browser coalesces them onto a single HTTP/2 connection
  // regardless. The shards only ever cost three extra DNS lookups, and they
  // split the preconnect four ways.
  L.tileLayer("https://basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
    attribution:
      '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors ' +
      '&copy; <a href="https://carto.com/attributions">CARTO</a> &middot; ' +
      'site data <a href="https://supercharge.info">supercharge.info</a>',
    maxZoom: 20,
    // Selecting a badge flies the map across many zoom levels. Without this,
    // every level crossed en route requests a full screen of tiles that is
    // discarded before it can be seen -- competing with the tiles at the
    // destination, which are the only ones anybody looks at.
    // (keepBuffer was tried at 3, 4 and 6 and left at its default: it governs
    // which loaded tiles are *retained*, not which are fetched ahead, so it
    // changed neither the tiles needed for a view nor the cost of a drag.)
    updateWhenZooming: false
  }).addTo(map);

  // Straight after the tile layer, before any marker or sidebar work: a map
  // with no view requests no tiles, so this is the line that starts the
  // network. Everything placed above it is latency added to the first paint.
  map.fitBounds(
    L.latLngBounds(DATA.sites.map(function (s) { return [s.latitude, s.longitude]; })),
    { padding: [40, 40] }
  );


  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function place(s) {
    return [s.city, s.state, s.country].filter(Boolean).join(", ");
  }
  function text(el, s) {
    if (el.textContent !== s) el.textContent = s;
  }

  function popupHTML(badge, s) {
    var rows = [
      ["Supercharger", "<dd>" + esc(s.name) + "</dd>"],
      ["Coordinates", '<dd class="mono">' + s.latitude.toFixed(5) + ", " + s.longitude.toFixed(5) + "</dd>"],
      ["Stalls", "<dd>" + (s.stalls || "—") + (s.power_kw ? " &middot; " + s.power_kw + " kW" : "") + "</dd>"],
      ["Listed", "<dd>" + (s.opened || "—") + "</dd>"]
    ];
    var links =
      '<a href="https://www.google.com/maps/search/?api=1&query=' +
      s.latitude + "," + s.longitude + '" target="_blank" rel="noopener">Google Maps</a>';
    if (s.tesla_location_id) {
      links += '<a href="https://www.tesla.com/findus/location/supercharger/' +
        encodeURIComponent(s.tesla_location_id) + '" target="_blank" rel="noopener">Tesla</a>';
    }
    var multi = badge.site_count > 1
      ? '<p class="note">This badge covers ' + badge.site_count + " Superchargers.</p>" : "";
    var note = badge.note ? '<p class="note">' + esc(badge.note) + "</p>" : "";
    return (
      '<div class="pop">' +
      "<h2>" + esc(badge.badge) + "</h2>" +
      '<div class="meta"><span class="dot" style="background:' + COLOR[badge.reason] + '"></span>' +
        esc(REASON_LABEL[badge.reason]) + " &middot; " + esc(badge.region) + "</div>" +
      '<p class="why">' + esc(badge.why) + "</p>" +
      multi + note +
      "<dl>" + rows.map(function (r) { return "<dt>" + r[0] + "</dt>" + r[1]; }).join("") + "</dl>" +
      '<div class="links">' + links + "</div>" +
      "</div>"
    );
  }

  var layer = L.layerGroup().addTo(map);
  var marks = {};   // badge name -> [{marker, site, badge}]

  // A Tesla-style Supercharger pin: gold teardrop, dark bolt, stall count in
  // place of the bolt once zoomed in. Inline SVG in a divIcon keeps the page
  // asset-free, and the 26x34 icon box is its own hit target - comfortably past
  // the 24px minimum, so no separate halo layer is needed.
  var BOLT =
    '<svg width="9" height="13" viewBox="0 0 9 13" aria-hidden="true">' +
      '<path d="M5.6 0 0 7.4h3.4L2.3 13 9 5.2H5.1z"/></svg>';

  function pinIcon(stalls, label) {
    // role="img" + <title> rather than the marker's alt option: Leaflet only
    // applies alt to image icons, so a divIcon would otherwise be unnamed.
    var html =
      '<span class="cap" role="img" aria-label="' + esc(label) + '">' +
        BOLT + "<b>" + (stalls || "?") + "</b>" +
      "</span>";
    // iconSize null keeps Leaflet from stamping width/height/margins, so the
    // capsule can size itself; .cap centres on the coordinate in CSS.
    return L.divIcon({
      className: "pin",
      html: html,
      iconSize: null,
      popupAnchor: [0, -16],
      tooltipAnchor: [0, -14]
    });
  }

  BADGES.forEach(function (badge) {
    marks[badge.badge] = sitesOf[badge.badge].map(function (s) {
      var label = badge.site_count > 1 ? badge.badge + " — " + s.name : badge.badge;
      var marker = L.marker([s.latitude, s.longitude], {
        icon: pinIcon(s.stalls, label + ", " + (s.stalls || "?") + " stalls"),
        riseOnHover: true,
        keyboard: true
      });

      marker.bindTooltip(esc(label), { className: "tip", direction: "top" });
      // Popup content as a function, not a string: Leaflet calls it on first
      // open, so startup no longer builds 53 popups nobody has asked for.
      marker.bindPopup(function () { return popupHTML(badge, s); }, { autoPanPadding: [30, 30] });
      marker.on("popupopen", function () { highlight(badge.badge); });

      return { marker: marker, site: s, badge: badge };
    });
  });


  var legend = L.control({ position: "bottomleft" });
  legend.onAdd = function () {
    var d = L.DomUtil.create("div", "legend");
    d.innerHTML =
      "<b>Map</b>" +
      '<div class="sizes" style="margin-top:0;padding-top:0;border:0">' +
        '<span class="cap">' + BOLT + "<b>12</b></span>" +
        '<span style="color:var(--text-muted)">Iconic Charger site · stall count</span>' +
      "</div><hr>" +
      "<b>Colour in the list</b>" +
      ["flagship", "significance", "destination"].map(function (k) {
        var n = BADGES.filter(function (b) { return b.reason === k; }).length;
        return '<div class="row"><span class="dot" style="background:' + COLOR[k] + '"></span>' +
          REASON_LABEL[k] + ' <span style="color:var(--text-muted)">· ' + n + "</span></div>";
      }).join("");
    L.DomEvent.disableClickPropagation(d);
    return d;
  };
  legend.addTo(map);

  var filtersEl = document.getElementById("filters");
  REGIONS.forEach(function (region) {
    var n = BADGES.filter(function (b) { return b.region === region; }).length;
    if (!n) return;
    var b = document.createElement("button");
    b.className = "chip";
    b.type = "button";
    b.dataset.region = region;
    b.setAttribute("aria-pressed", "true");
    b.innerHTML = esc(region) + ' <span class="n">' + n + "</span>";
    b.addEventListener("click", function () {
      if (active.has(region)) { active.delete(region); } else { active.add(region); }
      if (active.size === 0) REGIONS.forEach(function (r) { active.add(r); });
      filtersEl.querySelectorAll(".chip").forEach(function (c) {
        c.setAttribute("aria-pressed", active.has(c.dataset.region) ? "true" : "false");
      });
      render();
    });
    filtersEl.appendChild(b);
  });

  var listEl = document.getElementById("list");
  var countEl = document.getElementById("count");
  document.getElementById("total").textContent =
    "· " + DATA.badge_count + " badges · " + DATA.site_count + " sites · " + DATA.snapshot_date;

  // Search index, built once. Concatenating every badge's sites into a
  // haystack on each keystroke was most of the per-key cost, and the strings
  // never change.
  var HAY = {};
  BADGES.forEach(function (b) {
    HAY[b.badge] = (
      b.badge + " " + b.why + " " + b.region + " " +
      sitesOf[b.badge].map(function (s) { return s.name + " " + place(s); }).join(" ")
    ).toLowerCase();
  });

  function visible() {
    var q = query.trim().toLowerCase();
    return BADGES.filter(function (b) {
      if (!active.has(b.region)) return false;
      return !q || HAY[b.badge].indexOf(q) !== -1;
    });
  }

  // The sidebar is built once and then shown/hidden. Re-parsing 40 rows of
  // innerHTML on every keystroke was throwing away scroll position and
  // selection state as well as the DOM.
  var rowEl = {};      // badge name -> button
  var headEl = {};     // region -> sticky header
  var emptyEl = document.createElement("p");
  emptyEl.className = "empty";
  emptyEl.textContent = "No badges match that search.";
  emptyEl.hidden = true;

  REGIONS.forEach(function (region) {
    var inRegion = BADGES.filter(function (b) { return b.region === region; });
    if (!inRegion.length) return;
    var h = document.createElement("div");
    h.className = "region-head";
    listEl.appendChild(h);
    headEl[region] = h;

    inRegion.forEach(function (b) {
      var group = sitesOf[b.badge];
      var sub = b.site_count > 1
        ? b.site_count + " Superchargers · " + group[0].country
        : group[0].name;
      var el = document.createElement("button");
      el.className = "item";
      el.type = "button";
      el.dataset.badge = b.badge;
      el.style.setProperty("--accent", COLOR[b.reason]);
      el.innerHTML =
        '<span class="dot" style="background:' + COLOR[b.reason] + '"></span>' +
        '<span><span class="nm">' + esc(b.badge) + "</span>" +
        (b.confidence === "approx" ? '<span class="approx">approx</span>' : "") +
        '<span class="sub">' + esc(sub) + "</span></span>" +
        '<span class="tag">' + (b.site_count > 1 ? "×" + b.site_count : (group[0].stalls || "—")) + "</span>";
      el.addEventListener("click", function () { select(b.badge, true); });
      listEl.appendChild(el);
      rowEl[b.badge] = el;
    });
  });
  listEl.appendChild(emptyEl);

  // Badge names currently on the map, so a render only touches the difference.
  var shown = new Set();

  function render() {
    var rows = visible();
    var want = new Set(rows.map(function (b) { return b.badge; }));

    // Only add/remove what actually changed. clearLayers() followed by a full
    // re-add destroyed and rebuilt all 53 marker elements on every keystroke,
    // even when the result set was identical.
    Object.keys(marks).forEach(function (name) {
      var on = want.has(name);
      if (on === shown.has(name)) return;
      marks[name].forEach(function (m) {
        if (on) { layer.addLayer(m.marker); } else { layer.removeLayer(m.marker); }
      });
      if (on) { shown.add(name); } else { shown.delete(name); }
    });

    // Filtering the selection away has to clear the row's aria-current too.
    // The old code got this free by rebuilding every row; now the rows persist,
    // so a dropped selection would otherwise leave a row announcing itself as
    // current with no marker selected anywhere.
    if (selected && !want.has(selected)) {
      rowEl[selected].removeAttribute("aria-current");
      selected = null;
    }

    // Writing textContent replaces the text node whether or not the string
    // differs, so every unguarded write is a DOM mutation for nothing.
    var siteTotal = rows.reduce(function (a, b) { return a + b.site_count; }, 0);
    text(countEl, rows.length === BADGES.length
      ? BADGES.length + " badges · " + DATA.site_count + " sites"
      : rows.length + " of " + BADGES.length + " badges · " + siteTotal + " sites");

    BADGES.forEach(function (b) { rowEl[b.badge].hidden = !want.has(b.badge); });
    REGIONS.forEach(function (region) {
      var h = headEl[region];
      if (!h) return;
      var n = 0;
      BADGES.forEach(function (b) { if (b.region === region && want.has(b.badge)) n++; });
      h.hidden = n === 0;
      if (n) text(h, region + " · " + n);
    });
    emptyEl.hidden = rows.length > 0;
  }

  // Typing faster than the display refreshes should still cost one render.
  var queued = false;
  function scheduleRender() {
    if (queued) return;
    queued = true;
    requestAnimationFrame(function () { queued = false; render(); });
  }

  function highlight(name) {
    selected = name;
    Object.keys(marks).forEach(function (k) {
      var on = k === name;
      marks[k].forEach(function (m) {
        var el = m.marker.getElement();   // null while the marker is filtered out
        if (el) el.classList.toggle("is-selected", on);
        m.marker.setZIndexOffset(on ? 1000 : 0);
      });
    });
    listEl.querySelectorAll(".item").forEach(function (el) { el.removeAttribute("aria-current"); });
    var row = listEl.querySelector('.item[data-badge="' + CSS.escape(name) + '"]');
    if (row) {
      row.setAttribute("aria-current", "true");
      row.scrollIntoView({ block: "nearest" });
    }
  }

  // The animation is a nicety, never the mechanism: a hidden tab pauses
  // requestAnimationFrame, so a flight started there would never land and the
  // popup would open over the wrong place. Landing is always forced.
  function frame(name) {
    var group = marks[name];
    var done = false;

    function land() {
      if (done) return;
      done = true;
      if (group.length > 1) {
        map.fitBounds(L.latLngBounds(group.map(function (m) {
          return [m.site.latitude, m.site.longitude];
        })), { padding: [70, 70], maxZoom: 9, animate: false });
      } else {
        map.setView([group[0].site.latitude, group[0].site.longitude],
                    Math.max(map.getZoom(), 9), { animate: false });
      }
      group[0].marker.openPopup();   // opened last, so auto-pan can't cancel the flight
    }

    if (document.hidden || group.length > 1) { land(); return; }
    var target = L.latLng(group[0].site.latitude, group[0].site.longitude);
    map.once("moveend", land);
    map.flyTo(target, Math.max(map.getZoom(), 9), { duration: 0.7 });
    setTimeout(land, 1400);
  }

  function select(name, fly) {
    if (!marks[name]) return;
    if (location.hash.slice(1) !== encodeURIComponent(name)) {
      try { history.replaceState(null, "", "#" + encodeURIComponent(name)); } catch (e) {}
    }
    highlight(name);
    if (fly) frame(name);
  }

  document.getElementById("q").addEventListener("input", function (e) {
    query = e.target.value;
    scheduleRender();
  });

  render();

  // #<badge name> deep-links, so a specific badge is shareable.
  function openFromHash() {
    var name = decodeURIComponent(location.hash.slice(1));
    if (name && marks[name]) select(name, true);
  }
  window.addEventListener("hashchange", openFromHash);
  openFromHash();
});
</script>
</body>
</html>
