  /* -------------------------------------------------------- basemap tint ---
     OpenFreeMap's `dark` style is not merely dim, it is inverted in three
     places, which is why the stock map reads as an empty black field:

       building            rgb(10,10,10) on a rgb(12,12,12) background -- the
                           buildings are DARKER than the land they sit on, and
                           only their outline shows at all
       motorway inner      #000 from z6 up, painted OVER a lighter #3c3c3c
                           casing, so the most important road class renders as
                           two thin edges around a black gap
       major road inner    #121212, darker than highway_minor's #181818 --
                           the hierarchy runs backwards

     Plus black text on water_name and ~2.4:1 street names.

     So: one achromatic ramp where lightness tracks importance. Ratios below
     are relative luminance against LAND, computed rather than eyeballed.
     `dark` is OpenFreeMap's only dark style, so overriding its paint is the
     alternative to adding a second tile provider -- not just the tidier one. */
  var LAND = "#1a1a1a";
  var BASEMAP_PAINT = [
    ["background",              "background-color",   LAND],
    // Darker than land: the conventional dark-map cue, and what makes a
    // coastline legible at low zoom.
    ["water",                   "fill-color",         "#0a0a0a"],
    ["waterway",                "line-color",         "#0a0a0a"],
    // Ice tracked the old near-black background, so lifting the land without
    // these leaves Greenland and Antarctica as dark holes at the world view.
    // A step above land also matches what ice actually looks like.
    ["landcover_ice_shelf",     "fill-color",         "#232323"],
    ["landcover_glacier",       "fill-color",         "#232323"],
    ["landuse_residential",     "fill-color",         "#1e1e1e"],
    ["landcover_wood",          "fill-color",         "#1f1f1f"],
    ["landuse_park",            "fill-color",         "#1f1f1f"],

    ["building",                "fill-color",         "#2e2e2e"],   // 1.28:1
    ["building",                "fill-outline-color", "#3a3a3a"],

    // Casings go DARKER than the land. Upstream they are lighter than the
    // inner they wrap, which is exactly what produces the hollow-black-road
    // look; a dark casing makes each road read as a ribbon with a crisp edge.
    ["highway_major_casing",    "line-color",         "#0f0f0f"],
    ["highway_motorway_casing", "line-color",         "#0f0f0f"],
    ["aeroway-runway-casing",   "line-color",         "#0f0f0f"],

    ["highway_path",            "line-color",         "#2b2b2b"],
    ["highway_minor",           "line-color",         "#454545"],   // 1.81:1
    ["highway_major_subtle",    "line-color",         "#454545"],
    ["highway_major_inner",     "line-color",         "#585858"],   // 2.45:1
    ["highway_motorway_subtle", "line-color",         "#585858"],
    // Flat, replacing the zoom interpolate that ramps to #000 at z6. Safe:
    // this layer is minzoom 6, and highway_motorway_subtle covers below it.
    ["highway_motorway_inner",  "line-color",         "#6c6c6c"],   // 3.31:1

    ["railway",                 "line-color",         "#3d3d3d"],
    ["railway_minor",           "line-color",         "#3d3d3d"],
    ["railway_transit",         "line-color",         "#3d3d3d"],
    ["railway_dashline",        "line-color",         LAND],
    ["railway_minor_dashline",  "line-color",         LAND],
    ["railway_transit_dashline","line-color",         LAND],

    ["aeroway-area",            "fill-color",         "#2b2b2b"],   // was #000
    ["aeroway-runway",          "line-color",         "#2b2b2b"],   // was #000
    ["aeroway-taxiway",         "line-color",         "#242424"],
    ["road_area_pier",          "fill-color",         "#242424"],
    ["road_pier",               "line-color",         "#242424"],

    ["boundary_state",          "line-color",         "#4a4a4a"],
    ["boundary_country_z0-4",   "line-color",         "#565656"],
    ["boundary_country_z5-",    "line-color",         "#565656"],

    ["highway_name_other",      "text-color",         "#a8a8a8"],   // 7.3:1
    ["highway_name_other",      "text-halo-color",    "#000000cc"],
    ["highway_name_motorway",   "text-color",         "#c2c2c2"],
    // Was black text on dark water, legible only through its halo.
    ["water_name",              "text-color",         "#8d8d8d"],
    ["water_name",              "text-halo-color",    "#0a0a0acc"]
  ];
  // Every place_* label shares one treatment; listing them by hand would just
  // be the same two rows nine times.
  ["place_other", "place_suburb", "place_village", "place_town", "place_city",
   "place_city_large", "place_state", "place_country_other", "place_country_minor",
   "place_country_major"].forEach(function (id) {
    BASEMAP_PAINT.push([id, "text-color", "#c2c2c2"]);       // 9.8:1
    BASEMAP_PAINT.push([id, "text-halo-color", "#000000cc"]);
  });

  function tintBasemap() {
    if (!map) return;
    BASEMAP_PAINT.forEach(function (rule) {
      // Guarded: an upstream style revision that renames or drops a layer
      // should fall back to the stock colour, not throw during load.
      if (map.getLayer(rule[0])) map.setPaintProperty(rule[0], rule[1], rule[2]);
    });
  }

  function localizeMapLabels() {
    if (!map || !map.getStyle()) return;
    var fields = locale.mapNames.concat(["name", "name:en", "name_en"]);
    var expression = ["coalesce"].concat(fields.map(function (field) {
      return ["get", field];
    }));
    (map.getStyle().layers || []).forEach(function (layer) {
      if (layer.type !== "symbol" || !layer.layout || !layer.layout["text-field"]) return;
      // Motorway shields are route references, not place names. Other symbol
      // fields are changed only when the source style already asks for a name.
      if (layer.id === "highway_name_motorway" ||
          JSON.stringify(layer.layout["text-field"]).indexOf("name") < 0) return;
      try { map.setLayoutProperty(layer.id, "text-field", expression); } catch (e) {}
    });
  }

  function addBuildings3D() {
    if (!map) return;
    // Reassert this on every style load, even when MapLibre preserves the
    // custom layer during a diffed restyle.
    map.setLight({
      anchor: "viewport",
      position: [1.15, 210, 30],
      "position-transition": { duration: 0 },
      color: "#ffffff",
      "color-transition": { duration: 0 },
      intensity: 0.08,
      "intensity-transition": { duration: 0 }
    });
    if (map.getLayer("iconic-3d-buildings")) return;
    var style = map.getStyle();
    var layers = style.layers || [];
    var sourceId = Object.keys(style.sources || {}).find(function (id) {
      var source = style.sources[id] || {};
      return source.type === "vector" && /tiles\.openfreemap\.org\/planet/.test(source.url || "");
    });
    if (!sourceId) return;

    // OpenFreeMap places water_name before its flat building fill, so the
    // first text layer is not a safe extrusion anchor. Start after the last
    // layer that paints this source's buildings, then stop at the next text
    // label. This keeps the dark footprint below the opaque 3D material while
    // road and place names remain readable above it.
    var lastBuilding = -1;
    layers.forEach(function (layer, index) {
      if (layer.source === sourceId && layer["source-layer"] === "building") {
        lastBuilding = index;
      }
    });
    var label = layers.slice(lastBuilding + 1).find(function (layer) {
      return layer.type === "symbol" && layer.layout && layer.layout["text-field"];
    });
    // The white viewport light keeps the material achromatic while its very
    // low intensity separates adjacent roof and wall planes. Viewport anchoring
    // makes that edge cue stable as the map rotates.
    map.addLayer({
      id: "iconic-3d-buildings",
      type: "fill-extrusion",
      source: sourceId,
      "source-layer": "building",
      minzoom: 15,
      filter: ["all",
        ["==", ["geometry-type"], "Polygon"],
        ["!=", ["get", "hide_3d"], true]
      ],
      paint: {
        // Every roof and wall starts from the same muted gray; only the subtle
        // directional light varies it by face. There is no hue, transparency
        // blending or height-based vertical gradient involved.
        "fill-extrusion-color": "#787876",
        // Grow from the flat footprint to the supplied OSM height over one
        // zoom level. Scaling base and height together keeps elevated parts
        // valid throughout the reveal instead of making them jump at z16.
        "fill-extrusion-height": ["interpolate", ["linear"], ["zoom"],
          15, 0,
          16, ["coalesce", ["to-number", ["get", "render_height"]], 0]
        ],
        "fill-extrusion-base": ["interpolate", ["linear"], ["zoom"],
          15, 0,
          16, ["coalesce", ["to-number", ["get", "render_min_height"]], 0]
        ],
        "fill-extrusion-opacity": 1,
        "fill-extrusion-vertical-gradient": false
      }
    }, label && label.id);
    map.getContainer().dataset.buildings3d = "ready";
  }

  var navigation = null;
  var attribution = null;
  var controlCorner = "";
  // A corner each per layout. The two are separated on a phone because stacking
  // them puts the attribution BELOW a 148px-tall navigation group, which on a
  // 932px screen lands it in the middle of the map rather than against an edge.
  // MapLibre ships compact attribution expanded and minimises it on the first
  // interaction, so its opening size is not something to design around -- but
  // where it opens is.
  //
  // Landscape keeps both off the right edge, which the card has taken; putting
  // either under the card would repeat the original bug, where the sheet hid
  // the zoom buttons and the attribution alike, and the attribution is a
  // licence requirement rather than a nicety.
  var CONTROL_CORNER = {
    desktop: { nav: "bottom-right", attrib: "bottom-right" },
    sheet:   { nav: "top-right",    attrib: "top-left" },
    side:    { nav: "top-left",     attrib: "bottom-left" }
  };
  var CONTROL_CORNER_RTL = {
    desktop: { nav: "bottom-left", attrib: "bottom-left" },
    sheet:   { nav: "top-left",    attrib: "top-right" },
    side:    { nav: "top-right",   attrib: "bottom-right" }
  };
  function syncControlCorner() {
    if (!map) return;
    var want = (rtl() ? CONTROL_CORNER_RTL : CONTROL_CORNER)[layout()];
    var key = want.nav + "|" + want.attrib;
    if (key === controlCorner) return;
    if (controlCorner) {
      map.removeControl(navigation);
      map.removeControl(attribution);
    }
    map.addControl(navigation, want.nav);
    map.addControl(attribution, want.attrib);
    controlCorner = key;
  }
  mqWide.addEventListener("change", syncControlCorner);
  mqShort.addEventListener("change", syncControlCorner);

  if (map) {
    navigation = new maplibregl.NavigationControl({
      showZoom: true, showCompass: true, visualizePitch: true
    });
    attribution = new maplibregl.AttributionControl({
      compact: true,
      customAttribution: '<span class="iconic-attribution">' + esc(ui("siteData")) +
        ' <a href="https://supercharge.info">supercharge.info</a></span>'
    });
    syncControlCorner();

    // Keep the existing discrete-wheel target while retaining MapLibre's
    // native trackpad detection, cursor anchoring and fractional vector zoom.
    map.scrollZoom.setWheelZoomRate(1 / 141);
    map.scrollZoom.setZoomRate(1 / 100);

    // style.load rather than load: it fires on every style load, so the tint
    // survives a restyle instead of only applying to the first one.
    map.on("style.load", function () {
      tintBasemap();
      addBuildings3D();
      localizeMapLabels();
    });
    map.on("load", function () {
      mapLoaded = true;
      hideMapError();
      tintBasemap();
      addBuildings3D();
      localizeMapLabels();
    });
    map.on("error", function (e) {
      var message = e && e.error && e.error.message || "";
      if (!mapLoaded && /style|source|sprite|glyph|fetch|network|webgl/i.test(message)) {
        showMapError("vectorMapError");
      }
    });
    map.getCanvas().addEventListener("webglcontextlost", function () {
      showMapError("contextLost");
    });

  }


  /* ------------------------------------------------------------ helpers --- */
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function place(s) {
    return [s.city, s.state, countryName(s.country)].filter(Boolean).join(", ");
  }
  function shortPlace(s) {
    return [s.city, s.state || countryName(s.country)].filter(Boolean).join(", ");
  }
  function canonicalPlace(s) {
    return [s.city, s.state, s.country].filter(Boolean).join(", ");
  }
  function text(el, s) {
    if (el.textContent !== s) el.textContent = s;
  }

  var BOLT =
    '<svg width="9" height="13" viewBox="0 0 9 13" aria-hidden="true">' +
      '<path d="M5.6 0 0 7.4h3.4L2.3 13 9 5.2H5.1z"/></svg>';
  var BOLT_SM =
    '<svg width="7" height="10" viewBox="0 0 9 13" aria-hidden="true">' +
      '<path d="M5.6 0 0 7.4h3.4L2.3 13 9 5.2H5.1z"/></svg>';

  function haversine(aLat, aLng, bLat, bLng) {
    var R = 6371, r = Math.PI / 180;
    var dLat = (bLat - aLat) * r, dLng = (bLng - aLng) * r;
    var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(aLat * r) * Math.cos(bLat * r) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
  }
  function fmtDist(km) {
    if (km == null) return "";
    var v = MILES ? km * 0.621371 : km;
    try {
      return new Intl.NumberFormat(localeKey, {
        style: "unit", unit: MILES ? "mile" : "kilometer", unitDisplay: "short",
        minimumFractionDigits: v >= 10 ? 0 : 1,
        maximumFractionDigits: v >= 10 ? 0 : 1
      }).format(v);
    } catch (e) {
      return (v >= 10 ? numberFormat.format(Math.round(v)) : oneDecimalFormat.format(v)) +
        (MILES ? " mi" : " km");
    }
  }
  function foldSearch(value) {
    var folded;
    try { folded = String(value || "").toLocaleLowerCase(localeKey); }
    catch (e) { folded = String(value || "").toLowerCase(); }
    return folded.normalize("NFD").replace(/\p{M}/gu, "").replace(/ı/g, "i");
  }

  /* ------------------------------------------------------------ markers --- */
  var marks = {};   // badge name -> [{marker, site, badge}]

  function markerLabel(badge, site) {
    return badge.site_count > 1 ? badge.badge + " — " + site.name : badge.badge;
  }
  function stallsLabel(stalls) {
    if (stalls) return noun("stall", stalls);
    var forms = locale.nouns.stall || LOCALES.en.nouns.stall;
    return interpolate(forms.other, { count: ui("unknown") });
  }
  function relabelPin(el, badge, site) {
    var label = markerLabel(badge, site);
    el.setAttribute("aria-label", ui("markerAria", {
      label: label, stalls: stallsLabel(site.stalls)
    }));
    var count = el.querySelector(".cap b");
    if (count) text(count, site.stalls ? numberFormat.format(site.stalls) : "?");
    var tip = el.querySelector(".tip");
    if (tip) { text(tip, label); tip.setAttribute("dir", "auto"); }
  }
  function pinElement(badge, site) {
    var el = document.createElement("button");
    el.className = "pin";
    el.type = "button";
    el.innerHTML = '<span class="cap">' + BOLT + "<b></b></span>";
    var tip = document.createElement("span");
    tip.className = "tip";
    tip.setAttribute("aria-hidden", "true");
    el.appendChild(tip);
    relabelPin(el, badge, site);
    return el;
  }

  BADGES.forEach(function (badge) {
    marks[badge.badge] = sitesOf[badge.badge].map(function (s) {
      var element = pinElement(badge, s);
      var marker = map ? new maplibregl.Marker({
        element: element,
        anchor: "center",
        pitchAlignment: "viewport",
        rotationAlignment: "viewport"
      }).setLngLat([s.longitude, s.latitude]) : null;
      // No popup any more -- a pin opens the same detail card the list does.
      element.addEventListener("click", function (e) {
        e.stopPropagation();
        select(badge.badge, true, s);
      });
      return { marker: marker, element: element, site: s, badge: badge };
    });
  });
  function relabelMarkers() {
    Object.keys(marks).forEach(function (name) {
      marks[name].forEach(function (entry) {
        relabelPin(entry.element, entry.badge, entry.site);
      });
    });
  }

  /* ------------------------------------------------------------ filters --- */
  var filtersEl = document.getElementById("filters");
  var regionChip = {};

  // "No filter" and "every region ticked" select the same badges but are not
  // the same state to look at: lighting all five chips on load made the
  // selected style carry no information and turned the filter row into a
  // solid white block. So All is the resting state, and the region chips only
  // light up once a genuine subset is chosen.
  var allRegions = true;

  function syncChips() {
    allChip.setAttribute("aria-pressed", allRegions ? "true" : "false");
    REGIONS.forEach(function (r) {
      if (regionChip[r]) {
        regionChip[r].setAttribute("aria-pressed", !allRegions && active.has(r) ? "true" : "false");
      }
    });
  }
  function relabelChips() {
    text(allChip, ui("all"));
    REGIONS.forEach(function (region) {
      if (regionChip[region]) text(regionChip[region], regionName(region));
    });
  }

  function showAll() {
    active = new Set(REGIONS);
    allRegions = true;
    syncChips();
    render();
  }

  var allChip = document.createElement("button");
  allChip.className = "chip";
  allChip.type = "button";
  allChip.textContent = ui("all");
  allChip.addEventListener("click", showAll);
  filtersEl.appendChild(allChip);

  REGIONS.forEach(function (region) {
    var n = BADGES.filter(function (b) { return b.region === region; }).length;
    if (!n) return;
    var b = document.createElement("button");
    b.className = "chip";
    b.type = "button";
    b.dataset.region = region;
    b.textContent = regionName(region);
    b.addEventListener("click", function () {
      // Additive, which is what an explicit All chip implies: the first tap
      // narrows to that region, further taps add regions, and un-ticking the
      // last one falls back to All rather than showing nothing.
      if (allRegions) {
        active = new Set([region]);
        allRegions = false;
      } else if (active.has(region)) {
        active.delete(region);
      } else {
        active.add(region);
      }
      if (active.size === 0 || active.size === REGIONS.length) { showAll(); return; }
      syncChips();
      render();
    });
    filtersEl.appendChild(b);
    regionChip[region] = b;
  });
  syncChips();

  /* --------------------------------------------------------------- list --- */
  var listEl = document.getElementById("list");
  var countEl = document.getElementById("count");
  var HAY = {};
  function rebuildSearchIndex() {
    BADGES.forEach(function (b) {
      var translated = badgeCopy(b);
      HAY[b.badge] = foldSearch([
        b.badge, b.why, b.note || "", b.region,
        LOCALES.en.regions[b.region] || b.region,
        LOCALES.en.reasons[b.reason].long, LOCALES.en.reasons[b.reason].short,
        translated.why, translated.note || "", regionName(b.region),
        reasonName(b.reason, "long"), reasonName(b.reason, "short"),
        sitesOf[b.badge].map(function (s) {
          var englishCountry = LOCALES.en.countries[s.country] || s.country;
          return [s.name, canonicalPlace(s), englishCountry, place(s)].join(" ");
        }).join(" ")
      ].join(" "));
    });
  }
  rebuildSearchIndex();

  function visible() {
    var q = foldSearch(query.trim());
    return BADGES.filter(function (b) {
      if (!active.has(b.region)) return false;
      return !q || HAY[b.badge].indexOf(q) !== -1;
    });
  }

  // The list is built once and then shown/hidden. Re-parsing 40 rows of
  // innerHTML on every keystroke was throwing away scroll position and
  // selection state as well as the DOM.
  var rowEl = {};      // badge name -> button
  var headEl = {};     // region -> sticky header
  var distEl = {};     // badge name -> the distance line in its row
  var subEl = {};      // badge name -> persistent secondary label
  var approxEl = {};   // badge name -> approximation pill
  var stallsEl = {};   // badge name -> persistent stall count
  var emptyEl = document.createElement("p");
  emptyEl.className = "empty";
  emptyEl.textContent = ui("noMatches");
  emptyEl.hidden = true;

  REGIONS.forEach(function (region) {
    var inRegion = BADGES.filter(function (b) { return b.region === region; });
    if (!inRegion.length) return;
    var h = document.createElement("div");
    h.className = "region-head";
    listEl.appendChild(h);
    headEl[region] = h;

    inRegion.forEach(function (b) {
      var group = sitesOf[b.badge];
      var stalls = b.site_count > 1
        ? group.reduce(function (a, s) { return a + (s.stalls || 0); }, 0)
        : (group[0].stalls || "—");

      var el = document.createElement("button");
      el.className = "item";
      el.type = "button";
      el.dataset.badge = b.badge;
      el.innerHTML =
        '<span class="ico">' + BOLT + "</span>" +
        '<span class="txt">' +
          '<span class="nm"><bdi dir="auto">' + esc(b.badge) + "</bdi>" +
            (b.confidence === "approx" ? '<span class="approx"></span>' : "") +
          "</span>" +
          '<span class="sub"></span>' +
        "</span>" +
        '<span class="meta">' +
          '<span class="dist" hidden></span>' +
          '<span class="stalls">' + BOLT_SM + "<span>" + esc(stalls) + "</span></span>" +
        "</span>";
      el.addEventListener("click", function () { select(b.badge, true); });
      listEl.appendChild(el);
      rowEl[b.badge] = el;
      distEl[b.badge] = el.querySelector(".dist");
      subEl[b.badge] = el.querySelector(".sub");
      approxEl[b.badge] = el.querySelector(".approx");
      stallsEl[b.badge] = el.querySelector(".stalls span");
    });
  });
  listEl.appendChild(emptyEl);

  // Region order is simply the order the nodes were built in, so keep a
  // snapshot to restore when Near me is switched back off.
  var naturalOrder = Array.prototype.slice.call(listEl.children);

  function relabelRows() {
    text(emptyEl, ui("noMatches"));
    BADGES.forEach(function (b) {
      var group = sitesOf[b.badge];
      var secondary = subEl[b.badge];
      if (b.site_count > 1) {
        text(secondary, noun("supercharger", b.site_count) + " · " +
          reasonName(b.reason, "short"));
      } else {
        secondary.textContent = "";
        var properPlace = document.createElement("bdi");
        properPlace.dir = "auto";
        properPlace.textContent = shortPlace(group[0]);
        secondary.appendChild(properPlace);
        secondary.appendChild(document.createTextNode(" · " + reasonName(b.reason, "short")));
      }
      if (approxEl[b.badge]) text(approxEl[b.badge], ui("approx"));
      var stalls = b.site_count > 1
        ? group.reduce(function (sum, site) { return sum + (site.stalls || 0); }, 0)
        : group[0].stalls;
      text(stallsEl[b.badge], stalls ? numberFormat.format(stalls) : "—");
    });
  }
  relabelRows();

  // Rows are built once, so distance sorting reorders by appendChild -- which
  // MOVES the existing nodes rather than recreating them, keeping the whole
  // point of the reconciling render intact.
  function applyOrder() {
    var seq = order
      ? order.map(function (n) { return rowEl[n]; }).concat([emptyEl])
      : naturalOrder;
    seq.forEach(function (el) { listEl.appendChild(el); });
  }

  /* --------------------------------------------------------- the render --- */
  var shown = new Set();     // badge names currently on the map

  function render(preserveSelection) {
    var rows = visible();
    var want = new Set(rows.map(function (b) { return b.badge; }));

    // Only add/remove what actually changed. clearLayers() followed by a full
    // re-add destroyed and rebuilt all 53 marker elements on every keystroke,
    // even when the result set was identical.
    Object.keys(marks).forEach(function (name) {
      var on = want.has(name);
      if (on === shown.has(name)) return;
      marks[name].forEach(function (m) {
        if (!m.marker) return;
        if (on) { m.marker.addTo(map); } else { m.marker.remove(); }
      });
      if (on) { shown.add(name); } else { shown.delete(name); }
    });

    // Filtering the selection away has to clear the row's aria-current too.
    // The old code got this free by rebuilding every row; now the rows persist,
    // so a dropped selection would otherwise leave a row announcing itself as
    // current with no marker selected anywhere -- and, since the detail card
    // replaced the popup, a card open for a badge that is no longer listed.
    if (selected && !want.has(selected) && !preserveSelection) {
      rowEl[selected].removeAttribute("aria-current");
      highlight(null);
      selected = null;
      closeDetail(false);
    }

    // Writing textContent replaces the text node whether or not the string
    // differs, so every unguarded write is a DOM mutation for nothing.
    var siteTotal = rows.reduce(function (a, b) { return a + b.site_count; }, 0);
    text(countEl, rows.length === BADGES.length
      ? ui("summaryAll", {
          badges: noun("badge", BADGES.length), sites: noun("supercharger", DATA.site_count)
        })
      : ui("summaryFiltered", {
          visible: numberFormat.format(rows.length), total: numberFormat.format(BADGES.length),
          sites: noun("supercharger", siteTotal)
        }));

    BADGES.forEach(function (b) {
      rowEl[b.badge].hidden = !want.has(b.badge);
      var d = distEl[b.badge];
      d.hidden = !here;
      if (here) text(d, fmtDist(distKm[b.badge]));
    });

    // Sorted by distance, the region headings are meaningless -- and the rows
    // no longer sit under them.
    REGIONS.forEach(function (region) {
      var h = headEl[region];
      if (!h) return;
      if (order) { h.hidden = true; return; }
      var n = 0;
      BADGES.forEach(function (b) { if (b.region === region && want.has(b.badge)) n++; });
      h.hidden = n === 0;
      if (n) text(h, ui("regionCount", {
        region: regionName(region), count: numberFormat.format(n)
      }));
    });
    emptyEl.hidden = rows.length > 0;
  }

  // Typing faster than the display refreshes should still cost one render.
  var queued = false;
  function scheduleRender() {
    if (queued) return;
    queued = true;
    requestAnimationFrame(function () { queued = false; render(); });
  }

  /* --------------------------------------------------------- detail card --- */
  var closeEl    = document.getElementById("dclose");
  var dTitle     = document.getElementById("d-title");
  var dMeta      = document.getElementById("d-meta");
  var dStats     = document.getElementById("d-stats");
  var dWhy       = document.getElementById("d-why");
  var dNotes     = document.getElementById("d-notes");
  var dSites     = document.getElementById("d-sites");
  var dFacts     = document.getElementById("d-facts");
  var dActions   = document.getElementById("d-actions");

  function stat(value, label) {
    return '<div class="stat"><b>' + esc(String(value)) + "</b><span>" + esc(label) + "</span></div>";
  }

  function renderDetail(badge, site) {
    var group = sitesOf[badge.badge];
    var copy = badgeCopy(badge);
    selectedSite = site;

    text(dTitle, badge.badge);
    dTitle.setAttribute("dir", "auto");
    text(dMeta, reasonName(badge.reason, "long") + " · " + regionName(badge.region));

    // Aggregates and per-site figures must not share the strip: "9
    // Superchargers / 54 stalls total / 250 kW" reads as though 250 kW
    // described all nine. Power is per-site, so for a multi-site badge it
    // belongs in the facts below, which describe the focused Supercharger.
    var stats = "";
    if (badge.site_count > 1) {
      stats += stat(numberFormat.format(badge.site_count), ui("superchargersHeading"));
      stats += stat(numberFormat.format(group.reduce(function (a, s) {
        return a + (s.stalls || 0);
      }, 0)), ui("statsStallsTotal"));
    } else {
      stats += stat(site.stalls ? numberFormat.format(site.stalls) : "—", ui("statsStalls"));
      if (site.power_kw) stats += stat(formatPower(site.power_kw), ui("statsPeak"));
    }
    if (here) stats += stat(fmtDist(distKm[badge.badge]), ui("statsAway"));
    dStats.innerHTML = stats;

    text(dWhy, copy.why);

    var notes = "";
    if (copy.note) notes += '<p class="dnote">' + esc(copy.note) + "</p>";
    if (badge.confidence === "approx") {
      notes += '<p class="dnote">' + esc(ui(badge.site_count > 1 ? "approxMany" : "approxOne")) +
        "</p>";
    }
    dNotes.innerHTML = notes;

    // Multi-site badges list their Superchargers; picking one re-points the
    // facts below and flies to it.
    if (badge.site_count > 1) {
      dSites.innerHTML = '<div class="sitelist"><p class="lbl">' +
        esc(ui("superchargersHeading")) + "</p>" +
        group.map(function (s, i) {
          return '<button class="srow" type="button" data-i="' + i + '"' +
            (s === site ? ' aria-current="true"' : "") + ">" +
            '<bdi class="snm" dir="auto">' + esc(s.name) + "</bdi>" +
            '<span class="sst">' + (s.stalls ? numberFormat.format(s.stalls) : "—") +
            "</span></button>";
        }).join("") + "</div>";
    } else {
      dSites.innerHTML = "";
    }

    var facts = [
      [ui("factSupercharger"), '<bdi dir="auto">' + esc(site.name) + "</bdi>"],
      [ui("factAddress"), '<bdi dir="auto">' +
        esc([site.address, place(site)].filter(Boolean).join(", ")) + "</bdi>"],
      [ui("factCoordinates"), '<bdi dir="ltr" class="mono">' + site.latitude.toFixed(5) + ", " +
        site.longitude.toFixed(5) + "</bdi>"]
    ];
    if (badge.site_count > 1 && site.power_kw) {
      facts.push([ui("factPower"), esc(formatPower(site.power_kw))]);
    }
    if (site.elevation_m != null) {
      facts.push([ui("factElevation"), esc(formatElevation(site.elevation_m))]);
    }
    facts.push([ui("factListed"), esc(formatDate(site.opened))]);
    dFacts.innerHTML = facts.map(function (f) {
      return "<dt>" + esc(f[0]) + "</dt><dd>" + f[1] + "</dd>";
    }).join("");

    var actions =
      '<a class="btn primary" target="_blank" rel="noopener" ' +
        'href="https://www.google.com/maps/search/?api=1&amp;query=' +
        site.latitude + "," + site.longitude + '">' + esc(ui("actionGoogle")) + "</a>";
    if (site.tesla_location_id) {
      actions += '<a class="btn" target="_blank" rel="noopener" ' +
        'href="https://www.tesla.com/findus/location/supercharger/' +
        encodeURIComponent(site.tesla_location_id) + '">' + esc(ui("actionTesla")) + "</a>";
    }
    dActions.innerHTML = actions;
  }

  function cameraForSites(sites, maxZoom) {
    if (!map) return null;
    return map.cameraForBounds(boundsForSites(sites), {
      padding: framePad(), maxZoom: Math.min(maxZoom, map.getMaxZoom())
    });
  }

  dSites.addEventListener("click", function (e) {
    var btn = e.target.closest(".srow");
    if (!btn || !selected) return;
    var s = sitesOf[selected][+btn.dataset.i];
    renderDetail(byName[selected], s);
    if (map) {
      var camera = cameraForSites([s],
        Math.max(map.getZoom(), zoomFor3D([s.longitude, s.latitude])));
      if (camera) map.flyTo(Object.assign({ duration: 600 }, camera));
    }
  });

  var dBody = detailEl.querySelector(".dbody");

  // The list stays put underneath. Opening this used to swap the panel's whole
  // contents, which cost you your place in the list every time you looked at
  // anything.
  function showDetail(badge, site) {
    renderDetail(badge, site);
    detailEl.hidden = false;
    dBody.scrollTop = 0;
    // Instantly, not animated: frame() measures this card as an obstacle the
    // moment showDetail returns, and a card mid-animation reports a geometry it
    // is about to leave. The card is appearing from nothing anyway, so there is
    // no motion worth preserving.
    sheetSnap(detailSheet, "half", true);
    closeEl.focus();
  }

  function closeDetail(refocus) {
    if (detailEl.hidden) return;
    detailEl.hidden = true;
    // Next open starts from the middle detent rather than wherever this one was
    // dragged to, and nothing is left behind for another layout to inherit.
    detailSheet.at = "half";
    cancelFinish(detailSheet);
    detailEl.style.removeProperty("--h");
    detailEl.style.removeProperty("--y");
    detailEl.classList.remove("is-dragging", "no-anim");
    if (refocus) {
      var row = selected && rowEl[selected];
      if (row && !row.hidden && row.getClientRects().length) {
        row.focus({ preventScroll: true });
      } else {
        qEl.focus({ preventScroll: true });
      }
    }
    // The list is what the URL describes again; the pin stays highlighted so
    // it is still obvious where you were.
    try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
  }

  closeEl.addEventListener("click", function () { closeDetail(true); });
  // Escape closes it too, but a map click deliberately does not: panning near
  // a pin should not throw away what you were reading.
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeDetail(true);
  });

  /* --------------------------------------------------------- bottom sheet ---
     On a phone the two cards are draggable sheets rather than fixed furniture.
     A 64%-tall list with no way to move it leaves the map -- the actual content
     -- a third of the screen, and every pin underneath it untappable.

     Three detents:

       FULL  bounded by the CONTROL COLUMN, not by a percentage of the screen.
             That makes "the zoom buttons and the attribution are reachable"
             true at every detent by construction rather than by a test, which
             matters because the attribution is a licence requirement and the
             first version of this layout hid it behind the sheet entirely.
       PEEK  measured from where the search field (or the detail card's stat
             strip) actually ended up, because the header wraps differently at
             every width and a hardcoded number would clip it on some phone.
       HALF  the midpoint, so the ordering peek < half < full holds whatever
             those two measure.

     Inert unless layout() === "sheet". Desktop and landscape dock their cards
     to an edge, where there is nothing to drag. */

  var SHEET = {
    gap: 12,       // between the bottom of the control column and a full sheet
    flick: 0.5,    // px/ms -- above this a release is a throw, not a placement
    rubber: 0.28,  // how much of your movement survives past either end
    minPeek: 132,
    slop: 8        // finger travel before a touch on the list becomes a drag
  };
  var DETENT_ORDER = ["peek", "half", "full"];

  // Opens at HALF, not FULL. A map app that starts with the index covering the
  // map has buried its own content -- and at FULL every pin is behind the
  // sheet, so there is nothing to tap even if you can see it.
  var panelSheet = {
    el: panelEl, grab: document.getElementById("panel-grab"),
    scroll: listEl, peekSel: ".search", dismissible: false, at: "half"
  };
  var detailSheet = {
    el: detailEl, grab: document.getElementById("detail-grab"),
    scroll: dBody, peekSel: ".stats", dismissible: true, at: "half"
  };
  var allSheets = [panelSheet, detailSheet];

  function sheetMode() { return layout() === "sheet"; }

  // Measured from the live controls rather than assumed, so adding one later
  // cannot silently push the attribution under a full sheet.
  //
  // Deliberately the control GROUPS and not their corner container: MapLibre
  // floats the groups, so the container collapses to zero height and reports an
  // empty rect. Measuring it returned a 72px reserve against a control column
  // that actually runs to 201px, which put the attribution -- a licence
  // requirement -- behind a full sheet.
  function controlReserve() {
    var groups = document.querySelectorAll(
      ".maplibregl-ctrl-top-right > *, .maplibregl-ctrl-top-left > *");
    var bottom = 0;
    for (var i = 0; i < groups.length; i++) {
      var r = groups[i].getBoundingClientRect();
      if (r.height) bottom = Math.max(bottom, r.bottom);
    }
    return bottom ? bottom + SHEET.gap : 72;
  }

  function detents(s) {
    // getComputedStyle resolves the whole calc(), including the safe-area inset
    // and the keyboard offset, to the pixel value actually in effect.
    var bottom = parseFloat(getComputedStyle(s.el).bottom) || 0;
    var full = Math.max(220, window.innerHeight - bottom - controlReserve());
    var target = s.el.querySelector(s.peekSel);
    // Translate-invariant: both rects move together, so this measures the same
    // distance whatever the sheet's current offset. It relies on the header
    // being `flex: none` in this layout -- a shrinking header would make the
    // peek height depend on the peek height.
    var raw = target
      ? target.getBoundingClientRect().bottom - s.el.getBoundingClientRect().top + 12
      : SHEET.minPeek;
    var peek = Math.min(Math.max(raw, SHEET.minPeek), full * 0.5);
    return { peek: peek, half: peek + (full - peek) * 0.5, full: full };
  }

  function currentY(s) { return parseFloat(s.el.style.getPropertyValue("--y")) || 0; }
  function currentH(s) {
    return parseFloat(s.el.style.getPropertyValue("--h")) ||
           s.el.getBoundingClientRect().height;
  }
  function setY(s, y) { s.el.style.setProperty("--y", y + "px"); }

  // --y holds a transition's END value from the moment it is set, so it is the
  // wrong number for anything that needs to know where the sheet is RIGHT NOW.
  function liveY(s) {
    var t = getComputedStyle(s.el).transform;
    if (!t || t === "none") return 0;
    var m = /matrix\(([^)]+)\)/.exec(t);
    if (m) return parseFloat(m[1].split(",")[5]) || 0;
    var m3 = /matrix3d\(([^)]+)\)/.exec(t);
    return m3 ? parseFloat(m3[1].split(",")[13]) || 0 : 0;

  // Apply a geometry change with the transition suppressed, committing it
  // before the class comes back off so the next change animates from here.
  function noAnim(s, fn) {
    s.el.classList.add("no-anim");
    fn();
    void s.el.offsetHeight;
    s.el.classList.remove("no-anim");

  function syncGrab(s) {
    if (s.grab) s.grab.setAttribute("aria-expanded", s.at === "peek" ? "false" : "true");
  }

  function cancelFinish(s) {
    if (!s.finish) return;
    s.el.removeEventListener("transitionend", s.finish);
    clearTimeout(s.finishT);
    s.finish = null;
  }

  // Height is the RESTING representation and the transform is the MOVING one:
  // animating height reflows the scroll container every frame, while a resting
  // transform would hang .dfoot -- and its primary action -- below the bottom
  // of the screen. So the animation runs on the offset and the height is
  // swapped back in once the motion stops.
  //
  // The layout height is held at the TALLER of the two for the duration, so the
  // offset only ever needs to be positive. A negative offset does not collapse
  // a bottom-anchored card, it lifts the whole card off the bottom edge: going
  // 709px -> 231px that way sent the sheet flying up to [213, 444] and back
  // instead of sliding down.
  function settleTo(s, h, name) {
    var el = s.el;
    var shown = currentH(s) - currentY(s);
    var anim = Math.max(shown, h);
    cancelFinish(s);
    noAnim(s, function () {
      el.style.setProperty("--h", anim + "px");
      setY(s, anim - shown);
    });
    setY(s, anim - h);
    s.at = name;
    syncGrab(s);

    s.finish = function (e) {
      if (e && (e.target !== el || e.propertyName !== "transform")) return;
      cancelFinish(s);
      noAnim(s, function () {
        el.style.setProperty("--h", h + "px");
        setY(s, 0);
      });
    };
    el.addEventListener("transitionend", s.finish);
    // An offset that did not actually change fires no transition at all, which
    // would leave the height swap pending forever.
    s.finishT = setTimeout(function () { if (s.finish) s.finish(null); }, 420);
  }

  function sheetSnap(s, name, instant) {
    if (!sheetMode() || s.el.hidden) return;
    var h = detents(s)[name];
    if (!instant) { settleTo(s, h, name); return; }
    cancelFinish(s);
    noAnim(s, function () {
      s.el.style.setProperty("--h", h + "px");
      setY(s, 0);
    });
    s.at = name;
    syncGrab(s);
  }

  // Re-resolve every detent against the current viewport. Called at start and
  // whenever the viewport changes shape, so the sheet keeps its detent rather
  // than its pixel height across a rotation or a URL-bar collapse.
  function sheetSync() {
    allSheets.forEach(function (s) {
      if (!sheetMode()) {
        cancelFinish(s);
        s.el.style.removeProperty("--h");
        s.el.style.removeProperty("--y");
        s.el.classList.remove("is-dragging", "no-anim");
        return;
      }
      if (s.el.hidden) return;
      sheetSnap(s, s.at, true);
    });

  /* ------------------------------------------------------------- the drag --- */
  var drag = null;
  var suppressClick = false;

  function beginDrag(s, y, t) {
    if (!sheetMode() || drag || s.el.hidden) return false;
    // A grab that lands mid-snap has to start from what is on screen, not from
    // where the snap was heading -- pin the offset to its live value first.
    var at = liveY(s);
    cancelFinish(s);
    noAnim(s, function () { setY(s, at); });
    drag = { s: s, y0: y, last: y, lastT: t, v: 0, h: currentH(s),
             shown0: currentH(s) - at, d: detents(s), moved: false };
    s.el.classList.add("is-dragging");
    return true;
  }

  function moveDrag(y, t) {
    if (!drag) return;
    var s = drag.s, d = drag.d;
    var shown = drag.shown0 - (y - drag.y0);
    // Past either end the sheet still follows the finger, but reluctantly --
    // the give is what tells you that you have reached the end. The detail card
    // is exempt below peek, because that is the throw that dismisses it.
    if (shown > d.full) shown = d.full + (shown - d.full) * SHEET.rubber;
    else if (shown < d.peek && !s.dismissible) {
      shown = d.peek - (d.peek - shown) * SHEET.rubber;
    }
    setY(s, drag.h - shown);
    if (Math.abs(y - drag.y0) > 4) drag.moved = true;
    var dt = t - drag.lastT;
    if (dt > 0) { drag.v = (y - drag.last) / dt; drag.last = y; drag.lastT = t; }
  }

  function nearestIndex(vals, x) {
    var best = 0;
    for (var i = 1; i < vals.length; i++) {
      if (Math.abs(vals[i] - x) < Math.abs(vals[best] - x)) best = i;
    }
    return best;
  }

  function endDrag() {
    if (!drag) return;
    var s = drag.s, d = drag.d, v = drag.v;
    var shown = drag.h - currentY(s);
    s.el.classList.remove("is-dragging");
    suppressClick = drag.moved;
    drag = null;

    // Thrown down past the peek, or simply released below it, closes the detail
    // card. The list never dismisses: it is the app's primary surface and there
    // would be no gesture left to bring it back.
    if (s.dismissible &&
        (shown < d.peek * 0.62 || (v > SHEET.flick && shown <= d.peek + 8))) {
      closeDetail(false);
      return;
    }

    var vals = DETENT_ORDER.map(function (n) { return d[n]; });
    var idx;
    // A throw goes to the next detent ALONG, not to the nearest one -- that is
    // the whole difference between flicking a sheet and nudging it.
    if (v > SHEET.flick) {
      idx = 0;
      for (var i = vals.length - 1; i >= 0; i--) { if (vals[i] < shown - 1) { idx = i; break; } }
    } else if (v < -SHEET.flick) {
      idx = vals.length - 1;
      for (var j = 0; j < vals.length; j++) { if (vals[j] > shown + 1) { idx = j; break; } }
    } else {
      idx = nearestIndex(vals, shown);
    }
    settleTo(s, vals[idx], DETENT_ORDER[idx]);
  }

  allSheets.forEach(function (s) {
    // Drag from the grabber or from the card's non-scrolling header. Both carry
    // touch-action: none, or the browser claims the gesture before pointermove
    // ever fires.
    var handles = [s.grab, s.el.querySelector(".head"), s.el.querySelector(".dhead")]
      .filter(Boolean);
    handles.forEach(function (h) {
      h.addEventListener("pointerdown", function (e) {
        if (e.pointerType === "mouse" && e.button !== 0) return;
        // The search field, the chips and the close button keep their own jobs.
        if (e.target !== s.grab && e.target.closest("input, button, a")) return;
        if (!beginDrag(s, e.clientY, e.timeStamp)) return;
        try { h.setPointerCapture(e.pointerId); } catch (err) {}
      });
      h.addEventListener("pointermove", function (e) { moveDrag(e.clientY, e.timeStamp); });
      h.addEventListener("pointerup", endDrag);
      h.addEventListener("pointercancel", endDrag);
    });

    // Tap or Enter on the grabber cycles the detents, so the sheet is operable
    // without a drag at all -- by keyboard, by switch control, or by anyone for
    // whom press-and-slide is not a reliable gesture.
    if (s.grab) {
      s.grab.addEventListener("click", function () {
        if (suppressClick) { suppressClick = false; return; }
        if (!sheetMode()) return;
        var i = DETENT_ORDER.indexOf(s.at);
        sheetSnap(s, DETENT_ORDER[(i + 1) % DETENT_ORDER.length]);
      });

    // express it: inside a scroll container the browser owns vertical panning
    // and cancels the pointer stream the moment it decides to scroll. A
    // non-passive touchmove is the only place to judge, per frame, whether this
    // is still a scroll or has become a drag.

      var y = e.touches[0].clientY;

        if (s.scroll.scrollTop > 0) { pull = null; return; }
        if (!beginDrag(s, pull, e.timeStamp)) { pull = null; return; }
      }
      e.preventDefault();
      moveDrag(y, e.timeStamp);
    }, { passive: false });
    s.scroll.addEventListener("touchend", function () { pull = null; endDrag(); }, { passive: true });
    s.scroll.addEventListener("touchcancel", function () { pull = null; endDrag(); }, { passive: true });
  });

  /* ------------------------------------------------------ select and fly --- */
  var byName = {};
  BADGES.forEach(function (b) { byName[b.badge] = b; });

  function highlight(name) {
    Object.keys(marks).forEach(function (k) {
      var on = k === name;
      marks[k].forEach(function (m) {
        m.element.classList.toggle("is-selected", on);

      if (k === name) { rowEl[k].setAttribute("aria-current", "true"); }
      else { rowEl[k].removeAttribute("aria-current"); }

  }

  // requestAnimationFrame, so a flight started there would never land and the
  // card would describe a place the map never reached. Landing is always forced.
  function frame(name, site) {
    var group = marks[name];
    // Open the card BEFORE measuring: framePad() treats it as an obstacle, and
    // a card that is still hidden measures zero -- which would fly the site to
    // exactly the spot the card is about to cover. Opening on click rather
    // than on landing is also simply more responsive.
    showDetail(byName[name], site || group[0].site);
    if (!map) return;

    // A pin click always names one Supercharger, and so does a single-site
    // badge -- both take the closest permitted view. A multi-site badge names
    // sites spread over hundreds of kilometres, so it keeps the wide view;
    // picking a Supercharger inside the card moves to that individual site.
    var target = site || (group.length === 1 ? group[0].site : null);
    var camera = target
      ? cameraForSites([target], Math.max(map.getZoom(),
          zoomFor3D([target.longitude, target.latitude])))
      // MapLibre's 512px world makes this one level lower than the old Leaflet
      // target while preserving the same visible ground scale.
      : cameraForSites(group.map(function (m) { return m.site; }), 8);
    if (!camera) return;
    var done = false;

    function land() {
      if (done) return;
      done = true;
      map.stop();
      map.jumpTo(camera);
    }

    if (document.hidden) { land(); return; }
    map.once("moveend", land);
    map.flyTo(Object.assign({ duration: 700 }, camera));
    setTimeout(land, 1400);
  }

  function select(name, fly, site) {
    if (!marks[name]) return;
    if (location.hash.slice(1) !== encodeURIComponent(name)) {
      try { history.replaceState(null, "", "#" + encodeURIComponent(name)); } catch (e) {}
    }
    selected = name;
    highlight(name);
    if (fly) { frame(name, site); } else { showDetail(byName[name], site || sitesOf[name][0]); }
  }

  /* ------------------------------------------------------------ search --- */
  var qEl = document.getElementById("q");
  var clearEl = document.getElementById("clear");

  qEl.addEventListener("input", function (e) {
    query = e.target.value;
    clearEl.hidden = !query;
    scheduleRender();
  });
  clearEl.addEventListener("click", function () {
    qEl.value = ""; query = ""; clearEl.hidden = true;
    qEl.focus();
    scheduleRender();
  });

  /* ----------------------------------------------------------- near me --- */
  var nearEl = document.getElementById("near");
  var nearLbl = document.getElementById("nearlbl");
  var nearMsg = document.getElementById("nearmsg");
  var nearMessageKey = null;
  var locating = false;

  function say(key) {
    nearMessageKey = key || null;
    text(nearMsg, key ? ui(key) : "");
    nearMsg.hidden = !key;
  }

  nearEl.addEventListener("click", function () {
    if (here) {                                   // toggle back to region order
      here = null; order = null; distKm = {};
      nearEl.setAttribute("aria-pressed", "false");
      say("");
      applyOrder();
      render();
      return;
    }
    if (!navigator.geolocation) { say("locationUnsupported"); return; }

    nearEl.disabled = true;
    locating = true;
    text(nearLbl, ui("locating"));
    say("");
    navigator.geolocation.getCurrentPosition(function (pos) {
      here = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      // Distance to the badge's NEAREST Supercharger, not to the stored
      // centroid -- for Great Barrier Reef the centroid is the sea.
      BADGES.forEach(function (b) {
        distKm[b.badge] = sitesOf[b.badge].reduce(function (min, s) {
          return Math.min(min, haversine(here.lat, here.lng, s.latitude, s.longitude));
        }, Infinity);
      });
      order = BADGES.map(function (b) { return b.badge; })
        .sort(function (a, b) { return distKm[a] - distKm[b]; });

      locating = false;
      nearEl.setAttribute("aria-pressed", "true");
      text(nearLbl, ui("nearMe"));
      applyOrder();
      render();
      listEl.scrollTop = 0;
    }, function (err) {
      nearEl.disabled = false;
      locating = false;
      text(nearLbl, ui("nearMe"));
      say(err && err.code === 1 ? "locationDenied" : "locationFailed");
    }, { timeout: 10000, maximumAge: 600000 });
  });

  /* ------------------------------------------------- the on-screen keyboard --
     iOS does not shrink the layout viewport when the keyboard opens, so a
     bottom-anchored sheet stays exactly where it was: behind the keyboard,
     along with the list you are typing to filter. Android mostly does shrink
     it, in which case the figure below is 0 and nothing happens.

     visualViewport is the only surface that reports this. offsetTop matters as
     well as height: iOS scrolls the visual viewport up to keep the focused
     field visible, and the keyboard's real extent is what is left below it. */

    // property, invalidating the sheet's geometry constantly.

    lastKb = kb;

    window.visualViewport.addEventListener("resize", syncKeyboardInset);
    window.visualViewport.addEventListener("scroll", syncKeyboardInset);
  }

  });

  /* ---------------------------------------------------- language and region --- */
  var languageEl = document.getElementById("language");
  var countryController = null;

  var started = false;

      [".maplibregl-ctrl-zoom-in", "zoomIn"],
      [".maplibregl-ctrl-zoom-out", "zoomOut"],
      [".maplibregl-ctrl-compass", "resetBearing"],

    }));

    if (activeEl.matches("a[href]")) return { href: activeEl.getAttribute("href") };
    return null;

      token.site != null ? dSites.querySelector('.srow[data-i="' + token.site + '"]') :
      token.href ? Array.prototype.find.call(dActions.querySelectorAll("a[href]"), function (a) {

    var previousPad = started && map ? activeFramePad() : null;
    var wasAtOverview = previousPad && map.getZoom() <= map.getMinZoom() + 0.001;
    localeKey = nextLocale;
    locale = LOCALES[localeKey];

    document.documentElement.lang = localeKey;
    document.documentElement.dir = locale.dir;

    syncLanguageOptions();
    relabelChips();
    relabelRows();
    relabelMarkers();
    rebuildSearchIndex();
    if (selected && !detailEl.hidden) renderDetail(byName[selected], selectedSite || sitesOf[selected][0]);
    // A query can match only the old translation. Locale changes relabel the
    // results but must not silently discard the user's open selection/detail.
    if (started) {

      // usable part of the map. Re-resolve the active detent before restoring

    dBody.scrollTop = detailScroll;

          // mirrored card or a remeasured sheet moves that viewport's centre.

  function syncLocaleUrl(nextRouteLocale) {
    if (!staticSite) return;
    routeLocale = nextRouteLocale || null;

      : "/";

      history.replaceState(null, "", path + location.search + location.hash);
    } catch (e) {}
    var routeMeta = window.ICONIC_ROUTE_META && window.ICONIC_ROUTE_META[routeLocale || I18N.defaultLocale];
    var canonical = routeMeta ? routeMeta.canonical : "https://iconicchargers.com" + path;

    var ogUrl = document.querySelector('meta[property="og:url"]');
    if (canonicalLink) canonicalLink.href = canonical;
    if (ogUrl) ogUrl.content = canonical;

    document.title = routeMeta.title;
    var metadata = [
      ['meta[name="description"]', "content", routeMeta.description],
      ['meta[property="og:title"]', "content", routeMeta.title],
      ['meta[property="og:description"]', "content", routeMeta.description],
      ['meta[property="og:image:alt"]', "content", routeMeta.description],
      ['meta[property="og:locale"]', "content", routeMeta.ogLocale],
      ['meta[name="twitter:title"]', "content", routeMeta.title],
      ['meta[name="twitter:description"]', "content", routeMeta.description],
      ['meta[name="twitter:image:alt"]', "content", routeMeta.description]
    ];
    metadata.forEach(function (entry) {
      var element = document.querySelector(entry[0]);
      if (element) element.setAttribute(entry[1], entry[2]);
    });

    var jsonLd = document.querySelector('script[type="application/ld+json"]');
    if (jsonLd) {
      jsonLd.textContent = JSON.stringify({
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Person",
            "@id": "https://iconicchargers.com/#lakshman-turlapati",
            "name": "Lakshman Turlapati",
            "url": "https://www.parzival.live/",
            "sameAs": ["https://github.com/LakshmanTurlapati"]
          },
          {
            "@type": "WebSite",
            "@id": "https://iconicchargers.com/#website",
            "name": "Iconic Chargers",
            "url": "https://iconicchargers.com/",
            "inLanguage": I18N.order.slice(),
            "description": window.ICONIC_ROUTE_META.en.description,
            "creator": { "@id": "https://iconicchargers.com/#lakshman-turlapati" },
            "publisher": { "@id": "https://iconicchargers.com/#lakshman-turlapati" }
          },
          {
            "@type": "WebPage",
            "@id": canonical + "#webpage",
            "name": routeMeta.title,
            "url": canonical,
            "inLanguage": routeLocale || I18N.defaultLocale,
            "description": routeMeta.description,
            "isPartOf": { "@id": "https://iconicchargers.com/#website" },
            "author": { "@id": "https://iconicchargers.com/#lakshman-turlapati" }
          }
        ]
      });
    }
  }

  function stopCountryLookup() {
    clearTimeout(countryTimer);
    countryTimer = 0;
    if (countryController) countryController.abort();
    countryController = null;
  }
  function lookupCountry() {
    if (localeOverride || ipCountry || countryController || !window.fetch || !window.AbortController) return;
    countryController = new AbortController();
    var controller = countryController;
    countryTimer = setTimeout(function () { controller.abort(); }, 1500);
    fetch("https://api.country.is/", {
      credentials: "omit",
      referrerPolicy: "no-referrer",
      signal: controller.signal
    }).then(function (response) {
      if (!response.ok) throw new Error("country lookup failed");
      return response.json();
    }).then(function (body) {
      if (localeOverride || controller !== countryController) return;
      var country = body && typeof body.country === "string" ? body.country.toUpperCase() : "";
      if (!/^[A-Z]{2}$/.test(country)) return;
      ipCountry = country;
      MILES = country === "US";
      storageSet("sessionStorage", COUNTRY_KEY, JSON.stringify({
        country: country, expires: Date.now() + COUNTRY_TTL
      }));
      applyLocale(localeForCountry(country));
    }).catch(function () {
      // Language negotiation is an enhancement; browser language remains live
      // when the service is blocked, slow, offline, or returns malformed data.
    }).then(function () {
      if (controller !== countryController) return;
      clearTimeout(countryTimer);
      countryTimer = 0;
      countryController = null;
    });
  }

  languageEl.addEventListener("change", function () {
    var choice = languageEl.value;
    if (choice === "auto") {
      if (staticSite) {
        localeOverride = I18N.defaultLocale;
        syncLocaleUrl(I18N.defaultLocale);
        applyLocale(I18N.defaultLocale);
        return;
      }
      localeOverride = null;
      syncLocaleUrl(null);
      storageSet("localStorage", LOCALE_KEY, null);
      ipCountry = cachedCountry();
      MILES = ipCountry ? ipCountry === "US" : /^en-US\b/i.test(navigator.language || "");
      applyLocale(ipCountry ? localeForCountry(ipCountry) : browserLocale);
      lookupCountry();
      return;
    }
    if (!Object.prototype.hasOwnProperty.call(LOCALES, choice)) return;
    stopCountryLookup();
    localeOverride = choice;
    syncLocaleUrl(choice);
    storageSet("localStorage", LOCALE_KEY, choice);
    applyLocale(choice);
  });

  window.__ICONIC_I18N__ = {
    applyLocale: applyLocale,
    matchLocale: matchLocale,
    localeForCountry: localeForCountry,
    get locale() { return localeKey; },
    get country() { return ipCountry; },
    get miles() { return MILES; }
  };

  /* -------------------------------------------------------------- start --- */
  applyLocale(localeKey);
  render();
  started = true;

  // The populated list is what the sheet measures its detents against, so this
  // has to follow render() -- and precede the first camera, which treats the
  // sheet as an obstacle.
  sheetSync();

  // On narrow screens the populated list determines the bottom sheet's final
  // height, so establish both the initial camera and its zoom-out floor only
  // after render() has completed layout, and before a deep link can select a
  // site and replace the overview with its own framing.
  if (map) syncOverviewFloor(true);

  // #<badge name> deep-links, so a specific badge is shareable.
  function openFromHash() {
    var name;
    try { name = decodeURIComponent(location.hash.slice(1)); } catch (e) { name = ""; }
    if (name && marks[name]) { select(name, true); return; }
    // Back/forward navigation to an empty or unknown fragment must not leave a
    // detail card describing a URL that no longer selects that badge.
    if (selected) {
      rowEl[selected].removeAttribute("aria-current");
      highlight(null);
      selected = null;
      selectedSite = null;
      closeDetail(false);
    }
  }
  window.addEventListener("hashchange", openFromHash);
  openFromHash();
  lookupCountry();

  // Both cards' geometry is part of every framing decision, so a resize that
  // swaps the side panel for the bottom sheet has to be re-framed.
  //
  // On a phone `resize` also fires every time the URL bar slides away, which is
  // constantly. Only the global overview camera is responsive: selected and
  // explored cameras stay where the user put them unless setMinZoom() has to
  // clamp them to a newly higher floor.
  var rt = 0;
  window.addEventListener("resize", function () {
    clearTimeout(rt);
    rt = setTimeout(function () {
      sheetSync();
      if (!map) return;
      var wasAtOverview = map.getZoom() <= map.getMinZoom() + 0.001;
      map.resize();
      var overview = syncOverviewFloor(false);
      if (wasAtOverview && overview) {
        map.stop();
        map.jumpTo(overview);
      }
    }, 200);
  });
});
</script>
