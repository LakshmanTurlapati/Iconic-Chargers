<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iconic Tesla Superchargers — world map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  :root {
    color-scheme: dark;
    /* chrome & ink */
    --surface-1:      #1b1b1b;
    --page:           #0d0d0d;
    --panel:          #141414;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --hairline:       #2c2c2a;
    --rule:           #383835;
    /* categorical slots 1-3 — validated all-pairs against --surface-1
       (CVD ΔE 9.4, normal-vision ΔE 20.9, all ≥3:1 contrast) */
    --group-firsts:       #3987e5;
    --group-records:      #d95926;
    --group-destinations: #199e70;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; margin: 0; }

  body {
    display: grid;
    grid-template-columns: 360px 1fr;
    grid-template-rows: auto 1fr;
    grid-template-areas: "head head" "side map";
    background: var(--page);
    color: var(--text-primary);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  /* ---------------------------------------------------------------- header */
  header {
    grid-area: head;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px 20px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--hairline);
    background: var(--panel);
  }
  h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
  h1 span { color: var(--text-muted); font-weight: 400; }

  /* one filter row, above everything it scopes */
  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    min-height: 28px; padding: 0 11px;
    border: 1px solid var(--rule); border-radius: 999px;
    background: transparent; color: var(--text-secondary);
    font: inherit; font-size: 12.5px; cursor: pointer;
  }
  .chip:hover { background: #ffffff0d; }
  .chip:focus-visible { outline: 2px solid var(--group-firsts); outline-offset: 2px; }
  .chip[aria-pressed="false"] { color: var(--text-muted); opacity: 0.5; }
  .chip .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .chip .n { color: var(--text-muted); font-variant-numeric: tabular-nums; }

  /* ---------------------------------------------------------------- sidebar */
  #side {
    grid-area: side;
    display: flex; flex-direction: column;
    min-height: 0;
    border-right: 1px solid var(--hairline);
    background: var(--panel);
  }
  .side-head { padding: 12px 14px; border-bottom: 1px solid var(--hairline); }
  #q {
    width: 100%; height: 34px; padding: 0 11px;
    border: 1px solid var(--rule); border-radius: 7px;
    background: var(--page); color: var(--text-primary); font: inherit;
  }
  #q::placeholder { color: var(--text-muted); }
  #q:focus { outline: none; border-color: var(--group-firsts); }
  #count { margin-top: 9px; color: var(--text-muted); font-size: 12px; }

  #list { flex: 1; min-height: 0; overflow-y: auto; padding: 6px 0 20px; }
  .cat-head {
    position: sticky; top: 0; z-index: 1;
    padding: 12px 14px 5px;
    background: var(--panel);
    color: var(--text-muted);
    font-size: 11px; font-weight: 600;
    letter-spacing: 0.07em; text-transform: uppercase;
  }
  .item {
    display: grid; grid-template-columns: 9px 1fr auto; align-items: baseline;
    gap: 10px; width: 100%;
    padding: 8px 14px;
    border: 0; border-left: 2px solid transparent;
    background: none; color: inherit; font: inherit; text-align: left;
    cursor: pointer;
  }
  .item:hover { background: #ffffff0d; }
  .item:focus-visible { outline: 2px solid var(--group-firsts); outline-offset: -2px; }
  .item[aria-current="true"] { background: #ffffff14; border-left-color: var(--accent); }
  .item .dot { width: 9px; height: 9px; border-radius: 50%; transform: translateY(1px); }
  .item .nm { color: var(--text-primary); }
  .item .sub { display: block; color: var(--text-muted); font-size: 12px; }
  .item .st {
    color: var(--text-secondary); font-size: 12px;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .empty { padding: 24px 14px; color: var(--text-muted); }

  /* ------------------------------------------------------------------- map */
  #map { grid-area: map; min-height: 0; background: var(--surface-1); }
  .leaflet-container { background: var(--surface-1); font: inherit; }
  .leaflet-control-attribution {
    background: #0d0d0dcc !important; color: var(--text-muted) !important; font-size: 10px;
  }
  .leaflet-control-attribution a { color: var(--text-secondary) !important; }
  .leaflet-bar a {
    background: var(--panel); color: var(--text-primary); border-bottom-color: var(--hairline);
  }
  .leaflet-bar a:hover { background: #262626; color: var(--text-primary); }

  /* legend */
  .legend {
    padding: 10px 12px;
    border: 1px solid var(--hairline); border-radius: 8px;
    background: #0d0d0de6;
    color: var(--text-secondary); font-size: 12px; line-height: 1.6;
  }
  .legend b {
    display: block; margin-bottom: 6px;
    color: var(--text-muted); font-size: 10.5px; font-weight: 600;
    letter-spacing: 0.07em; text-transform: uppercase;
  }
  .legend .row { display: flex; align-items: center; gap: 8px; }
  .legend .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .legend .sizes { display: flex; align-items: flex-end; gap: 9px; margin-top: 9px; padding-top: 9px; border-top: 1px solid var(--hairline); }
  .legend .sz { border: 2px solid var(--surface-1); border-radius: 50%; background: var(--text-muted); flex: none; }

  /* tooltip + popup */
  .leaflet-tooltip.tip {
    padding: 5px 9px;
    border: 1px solid var(--rule); border-radius: 6px;
    background: #0d0d0df2; color: var(--text-primary);
    font: inherit; font-size: 12.5px; box-shadow: none;
  }
  .leaflet-tooltip.tip::before { display: none; }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip {
    background: var(--panel); color: var(--text-primary);
    border: 1px solid var(--rule); box-shadow: 0 8px 28px #00000080;
  }
  .leaflet-popup-content-wrapper { border-radius: 10px; }
  .leaflet-popup-content { margin: 13px 15px; width: 292px !important; line-height: 1.55; }
  .leaflet-popup-close-button { color: var(--text-muted) !important; }
  .pop h2 { margin: 0 0 2px; font-size: 14.5px; font-weight: 600; }
  .pop .cat { display: flex; align-items: center; gap: 7px; color: var(--text-muted); font-size: 12px; }
  .pop .cat .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .pop .why { margin: 10px 0 0; color: var(--text-secondary); font-size: 12.5px; }
  .pop dl {
    display: grid; grid-template-columns: auto 1fr; gap: 3px 12px;
    margin: 11px 0 0; padding-top: 10px; border-top: 1px solid var(--hairline);
    font-size: 12px;
  }
  .pop dt { color: var(--text-muted); }
  .pop dd { margin: 0; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .pop dd.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; }
  .pop .links { display: flex; gap: 12px; margin-top: 11px; font-size: 12px; }
  .pop .links a { color: var(--group-firsts); }

  @media (max-width: 820px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto 45vh 1fr; grid-template-areas: "head" "map" "side"; }
    #side { border-right: 0; border-top: 1px solid var(--hairline); }
    .filters { margin-left: 0; }
  }
</style>
</head>
<body>

<header>
  <h1>Iconic Tesla Superchargers <span id="total"></span></h1>
  <div class="filters" id="filters" role="group" aria-label="Filter by category"></div>
</header>

<div id="side">
  <div class="side-head">
    <input id="q" type="search" placeholder="Search name, city or country…" autocomplete="off"
           aria-label="Search sites">
    <div id="count" aria-live="polite"></div>
  </div>
  <div id="list"></div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="sites.js"></script>
<script>
(function () {
  "use strict";

  var DATA = window.ICONIC;
  var SITES = DATA.sites;

  var GROUPS = [
    { key: "Firsts",       color: "#3987e5", blurb: "network and country firsts" },
    { key: "Records",      color: "#d95926", blurb: "size and geographic extremes" },
    { key: "Destinations", color: "#199e70", blurb: "landmarks and scenic stops" }
  ];
  var COLOR = {};
  GROUPS.forEach(function (g) { COLOR[g.key] = g.color; });

  var CATEGORIES = [
    "Origins", "Technology firsts", "National & continental firsts",
    "Flagship mega-sites", "Geographic extremes", "Landmarks & destinations"
  ];

  var SURFACE = "#1b1b1b";
  var active = new Set(CATEGORIES);
  var query = "";
  var selected = null;

  /* ------------------------------------------------------------------ map */
  var map = L.map("map", {
    worldCopyJump: true,
    zoomControl: true,
    minZoom: 2,
    maxZoom: 17
  });

  L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
    attribution:
      '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> ' +
      'contributors &copy; <a href="https://carto.com/attributions">CARTO</a> · ' +
      'site data <a href="https://supercharge.info">supercharge.info</a>',
    subdomains: "abcd",
    maxZoom: 20
  }).addTo(map);

  // Area scales with stall count, so the mega-sites read as mega. Radius floor
  // of 5 keeps every mark at least 10px across.
  function radius(stalls) {
    return 5 + Math.sqrt(stalls || 4) * 0.95;
  }

  var layer = L.layerGroup().addTo(map);
  var markers = new Map();   // site name -> { dot, halo }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function place(s) {
    return [s.city, s.state, s.country].filter(Boolean).join(", ");
  }

  function popupHTML(s) {
    var rows = [
      ["Coordinates", '<dd class="mono">' + s.latitude.toFixed(5) + ", " + s.longitude.toFixed(5) + "</dd>"],
      ["Stalls", "<dd>" + (s.stalls || "—") + (s.power_kw ? " &middot; " + s.power_kw + " kW" : "") + "</dd>"],
      ["Elevation", "<dd>" + (s.elevation_m == null ? "—" : s.elevation_m + " m") + "</dd>"],
      ["Listed", "<dd>" + (s.opened || "—") + "</dd>"]
    ];
    var links =
      '<a href="https://www.google.com/maps/search/?api=1&query=' +
      s.latitude + "," + s.longitude + '" target="_blank" rel="noopener">Google Maps</a>';
    if (s.tesla_location_id) {
      links += '<a href="https://www.tesla.com/findus/location/supercharger/' +
        encodeURIComponent(s.tesla_location_id) + '" target="_blank" rel="noopener">Tesla</a>';
    }
    return (
      '<div class="pop">' +
      "<h2>" + esc(s.name) + "</h2>" +
      '<div class="cat"><span class="dot" style="background:' + COLOR[s.group] + '"></span>' +
        esc(s.category) + "</div>" +
      '<p class="why">' + esc(s.why) + "</p>" +
      "<dl>" + rows.map(function (r) { return "<dt>" + r[0] + "</dt>" + r[1]; }).join("") + "</dl>" +
      '<div class="links">' + links + "</div>" +
      "</div>"
    );
  }

  SITES.forEach(function (s) {
    var color = COLOR[s.group];
    var r = radius(s.stalls);

    var dot = L.circleMarker([s.latitude, s.longitude], {
      radius: r,
      color: SURFACE,        // 2px surface ring, so overlapping marks stay separable
      weight: 2,
      fillColor: color,
      fillOpacity: 0.85,
      interactive: false
    });

    // Separate, generously sized hit target — never make the reader land on a
    // 10px dot dead-centre.
    var halo = L.circleMarker([s.latitude, s.longitude], {
      radius: Math.max(r + 6, 13),
      stroke: false,
      fillColor: color,
      fillOpacity: 0.01
    });

    halo.bindTooltip(esc(s.name), { className: "tip", direction: "top", offset: [0, -4] });
    halo.bindPopup(popupHTML(s), { autoPanPadding: [30, 30] });
    halo.on("popupopen", function () { select(s.name, false); });
    halo.on("mouseover", function () { dot.setStyle({ fillOpacity: 1, weight: 3 }); });
    halo.on("mouseout", function () {
      if (selected !== s.name) dot.setStyle({ fillOpacity: 0.85, weight: 2 });
    });

    markers.set(s.name, { dot: dot, halo: halo, site: s });
  });

  /* --------------------------------------------------------------- legend */
  var legend = L.control({ position: "bottomleft" });
  legend.onAdd = function () {
    var d = L.DomUtil.create("div", "legend");
    d.innerHTML =
      "<b>Why it's on the list</b>" +
      GROUPS.map(function (g) {
        return '<div class="row"><span class="dot" style="background:' + g.color +
          '"></span>' + g.key + ' <span style="color:var(--text-muted)">— ' + g.blurb + "</span></div>";
      }).join("") +
      '<div class="sizes">' +
      [4, 40, 168].map(function (n) {
        var px = Math.round(radius(n) * 2);
        return '<span class="sz" style="width:' + px + "px;height:" + px + 'px"></span>';
      }).join("") +
      '<span style="color:var(--text-muted)">4 → 168 stalls</span></div>';
    L.DomEvent.disableClickPropagation(d);
    return d;
  };
  legend.addTo(map);

  /* --------------------------------------------------------------- filters */
  var filtersEl = document.getElementById("filters");
  CATEGORIES.forEach(function (cat) {
    var n = SITES.filter(function (s) { return s.category === cat; }).length;
    var group = SITES.find(function (s) { return s.category === cat; }).group;
    var b = document.createElement("button");
    b.className = "chip";
    b.type = "button";
    b.setAttribute("aria-pressed", "true");
    b.innerHTML = '<span class="dot" style="background:' + COLOR[group] + '"></span>' +
      esc(cat) + ' <span class="n">' + n + "</span>";
    b.addEventListener("click", function () {
      if (active.has(cat)) { active.delete(cat); } else { active.add(cat); }
      if (active.size === 0) { CATEGORIES.forEach(function (c) { active.add(c); }); }
      syncChips();
      render();
    });
    b.dataset.cat = cat;
    filtersEl.appendChild(b);
  });

  function syncChips() {
    filtersEl.querySelectorAll(".chip").forEach(function (b) {
      b.setAttribute("aria-pressed", active.has(b.dataset.cat) ? "true" : "false");
    });
  }

  /* ------------------------------------------------------------ list + sync */
  var listEl = document.getElementById("list");
  var countEl = document.getElementById("count");
  document.getElementById("total").textContent = "· " + SITES.length + " sites · " + DATA.snapshot_date;

  function visible() {
    var q = query.trim().toLowerCase();
    return SITES.filter(function (s) {
      if (!active.has(s.category)) return false;
      if (!q) return true;
      return (s.name + " " + place(s) + " " + s.category + " " + s.why).toLowerCase().indexOf(q) !== -1;
    });
  }

  function render() {
    var rows = visible();
    var keep = new Set(rows.map(function (s) { return s.name; }));

    layer.clearLayers();
    rows.forEach(function (s) {
      var m = markers.get(s.name);
      layer.addLayer(m.dot);
      layer.addLayer(m.halo);
    });
    if (selected && !keep.has(selected)) selected = null;

    countEl.textContent = rows.length === SITES.length
      ? SITES.length + " sites"
      : rows.length + " of " + SITES.length + " sites";

    listEl.innerHTML = "";
    if (!rows.length) {
      listEl.innerHTML = '<p class="empty">No sites match that search.</p>';
      return;
    }
    CATEGORIES.forEach(function (cat) {
      var inCat = rows.filter(function (s) { return s.category === cat; });
      if (!inCat.length) return;
      var h = document.createElement("div");
      h.className = "cat-head";
      h.textContent = cat + " · " + inCat.length;
      listEl.appendChild(h);

      inCat.forEach(function (s) {
        var b = document.createElement("button");
        b.className = "item";
        b.type = "button";
        b.dataset.name = s.name;
        b.style.setProperty("--accent", COLOR[s.group]);
        if (selected === s.name) b.setAttribute("aria-current", "true");
        b.innerHTML =
          '<span class="dot" style="background:' + COLOR[s.group] + '"></span>' +
          '<span><span class="nm">' + esc(s.name) + "</span>" +
          '<span class="sub">' + esc(place(s)) + " · " +
            s.latitude.toFixed(3) + ", " + s.longitude.toFixed(3) + "</span></span>" +
          '<span class="st">' + (s.stalls || "—") + "</span>";
        b.addEventListener("click", function () { select(s.name, true); });
        listEl.appendChild(b);
      });
    });
  }

  // The animation is a nicety, never the mechanism: a hidden tab pauses
  // requestAnimationFrame, so a flight started there would never land and the
  // popup would open over the wrong place. Landing is always forced.
  function fly_to(m) {
    var target = L.latLng(m.site.latitude, m.site.longitude);
    var zoom = Math.max(map.getZoom(), 6);
    var done = false;

    function land() {
      if (done) return;
      done = true;
      map.setView(target, zoom, { animate: false });   // no-op if already landed
      m.halo.openPopup();                              // opened last, so auto-pan can't cancel the flight
    }

    if (document.hidden) { land(); return; }
    map.once("moveend", land);
    map.flyTo(target, zoom, { duration: 0.7 });
    setTimeout(land, 1400);
  }

  function select(name, fly) {
    selected = name;
    var m = markers.get(name);
    if (!m) return;
    if (location.hash.slice(1) !== encodeURIComponent(name)) {
      // replaceState can throw on file:// in some browsers — the hash is a
      // convenience, so never let it break selection.
      try { history.replaceState(null, "", "#" + encodeURIComponent(name)); } catch (e) {}
    }
    if (fly) fly_to(m);
    listEl.querySelectorAll(".item").forEach(function (el) { el.removeAttribute("aria-current"); });
    var el = listEl.querySelector('.item[data-name="' + CSS.escape(name) + '"]');
    if (el) {
      el.setAttribute("aria-current", "true");
      el.scrollIntoView({ block: "nearest" });
    }
  }

  document.getElementById("q").addEventListener("input", function (e) {
    query = e.target.value;
    render();
  });

  render();
  map.fitBounds(
    L.latLngBounds(SITES.map(function (s) { return [s.latitude, s.longitude]; })),
    { padding: [40, 40] }
  );

  // #<site name> deep-links, so a specific Supercharger is shareable.
  function openFromHash(fly) {
    var name = decodeURIComponent(location.hash.slice(1));
    if (name && markers.has(name)) select(name, fly !== false);
  }
  window.addEventListener("hashchange", function () { openFromHash(true); });
  openFromHash(true);
})();
</script>
</body>
</html>
