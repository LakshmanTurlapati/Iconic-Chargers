<!-- Style, glyphs, sprites and vector tiles all come from this one origin. The
     requests use CORS, so the preconnect has to use the same credentials mode. -->
<link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>

<!-- Vendored rather than CDN-loaded. Browsers partition the HTTP cache by
     top-level site, so a shared CDN copy is never reused across sites -- the
     third-party origin buys nothing and costs a DNS + TLS round trip that
     blocks map init. These are the classic browser builds from MapLibre GL JS
     5.24.0; v6 is ESM-only and cannot preserve direct file:// use. -->
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<script defer src="vendor/maplibre-gl.js"></script>
<script defer src="sites.js"></script>
<script defer src="locales.js"></script>
<style>
  :root {
    color-scheme: dark;
    --page:           #000000;
    --surface-1:      #131313;

    /* The panel floats over the basemap, so "background" is a composite, not a
       constant. Sampled from a real screenshot over downtown Los Angeles --
       the densest roads and labels this map ever puts behind the panel -- the
       composite runs from #151515 typical to #323232 at its lightest pixel.
       Every ratio below is quoted against that #323232 worst case, so they are
       floors rather than averages.
       --text-muted was #999999, which lands at exactly 4.50:1 there: passing,
       but with no margin left. Lifting the basemap out of near-black is what
       raised that composite, so the margin is restored here rather than
       spent. */
    --panel:          #141414d6;
    --panel-solid:    #141414;
    --edge:           #ffffff17;

    --text-primary:   #ffffff;   /* 12.8:1 */
    --text-secondary: #b9b9b9;   /*  6.5:1 */
    --text-muted:     #a0a0a0;   /*  4.9:1 */

    /* Tesla reserves its blue for the primary action alone, and the ratios
       agree with the convention: #3e6ae1 is 3.9:1 on the panel -- fine for a
       focus ring (3:1), short of the 4.5:1 that text needs. White ON the blue
       is 4.8:1, so it may be a filled button but never coloured text. There
       are deliberately no blue links in this file. */
    --accent:         #3e6ae1;
    --accent-ring:    #5b82f0;

    /* Map pin, styled after Tesla's own Supercharger marker. Against the
       basemap ramp below, quoted at the gradient's DARKEST end because that is
       the floor: 7.5:1 over water, 6.6:1 over land, 5.1:1 over a 2D building
       footprint, 3.6:1 over a minor road.

       Two backdrops the gold cannot carry alone, and both are reachable: 2.0:1
       on a motorway, and 1.66:1 on the brightest #787876 extrusion face. The
       1.5px --pin-edge ring is what carries separation in both cases, at
       3.28:1 on the motorway and 3.89:1 on that building face, so the pin
       remains distinct where the gold alone cannot carry the boundary. Do not
       drop the ring.

       The capsule is lit from above rather than flat-filled -- a slight
       gradient is what stops a solid pill from reading as a sticker. The bolt
       and digits have to clear 4.5:1 against the DARKEST end of that gradient,
       not its average, so --pin-gold-lo is the value that actually constrains
       it: 5.27:1 there, 7.57:1 at the top. --pin-gold itself stays the flat
       mid-tone, used as the fallback fill and the selected glow. */
    --pin-gold:    #d4af37;   /* flat fill / glow -- bolt on it: 6.65:1 */
    --pin-gold-hi: #e0bb45;   /* top of the capsule   -- bolt: 7.57:1 */
    --pin-gold-lo: #c09a2e;   /* bottom, the binding constraint -- bolt: 5.27:1 */
    --pin-fill:    linear-gradient(180deg, var(--pin-gold-hi), var(--pin-gold-lo));
    --pin-bolt: #2c2c2a;
    --pin-edge: #1b1b1b;

    /* Tesla ships Universal Sans across car, app and site. It is proprietary,
       so this is Tesla's own declared fallback -- a webfont would cost a round
       trip on the critical path for a family we cannot legally serve anyway.
       The Tesla read comes from weight and spacing, not the glyphs: 500 where
       a dashboard would reach for 600, and a lot more air. */
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  /* iOS resolves 100% against the LARGE viewport -- the one with the URL bar
     retracted -- so a full-height map is taller than what you can actually see
     until you scroll. dvh tracks the viewport as the bar collapses. Desktop is
     unaffected: with no dynamic toolbar, 100dvh and 100% are the same number. */
  @supports (height: 100dvh) {
    html, body { height: 100dvh; }
  }
  html {
    /* Stops iOS inflating body text when a phone is turned to landscape, which
       would break every measured line-length and touch target below. */
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }

  body {
    background: var(--page);
    color: var(--text-primary);
    font: 400 14px/1.45 var(--font);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    /* The grey flash mobile browsers paint over a tapped control. Every control
       here already has its own :active/:hover treatment, so this is redundant
       ink on top of a considered one. Inert on desktop. */
    -webkit-tap-highlight-color: transparent;
  }

  /* Set by the visualViewport watcher: the height of the on-screen keyboard, or
     0 when there is none -- which is always, on desktop. */
  :root { --kb: 0px; }

  /* ------------------------------------------------------------ the map --- */
  /* Full-bleed: the map is the substrate and everything else floats on it. */
  #map { position: absolute; inset: 0; background: var(--surface-1); }
  .maplibregl-map { background: var(--surface-1); font: inherit; }

  /* Tesla-like round controls. Each navigation action is its own floating
     circle, including the compass that exposes bearing and automatic pitch. */
  .maplibregl-ctrl-group {
    display: flex; flex-direction: column; gap: 8px;
    border: 0; background: none; box-shadow: none;
  }
  .maplibregl-ctrl-group button,
  .maplibregl-ctrl-group button:hover,
  .maplibregl-ctrl-group button:focus {
    width: 40px; height: 40px;
    border: 1px solid var(--edge); border-radius: 50%;
    background: var(--panel);
    -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
    color: var(--text-primary);
  }
  .maplibregl-ctrl-group button + button { border-top: 1px solid var(--edge); }
  /* :focus and :hover split apart. A touchscreen fires :hover on tap and then
     keeps it until you tap something else, so every un-gated hover rule in this
     file leaves a control stuck looking hovered. :focus is not affected and
     stays unconditional -- a touch device with a keyboard still needs it.
     Gating changes nothing on desktop: `hover: hover` is what a mouse reports,
     and a media query does not alter specificity or source order. */
  .maplibregl-ctrl-group button:focus { background: #262626e6; }
  @media (hover: hover) {
    .maplibregl-ctrl-group button:hover { background: #262626e6; }
  }
  .maplibregl-ctrl-group button:disabled { background: var(--panel); opacity: 0.45; }
  .maplibregl-ctrl button .maplibregl-ctrl-icon { filter: invert(1); }
  .maplibregl-ctrl-attrib {
    padding: 2px 8px; border-radius: 999px;
    background: #000000a6 !important; color: var(--text-muted) !important; font-size: 10px;
  }
  .maplibregl-ctrl-attrib a { color: var(--text-secondary) !important; }
  .maplibregl-ctrl-attrib-button { filter: invert(1); }
  /* The panel owns the whole right edge, so nudge the bottom-right corner past
     it rather than leaving the zoom buttons and the attribution underneath. */
  .maplibregl-ctrl-bottom-right { right: 388px; }   /* 372 panel + 16 gutter */

  #map-error {
    position: absolute; inset: 50% auto auto 50%; z-index: 3;
    width: min(420px, calc(100% - 48px)); padding: 16px 18px;
    transform: translate(-50%, -50%);
    border: 1px solid var(--edge); border-radius: 14px;
    background: #141414f2; color: var(--text-secondary);
    box-shadow: 0 18px 50px #0000008c; text-align: center;
  }
  #map-error strong { display: block; margin-bottom: 4px; color: var(--text-primary); }
  #map-error[hidden] { display: none; }

  /* ----------------------------------------------------------- the cards --- */
  /* Both are siblings of #map, never children and never map controls. A wheel
     over either sibling bubbles to <body>, not the map canvas, so the list and
     detail card remain independently scrollable. */
  #panel, #detail {
    position: absolute; top: 16px; width: 372px;
    display: flex; flex-direction: column; overflow: hidden;
    border: 1px solid var(--edge); border-radius: 18px;
    background: var(--panel);
    -webkit-backdrop-filter: blur(22px) saturate(140%);
    backdrop-filter: blur(22px) saturate(140%);
    box-shadow: 0 18px 50px #0000008c;
  }
  /* Search on the right, detail opposite it, so picking something never costs
     you your place in the list. */
  #panel  { right: 16px; bottom: 16px; z-index: 1001; }
  #detail { left: 16px; max-height: calc(100% - 32px); z-index: 1002; }
  /* display:flex outranks the UA's [hidden] rule -- the same trap as .item. */
  #detail[hidden] { display: none; }
  @supports not (backdrop-filter: blur(2px)) {
    #panel, #detail, .maplibregl-ctrl-group button { background: #141414f5; }
  }

  /* ------------------------------------------------------------- header --- */
  .head { padding: 18px 18px 12px; }
  .title-row { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 14px; }
  h1 {
    flex: 1; min-width: 0; margin: 0; font-size: 15px; font-weight: 500;
    letter-spacing: -0.01em;
  }
  h1 span { display: block; }
  h1 #app-title { color: var(--text-primary); font-size: 15px; font-weight: 500; }
  h1 #total { margin-top: 3px; color: var(--text-muted); font-size: 12px; font-weight: 400; }
  .language-select {
    flex: none; max-width: 142px; height: 32px; padding: 0 26px 0 10px;
    border: 1px solid var(--edge); border-radius: 999px;
    background: #ffffff14; color: var(--text-secondary);
    font: 500 11.5px/1 var(--font); cursor: pointer;
  }
  .language-select:focus-visible {
    outline: 2px solid var(--accent-ring); outline-offset: 2px;
  }
  .sr-only {
    position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }

  .search { position: relative; display: flex; align-items: center; }
  .search .mag {
    position: absolute; left: 16px; color: var(--text-muted); pointer-events: none;
  }
  #q {
    width: 100%; height: 48px; padding: 0 42px 0 44px;
    border: 1px solid transparent; border-radius: 999px;
    background: #ffffff14; color: var(--text-primary);
    font: 400 15px/1 var(--font);
  }
  #q::placeholder { color: var(--text-muted); }
  #q:focus { outline: none; border-color: var(--accent-ring); background: #ffffff1f; }
  #q::-webkit-search-cancel-button { display: none; }
  #clear {
    position: absolute; right: 8px;
    display: flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; padding: 0;
    border: 0; border-radius: 50%; background: #ffffff1a;
    color: var(--text-secondary); cursor: pointer;
  }
  @media (hover: hover) {
    #clear:hover { background: #ffffff2b; color: var(--text-primary); }
  }
  #clear[hidden] { display: none; }

  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
  .chip {
    min-height: 34px; padding: 0 14px;
    border: 0; border-radius: 999px;
    background: #ffffff14; color: var(--text-secondary);
    font: 500 13px/1 var(--font); cursor: pointer;
    transition: background 120ms ease-out, color 120ms ease-out;
  }
  @media (hover: hover) {
    .chip:hover { background: #ffffff26; color: var(--text-primary); }
  }
  /* Tesla's selected state is a light fill with dark text, not a tinted
     outline. aria-pressed keeps the existing multi-select semantics. */
  .chip[aria-pressed="true"] { background: #f2f2f2; color: #111111; }
  @media (hover: hover) {
    .chip[aria-pressed="true"]:hover { background: #ffffff; }
  }

  .countrow {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    margin-top: 14px;
  }
  #count { color: var(--text-muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  /* An action, not a region filter -- so deliberately outside the chips group. */
  .near {
    display: inline-flex; align-items: center; gap: 6px; flex: none;
    min-height: 30px; padding: 0 12px;
    border: 1px solid var(--edge); border-radius: 999px;
    background: transparent; color: var(--text-secondary);
    font: 500 12px/1 var(--font); cursor: pointer; white-space: nowrap;
  }
  @media (hover: hover) {
    .near:hover:not(:disabled) { background: #ffffff14; color: var(--text-primary); }
  }
  .near[aria-pressed="true"] { background: #f2f2f2; border-color: #f2f2f2; color: #111111; }
  .near:disabled { opacity: 0.55; cursor: default; }
  #nearmsg { margin: 8px 0 0; color: var(--text-muted); font-size: 11.5px; }
  #nearmsg[hidden] { display: none; }

  /* --------------------------------------------------------------- list --- */
  #list { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 10px 14px; }
  .region-head {
    position: sticky; top: 0; z-index: 1;
    margin: 0 0 2px; padding: 18px 8px 6px;
    background: var(--panel-solid); color: var(--text-muted);
    font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
  }
  .item {
    display: grid; grid-template-columns: 40px 1fr auto; align-items: center;
    gap: 12px; width: 100%;
    scroll-margin-top: 44px;
    padding: 11px 8px;
    border: 0; border-radius: 12px;
    background: none; color: inherit; font: inherit; text-align: start; cursor: pointer;
  }
  /* `display: grid` above outranks the UA's `[hidden] { display: none }`,
     so filtered-out rows need this or they stay on screen. */
  .item[hidden] { display: none; }
  @media (hover: hover) {
    .item:hover { background: #ffffff12; }
  }
  .item:focus-visible { outline: 2px solid var(--accent-ring); outline-offset: -2px; }
  .item[aria-current="true"] { background: #ffffff1f; }
  .ico {
    display: flex; align-items: center; justify-content: center;
    width: 40px; height: 40px; border-radius: 12px;
    background: #ffffff14; color: var(--text-secondary);
  }
  /* The selected row's icon echoes the pin, gradient and all, so the row and
     the marker on the map read as the same object. */
  .item[aria-current="true"] .ico {
    background-color: var(--pin-gold);
    background-image: var(--pin-fill);
    color: var(--pin-bolt);
  }
  .ico svg { fill: currentColor; display: block; }
  .txt { min-width: 0; }
  .nm {
    display: block; color: var(--text-primary); font-size: 15px; font-weight: 500;
    letter-spacing: -0.005em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .sub {
    display: block; margin-top: 2px; color: var(--text-muted); font-size: 12.5px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .approx {
    display: inline-block; margin-inline-start: 7px; padding: 1px 6px; vertical-align: 1px;
    border-radius: 5px; background: #ffffff1a;
    color: var(--text-muted); font-size: 10px; font-weight: 500; letter-spacing: 0.03em;
  }
  .meta {
    display: flex; flex-direction: column; align-items: flex-end; justify-content: center;
    gap: 2px; flex: none;
    font-variant-numeric: tabular-nums;
  }
  .dist { color: var(--text-secondary); font-size: 12.5px; font-weight: 500; }
  .dist[hidden] { display: none; }
  .stalls { display: flex; align-items: center; gap: 3px; color: var(--text-muted); font-size: 12px; }
  .stalls svg { fill: currentColor; display: block; }
  .empty { padding: 26px 10px; color: var(--text-muted); }

  .foot {
    margin: 0; padding: 11px 18px 13px;
    border-top: 1px solid var(--edge);
    color: var(--text-muted); font-size: 11px; line-height: 1.5;
  }
  .foot svg { fill: currentColor; vertical-align: -1px; }
  .project-note { margin: 5px 0 0; }
  .project-links {
    display: flex; flex-wrap: wrap; gap: 2px 10px; margin-top: 6px;
  }
  .project-links a {
    color: var(--text-secondary); text-decoration: none;
    text-underline-offset: 2px;
  }
  @media (hover: hover) {
    .project-links a:hover { color: var(--text-primary); text-decoration: underline; }
  }
  .project-links a:focus-visible {
    border-radius: 2px; outline: 2px solid var(--accent-ring); outline-offset: 2px;
  }

  /* ------------------------------------------------------- detail card --- */
  .dhead { display: flex; justify-content: flex-end; padding: 12px 12px 0; }
  .iconbtn {
    display: flex; align-items: center; justify-content: center;
    width: 38px; height: 38px; padding: 0;
    border: 0; border-radius: 50%; background: #ffffff14;
    color: var(--text-primary); cursor: pointer;
  }
  @media (hover: hover) {
    .iconbtn:hover { background: #ffffff26; }
  }
  .iconbtn:focus-visible, .chip:focus-visible, .near:focus-visible,
  #clear:focus-visible, .btn:focus-visible, .srow:focus-visible {
    outline: 2px solid var(--accent-ring); outline-offset: 2px;
  }
  .dbody { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 18px 20px; }
  .dbody h2 {
    margin: 0; font-size: 22px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.2;
  }
  .dmeta { margin: 6px 0 0; color: var(--text-muted); font-size: 12.5px; }

  .stats {
    display: flex; flex-wrap: wrap; gap: 8px;
    margin-top: 16px;
  }
  .stat {
    flex: 1 1 84px; padding: 11px 12px;
    border-radius: 12px; background: #ffffff0f;
  }
  .stat b {
    display: block; font-size: 18px; font-weight: 500; letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
  }
  .stat span { display: block; margin-top: 1px; color: var(--text-muted); font-size: 11.5px; }

  .dwhy { margin: 16px 0 0; color: var(--text-secondary); font-size: 13.5px; line-height: 1.55; }
  .dnote {
    margin: 10px 0 0; padding: 10px 12px;
    border-radius: 10px; background: #ffffff0f;
    color: var(--text-muted); font-size: 12px; line-height: 1.5;
  }

  .sitelist { margin-top: 18px; }
  .lbl {
    margin: 0 0 6px; color: var(--text-muted);
    font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
  }
  .srow {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    width: 100%; padding: 10px 12px; margin-top: 4px;
    border: 0; border-radius: 10px; background: #ffffff0f;
    color: var(--text-secondary); font: inherit; font-size: 13px; text-align: start; cursor: pointer;
  }
  @media (hover: hover) {
    .srow:hover { background: #ffffff1f; color: var(--text-primary); }
  }
  .srow[aria-current="true"] { background: #ffffff26; color: var(--text-primary); }
  .srow .sst { flex: none; color: var(--text-muted); font-variant-numeric: tabular-nums; }

  .dbody dl {
    display: grid; grid-template-columns: auto 1fr; gap: 6px 14px;
    margin: 18px 0 0; padding-top: 16px; border-top: 1px solid var(--edge); font-size: 12.5px;
  }
  .dbody dt { color: var(--text-muted); }
  .dbody dd { margin: 0; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .dbody dd.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; }

  .dfoot { padding: 12px 18px 14px; border-top: 1px solid var(--edge); }
  .actions { display: flex; gap: 8px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 44px; padding: 0 18px;
    border-radius: 999px; background: #ffffff1a;
    color: var(--text-primary); font: 500 13.5px/1 var(--font);
    text-decoration: none; cursor: pointer;
  }
  @media (hover: hover) {
    .btn:hover { background: #ffffff2b; }
  }
  /* The one place the blue appears. White on it is 4.8:1. */
  .btn.primary { flex: 1; background: var(--accent); color: #ffffff; }
  @media (hover: hover) {
    .btn.primary:hover { background: #3059cc; }
  }

  /* ------------------------------------------------------ Supercharger pill */
  /* Modelled on Tesla's map marker: a capsule holding a bolt and the charger
     count. Built from HTML rather than a fixed SVG so the capsule grows with
     its digits - "164" needs more room than "6". */
  .cap {
    display: inline-flex; align-items: center; gap: 3px;
    height: 24px; padding: 0 8px;
    border: 1.5px solid var(--pin-edge); border-radius: 999px;
    /* Colour and gradient set separately, not via the shorthand: the shorthand
       would reset background-color to transparent, losing both the no-gradient
       fallback and the flat value that the colour audit in verify.mjs reads. */
    background-color: var(--pin-gold);
    background-image: var(--pin-fill);
    color: var(--pin-bolt);
    font: 600 12px/1 var(--font);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    transition: transform 90ms ease-out;
  }
  .cap svg { display: block; fill: var(--pin-bolt); flex: none; }

  /* MapLibre owns the outer element's transform. Scaling the child keeps the
     marker viewport-aligned and centred while the camera pitches and rotates. */
  .pin {
    display: flex; align-items: center; justify-content: center;
    width: auto; height: auto; padding: 0; border: 0; background: none;
    cursor: pointer; direction: ltr;
  }
  .pin .cap { transform: scale(1); transform-origin: 50% 50%; }
  /* Left exactly where it was: this ties with `.pin.is-selected .cap` at (0,3,0),
     so the selected 1.15 only beats this 1.12 by coming later in the file. */
  @media (hover: hover) {
    .pin:hover .cap { transform: scale(1.12); }
  }
  .pin.is-selected { z-index: 10; }
  .pin.is-selected .cap {
    transform: scale(1.15);
    filter: drop-shadow(0 0 7px #d4af3799);
  }
  .pin:focus-visible { outline: none; }
  .pin:focus-visible .cap { outline: 2px solid var(--accent-ring); outline-offset: 3px; }
  .tip {
    position: absolute; left: 50%; bottom: calc(100% + 9px);
    padding: 6px 11px; transform: translateX(-50%) translateY(3px);
    border: 1px solid var(--edge); border-radius: 999px;
    background: #000000e6; color: var(--text-primary);
    font: 500 12.5px/1 var(--font); box-shadow: none; white-space: nowrap;
    opacity: 0; pointer-events: none;
    transition: opacity 90ms ease-out, transform 90ms ease-out;
  }
  /* The worst of the stuck-hover cases, and the reason the gating above is not
     merely tidiness: on a touchscreen this left a pin's name label stranded over
     the map after every tap, until you happened to tap something else. */
  .pin:focus-visible .tip {
    opacity: 1; transform: translateX(-50%) translateY(0);
  }
  @media (hover: hover) {
    .pin:hover .tip { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  /* A finger is about 44px across; the capsule is 24px tall and, for a
     single-digit stall count, about 40px wide. Padding out the hit box keeps
     every pin tappable without touching the drawn capsule -- and the pins are
     the primary way into a badge, so this is not a marginal target. */
  @media (pointer: coarse) {
    /* Never set `position` on .pin. This element IS the MapLibre marker -- it
       carries `class="pin maplibregl-marker ..."` -- and MapLibre positions
       markers with `.maplibregl-marker { position: absolute }`, which is the
       same (0,1,0) specificity as `.pin`. This stylesheet loads after the
       vendor one, so anything declared here WINS: a `position: relative` added
       for the pseudo-element below dropped all 53 markers into normal document
       flow, and MapLibre's transform then offset each from wherever it landed
       rather than from the container origin. 52 of 53 pins ended up misplaced,
       the worst by 1,248px, on touch devices only.

       Nothing is needed anyway: the absolute position the marker already has is
       itself the containing block for an absolutely positioned pseudo-element.
       Measured with and without the declaration, the hit box is identical. */
    .pin::after {
      content: ""; position: absolute; inset: -12px; border-radius: 999px;
    }
  }

  /* ------------------------------------------------------------- grabber --- */
  /* The drag handle for the bottom sheet. Not present on desktop, where the
     cards are fixed furniture. A <button> rather than a <div> so the detents
     are reachable by keyboard and by anyone who cannot perform a drag at all
     -- Enter or a tap cycles peek -> half -> full. */
  .grab { display: none; }

  /* ================================================================ mobile ===
     Three layouts, not two. The breakpoints below are mirrored exactly once in
     JS (mqWide / mqShort) so the two cannot drift:

       > 820px wide                 desktop   cards docked right and left
       <= 820px, taller than 500    sheet     draggable bottom sheet
       <= 820px, 500px or shorter   side      landscape phone: dock right

     The third exists because a landscape phone is <= 820px wide and therefore
     used to get the bottom sheet, which left a 115px strip of map -- and with
     the detail card open, framePad() asked for 333px of padding out of 375px of
     viewport, which is not a camera cameraForBounds can produce.

     Everything here is additive and scoped. Nothing in this section can apply
     at desktop width, and env() is 0 on any display without insets. */

  @media (max-width: 820px) {
    /* iOS zooms the page in whenever a focused input is under 16px and does not
       zoom back out afterwards. This single value is the difference between a
       working search field and a permanently magnified app. */
    #q { font-size: 16px; }

    /* 44px is the documented minimum touch target on both platforms; these five
       controls were 34, 30, 38, 32 and 40. Deliberately confined to this query:
       a mouse does not need the room, and growing them on desktop would move
       the layout. */
    .chip { min-height: 44px; padding: 0 16px; }
    .near { min-height: 44px; padding: 0 14px; }
    .iconbtn { width: 44px; height: 44px; }
    /* 40 rather than 44 -- it sits inside the 48px-tall search field, so 44
       would leave 2px of clearance and clip its own focus ring. The field's
       full height is tappable either way. */
    #clear { width: 40px; height: 40px; }
    .srow { min-height: 48px; padding: 12px 14px; }
    .item { padding: 13px 8px; }
    .project-links { row-gap: 0; }
    .project-links a {
      display: inline-flex; align-items: center; min-width: 44px; min-height: 44px;
    }
    /* Repeats the base rule's three-selector list because that list is what
       out-specifies the vendor stylesheet; a shorter selector would lose. */
    .maplibregl-ctrl-group button,
    .maplibregl-ctrl-group button:hover,
    .maplibregl-ctrl-group button:focus { width: 44px; height: 44px; }

    /* A scroll that reaches the end of the list should stop there, not chain
       out to the page -- which is a pull-to-refresh on Android and a
       rubber-band of the whole app on iOS. */
    #list, .dbody { overscroll-behavior: contain; }

    /* A double-tap on a control should activate it, not select its label. */
    .chip, .near, .item, .srow, .btn, .iconbtn, .grab, .region-head, .pin {
      -webkit-user-select: none; user-select: none;
    }

    /* Nothing to nudge past down here -- a card owns the bottom or the right
       edge, so the controls move to a free corner (see syncControlCorner). */
    .maplibregl-ctrl-bottom-right { right: 0; }
    .maplibregl-ctrl-top-right {
      top: env(safe-area-inset-top); right: env(safe-area-inset-right);
    }
    .maplibregl-ctrl-top-left {
      top: env(safe-area-inset-top); left: env(safe-area-inset-left);
    }
    .maplibregl-ctrl-bottom-left {
      bottom: env(safe-area-inset-bottom); left: env(safe-area-inset-left);
    }
    /* Keep the attribution out of the navigation column on the opposite side.
       !important because the vendor's expanded-compact padding is set at
       (0,3,0) with content-box, so without both of these the cap is measured
       against the content box and 36px of padding escapes it. */
    .maplibregl-ctrl-attrib {
      box-sizing: border-box !important;
      max-width: calc(100vw - 80px) !important;
    }

    .head { padding: 14px 14px 10px; }
    h1 { margin-bottom: 12px; }
    .dbody { padding: 12px 14px 18px; }
  }

  /* ------------------------------------------------------- sheet (portrait) */
  @media (max-width: 820px) and (min-height: 501px) {
    #panel, #detail {
      top: auto;
      left: calc(10px + env(safe-area-inset-left));
      right: calc(10px + env(safe-area-inset-right));
      /* --kb lifts the sheet clear of the on-screen keyboard. iOS does not
         shrink the layout viewport when the keyboard opens, so without this the
         sheet -- and the list you are typing to filter -- sits behind it. */
      bottom: calc(10px + env(safe-area-inset-bottom) + var(--kb));
      width: auto;
      max-height: none;
      border-radius: 20px;
      /* Dragging moves the sheet with a transform rather than by animating
         height: height reflows the scroll container every frame, a transform
         stays on the compositor. The resting state is a real height again --
         see settle() -- so .dfoot keeps its primary action pinned on screen. */
      transform: translateY(var(--y, 0px));
      transition: transform 280ms cubic-bezier(.32, .72, 0, 1);
    }
    /* --h is written by the detent code. The vh values are what you get before
       it has measured, and if the script never runs at all. */
    #panel  { height: var(--h, 64vh); }
    #detail { height: var(--h, 76vh); }

    /* Held down: no transition fighting the finger, and the blur dropped for
       the duration. backdrop-filter re-composites a blur of the live map every
       frame, which is the one thing here expensive enough to cost frames on a
       phone; this is the same opaque fallback the @supports block already uses. */
    #panel.is-dragging, #detail.is-dragging {
      transition: none;
      will-change: transform;
      -webkit-backdrop-filter: none; backdrop-filter: none;
      background: #141414f5;
    }
    /* Suppresses the transition for one committed frame, so settleTo() can swap
       a transform for an equivalent height without the swap animating. Unlike
       .is-dragging this keeps the blur, because it is on screen for one frame
       either side of a visible change. */
    #panel.no-anim, #detail.no-anim { transition: none; }

    /* Only the scrolling middle may absorb a height change. Left to the default
       flex-shrink, the header would squash as the sheet collapses -- the search
       field visibly shortening as you drag -- and detents() measures PEEK from
       where that header ends, so a shrinking header would make the peek height
       depend on the peek height. */
    .grab, .head, .dhead, .dfoot, .foot { flex: none; }

    /* The drag surfaces. Without touch-action: none the browser claims the
       gesture for panning and pointermove never arrives. Safe here because
       nothing inside either header scrolls. */
    .head, .dhead { touch-action: none; }

    .grab {
      display: block; flex: none; position: relative;
      width: 100%; height: 28px; padding: 0;
      border: 0; background: none;
      /* The browser must not claim this gesture for scrolling or the drag
         never reaches pointermove. */
      touch-action: none;
      -webkit-appearance: none; appearance: none;
      cursor: grab;
    }
    .grab::before {
      content: ""; display: block;
      width: 38px; height: 4px; margin: 12px auto 0;
      border-radius: 999px; background: #ffffff40;
    }
    /* Tapping the grabber cycles the detents, so it is a control and owes the
       same 44px as every other one -- but at 44px tall it would put a band of
       dead space between the handle and the header. So the drawn handle stays
       28px and the HIT box is padded out to 44.
       All 16px of the growth goes DOWNWARD, into the header's top padding.
       Growing upward reads better -- the sheet's edge is where a thumb aims --
       but the sheet is overflow: hidden for its rounded corners, so anything
       above the top edge is clipped away and the target measured 36px. */
    .grab::after {
      content: ""; position: absolute; left: 0; right: 0; top: 0; bottom: -16px;
    }
    .grab:active { cursor: grabbing; }
    .grab:focus-visible {
      outline: 2px solid var(--accent-ring); outline-offset: -4px;
      border-radius: 20px 20px 0 0;
    }
    /* The grabber supplies the top gutter both cards used to pad for. */
    .head  { padding: 4px 14px 10px; }
    .dhead { padding: 2px 12px 0; }
  }

  /* ------------------------------------------------ side (landscape phone) --
     The desktop arrangement at phone scale: a full-height card on the right.
     The detail card overlays it rather than taking the opposite edge -- two
     340px cards on a 667px screen would leave 23px of map between them. */
  @media (max-width: 820px) and (max-height: 500px) {
    #panel, #detail {
      top: calc(10px + env(safe-area-inset-top));
      bottom: calc(10px + env(safe-area-inset-bottom));
      left: auto;
      right: calc(10px + env(safe-area-inset-right));
      width: min(340px, 52vw);
      height: auto;
      max-height: none;
      border-radius: 16px;
    }
    .head { padding: 12px 14px 8px; }
    h1 { margin-bottom: 10px; }
    /* MapLibre decides the compact attribution has room to expand by measuring
       the whole map -- including the 340px of it underneath this card -- and
       then runs 451px wide on a 740px screen, straight under the panel. Cap it
       at the genuinely free width so it wraps instead of hiding behind the
       card. Matches the card width expression above. */
    /* !important on both, and not for tidiness. The vendor sets content-box on
       .maplibregl-compact, and its expanded padding comes from
       `.maplibregl-ctrl-top-left > .maplibregl-ctrl-attrib.maplibregl-compact-show`
       at (0,3,0) -- which outranks anything reasonable here. Left as content-box
       the 36px of padding lands OUTSIDE the cap, so a 366px max-width measured
       402px on screen and stayed under the card. The file already uses
       !important on this element's colours for the same reason. */
    .maplibregl-ctrl-attrib {
      box-sizing: border-box !important;
      max-width: calc(100vw - min(340px, 52vw) - 34px) !important;
    }
    /* The chip row costs three of the ~355 available vertical pixels' worth of
       rows; the region filter is the first thing to go when height is this
       scarce. Search still reaches every region. */
    .chips { display: none; }
    .foot { display: none; }
  }

  /* Direction follows the interface locale, while canonical place names and
     coordinates opt back into their own direction with bdi/dir=auto. */
  [dir="rtl"] #panel { right: auto; left: 16px; }
  [dir="rtl"] #detail { left: auto; right: 16px; }
  [dir="rtl"] .search .mag { left: auto; right: 16px; }
  [dir="rtl"] #q { padding-right: 44px; padding-left: 42px; }
  [dir="rtl"] #clear { right: auto; left: 8px; }
  [dir="rtl"] .language-select { padding-right: 10px; padding-left: 26px; }
  [dir="rtl"] .maplibregl-ctrl-bottom-right { right: 0; }
  [dir="rtl"] .maplibregl-ctrl-bottom-left { left: 388px; }

  @media (max-width: 820px) {
    [dir="rtl"] .maplibregl-ctrl-bottom-left {
      left: env(safe-area-inset-left);
    }
  }
  @media (max-width: 820px) and (min-height: 501px) {
    [dir="rtl"] #panel, [dir="rtl"] #detail {
      left: calc(10px + env(safe-area-inset-left));
      right: calc(10px + env(safe-area-inset-right));
    }
  }
  @media (max-width: 820px) and (max-height: 500px) {
    [dir="rtl"] #panel, [dir="rtl"] #detail {
      right: auto;
      left: calc(10px + env(safe-area-inset-left));
    }
  }
</style>
</head>
<body>

<div id="map" role="region" aria-label="Interactive map of Iconic Chargers"></div>
<div id="map-error" role="alert" hidden>
  <strong id="map-error-title">Map unavailable</strong>
  <span id="map-error-message">The charger list and details still work.</span>
</div>

<div id="panel">
  <!-- display:none on desktop, so it costs the desktop layout nothing. A button
       rather than a div because a drag handle that can ONLY be dragged is
       unusable by keyboard and by anyone who cannot hold and move precisely;
       Enter or a tap cycles the same detents the gesture reaches. -->
  <button class="grab" id="panel-grab" type="button"
          aria-controls="panel" aria-expanded="true" aria-label="Resize the list"></button>
  <div class="head">
    <div class="title-row">
      <h1><span id="app-title">Iconic Chargers</span><span id="total"></span></h1>
      <label>
        <span id="language-label" class="sr-only">Language</span>
        <select id="language" class="language-select" aria-labelledby="language-label"></select>
      </label>
    </div>

    <div class="search">
      <svg class="mag" width="16" height="16" viewBox="0 0 16 16" fill="none"
           stroke="currentColor" stroke-width="1.6" aria-hidden="true">
        <circle cx="7" cy="7" r="4.6"/><path d="M10.6 10.6 14 14" stroke-linecap="round"/>
      </svg>
      <input id="q" type="search" placeholder="Search Iconic Chargers" autocomplete="off"
             aria-label="Search badges, cities and countries">
      <button id="clear" type="button" hidden aria-label="Clear search">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor"
             stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
          <path d="M3.6 3.6l6.8 6.8M10.4 3.6l-6.8 6.8"/>
        </svg>
      </button>
    </div>

    <div class="chips" id="filters" role="group" aria-label="Filter by region"></div>

    <div class="countrow">
      <span id="count" aria-live="polite"></span>
      <button id="near" class="near" type="button" aria-pressed="false">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor"
             stroke-width="1.5" aria-hidden="true">
          <circle cx="8" cy="8" r="2.6"/><circle cx="8" cy="8" r="6" opacity=".5"/>
          <path d="M8 .5v2M8 13.5v2M.5 8h2M13.5 8h2" stroke-linecap="round"/>
        </svg>
        <span id="nearlbl">Near me</span>
      </button>
    </div>
    <p id="nearmsg" hidden aria-live="polite"></p>
  </div>

  <div id="list"></div>

  <!-- The legend went with the colour key, but this distinction did not:
       Tesla's own map shows stalls FREE RIGHT NOW in the same visual
       language, and there is no live feed here. -->
  <footer class="foot">
    <div>
      <svg width="7" height="10" viewBox="0 0 9 13" aria-hidden="true">
        <path d="M5.6 0 0 7.4h3.4L2.3 13 9 5.2H5.1z"/></svg>
      <span id="footnote">is total stalls, not live availability.</span>
    </div>
    <p class="project-note" id="project-note">Independent atlas · public snapshot · not affiliated with Tesla.</p>
    <nav class="project-links" id="project-links" aria-label="Project information">
      <a data-site-route="about" data-ui="navAbout" href="https://iconicchargers.com/about/">About</a>
      <a data-site-route="badges" data-ui="navBadges" href="https://iconicchargers.com/badges/">Badges</a>
      <a data-site-route="locations" data-ui="navLocations" href="https://iconicchargers.com/locations/">Locations</a>
      <a data-site-route="data" data-ui="navData" href="https://iconicchargers.com/data/">Data &amp; citation</a>
      <a data-ui="navGithub" href="https://github.com/LakshmanTurlapati/Iconic-Chargers">GitHub</a>
      <a data-ui="navTeslaDocs" href="https://www.tesla.com/support/tesla-app/charging-badges">Tesla documentation</a>
    </nav>
  </footer>
</div>

<aside id="detail" hidden aria-label="Supercharger details">
  <button class="grab" id="detail-grab" type="button"
          aria-controls="detail" aria-expanded="true" aria-label="Resize the details"></button>
  <div class="dhead">
    <button id="dclose" class="iconbtn" type="button" aria-label="Close details">
      <svg width="15" height="15" viewBox="0 0 14 14" fill="none" stroke="currentColor"
           stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
        <path d="M3.6 3.6l6.8 6.8M10.4 3.6l-6.8 6.8"/>
      </svg>
    </button>
  </div>
  <div class="dbody">
    <h2 id="d-title"></h2>
    <p class="dmeta" id="d-meta"></p>
    <div class="stats" id="d-stats"></div>
    <p class="dwhy" id="d-why"></p>
    <div id="d-notes"></div>
    <div id="d-sites"></div>
    <dl id="d-facts"></dl>
  </div>
  <!-- Outside .dbody on purpose: a nine-site badge pushes a scrolled action
       off the bottom, and the primary action is the one thing that should
       never need hunting for. -->
  <div class="dfoot"><div class="actions" id="d-actions"></div></div>
</aside>

<script>
// MapLibre, sites.js and locales.js are deferred from <head>, so they start downloading
// during parse instead of being discovered down here. Deferred scripts run
// after parsing but before DOMContentLoaded, so waiting on that event is what
// keeps this inline block -- and the single-file app -- ordered behind them.
document.addEventListener("DOMContentLoaded", function () {
  "use strict";

  var DATA = window.ICONIC;
  var BADGES = DATA.badges;
  var REGIONS = DATA.regions;
  var I18N = window.ICONIC_I18N;
  var LOCALES = I18N.locales;
  var LOCALE_KEY = "iconic.locale.v1";
  var COUNTRY_KEY = "iconic.country.v1";
  var COUNTRY_TTL = 6 * 60 * 60 * 1000;
  // Generated production entry points define this value before the app loads.
  // Its presence distinguishes a stable locale URL from direct-file and legacy
  // /web/index.html use, both of which retain automatic browser/IP selection.
  var staticSite = Object.prototype.hasOwnProperty.call(window, "ICONIC_PATH_LOCALE");

  function storageGet(kind, key) {
    try {
      var store = window[kind];
      return store && store.getItem(key);
    } catch (e) { return null; }
  }
  function storageSet(kind, key, value) {
    try {
      var store = window[kind];
      if (!store) return false;
      if (value == null) store.removeItem(key); else store.setItem(key, value);
      return true;
    } catch (e) { return false; }
  }
  var matchLocale = I18N.matchLocale;
  var browserTags = Array.prototype.slice.call(
    navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "en"]);
  var browserLocales = I18N.supportedFromTags(browserTags);
  var browserLocale = browserLocales[0] || I18N.defaultLocale;
  var savedLocale = storageGet("localStorage", LOCALE_KEY);
  var pathLocale = staticSite && Object.prototype.hasOwnProperty.call(
    LOCALES, window.ICONIC_PATH_LOCALE) ? window.ICONIC_PATH_LOCALE : null;
  var localeOverride = pathLocale ||
    (Object.prototype.hasOwnProperty.call(LOCALES, savedLocale) ? savedLocale : null);
  var routeLocale = pathLocale;
  if (savedLocale && !Object.prototype.hasOwnProperty.call(LOCALES, savedLocale)) {
    storageSet("localStorage", LOCALE_KEY, null);
  }

  function localeForCountry(country) {
    return I18N.localeForCountry(country, browserLocales, browserLocale);
  }
  function cachedCountry() {
    var raw = storageGet("sessionStorage", COUNTRY_KEY);
    if (!raw) return null;
    try {
      var entry = JSON.parse(raw);
      if (/^[A-Z]{2}$/.test(entry.country) && entry.expires > Date.now()) return entry.country;
    } catch (e) {}
    storageSet("sessionStorage", COUNTRY_KEY, null);
    return null;
  }
  // A saved language suppresses the network lookup, but a still-valid country
  // cache may continue to drive units; language and units are independent.
  var ipCountry = cachedCountry();
  var localeKey = localeOverride || (ipCountry ? localeForCountry(ipCountry) : browserLocale);
  var locale = LOCALES[localeKey] || LOCALES.en;
  var MILES = ipCountry ? ipCountry === "US" : /^en-US\b/i.test(navigator.language || "");
  var pluralRules;
  var numberFormat;
  var oneDecimalFormat;
  var dateFormat;

  function resetFormatters() {
    pluralRules = new Intl.PluralRules(localeKey);
    numberFormat = new Intl.NumberFormat(localeKey, { maximumFractionDigits: 0 });
    oneDecimalFormat = new Intl.NumberFormat(localeKey, { minimumFractionDigits: 1, maximumFractionDigits: 1 });
    // Source dates are calendar dates, not instants. UTC prevents a negative
    // local offset from displaying the previous day (Aug 12 became Aug 11 in
    // Chicago when midnight UTC was formatted in the default time zone).
    dateFormat = new Intl.DateTimeFormat(localeKey, {
      year: "numeric", month: "short", day: "numeric", timeZone: "UTC"
    });
  }
  resetFormatters();
  function interpolate(template, values) {
    return String(template).replace(/\{([a-zA-Z0-9_]+)\}/g, function (_, key) {
      return values && values[key] != null ? values[key] : "{" + key + "}";
    });
  }
  function ui(key, values) { return interpolate(locale.ui[key] || LOCALES.en.ui[key] || key, values); }
  function noun(key, count) {
    var forms = locale.nouns[key] || LOCALES.en.nouns[key];
    var category = pluralRules.select(count);
    return interpolate(forms[category] || forms.other, { count: numberFormat.format(count) });
  }
  function badgeCopy(badge) { return locale.badges[badge.badge] || LOCALES.en.badges[badge.badge]; }
  function regionName(region) { return locale.regions[region] || LOCALES.en.regions[region] || region; }
  function countryName(country) { return locale.countries[country] || LOCALES.en.countries[country] || country; }
  function reasonName(reason, length) {
    var value = locale.reasons[reason] || LOCALES.en.reasons[reason];
    return value[length];
  }
  function formatDate(value) {
    var parts = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value || "");
    if (!parts) return value || "—";
    return dateFormat.format(new Date(Date.UTC(+parts[1], +parts[2] - 1, +parts[3])));
  }
  function formatPower(value) { return numberFormat.format(value) + "\u00a0kW"; }
  function formatElevation(value) {
    try {
      return new Intl.NumberFormat(localeKey, {
        style: "unit", unit: "meter", unitDisplay: "short", maximumFractionDigits: 0

    } catch (e) { return numberFormat.format(value) + "\u00a0m"; }
  }
  function maplibreLocale() {
    return {
      "Map.Title": ui("mapControlTitle"),
      "NavigationControl.ZoomIn": ui("zoomIn"),
      "NavigationControl.ZoomOut": ui("zoomOut"),
      "NavigationControl.ResetBearing": ui("resetBearing"),
      "AttributionControl.ToggleAttribution": ui("toggleAttribution")

  }

  document.documentElement.lang = localeKey;
  document.documentElement.dir = locale.dir;

  var sitesOf = {};
  DATA.sites.forEach(function (s) {
    (sitesOf[s.badge] = sitesOf[s.badge] || []).push(s);
  });

  var active = new Set(REGIONS);
  var query = "";
  var selected = null;
  var selectedSite = null;
  var here = null;        // {lat, lng} once Near me is granted -- never on load
  var distKm = {};        // badge -> km to its NEAREST site
  var order = null;       // badge names by distance, or null for region order

  // Both looked up here rather than beside the rest of the detail-card code:
  // framePad() below runs on the very first fitBounds, and a `var` hoisted but
  // not yet assigned would be undefined at that point.
  var panelEl = document.getElementById("panel");
  var detailEl = document.getElementById("detail");

  // The single source of truth for which of the three layouts is live. These
  // are the exact query strings the stylesheet uses, because deriving the mode
  // from innerWidth in parallel is precisely how CSS and JS drift apart -- and
  // with three layouts rather than two, drift stops being hypothetical.
  var mqWide  = window.matchMedia("(min-width: 821px)");
  var mqShort = window.matchMedia("(max-width: 820px) and (max-height: 500px)");
  function layout() {
    return mqWide.matches ? "desktop" : mqShort.matches ? "side" : "sheet";
  }
  function narrow() { return !mqWide.matches; }

  var mapErrorEl = document.getElementById("map-error");
  var mapErrorMessageEl = document.getElementById("map-error-message");
  var mapErrorKey = "mapFallback";
  var map = null;
  var mapLoaded = false;

  function showMapError(key) {
    mapErrorKey = key || "mapFallback";
    mapErrorMessageEl.textContent = ui(mapErrorKey);
    mapErrorEl.hidden = false;
  }

  function hideMapError() { mapErrorEl.hidden = true; }

  // A public camera calculation turns the product requirement (metres above
  // the map plane) into the zoom threshold for the current latitude and
  // viewport. One zoom level halves camera height, so the smoothstep below is
  // the 1,000m -> 500m transition requested for the Tesla-like view.
  function automaticPitch(next) {
    if (!map || !next || !next.center) return {};
    var camera = map.calculateCameraOptionsFromCameraLngLatAltRotation(
      next.center, (next.elevation || 0) + 1000, next.bearing || 0, 0);
    var t = Math.max(0, Math.min(1, next.zoom - camera.zoom));
    var smooth = t * t * (3 - 2 * t);
    return { pitch: 50 * smooth };
  }

  // The zoom that lands a site in full 50-degree pitch: automaticPitch ramps
  // across one level above its 1,000m cutoff. The z19 product ceiling leaves
  // room for that close-up and for MapLibre to overzoom OpenFreeMap's z14
  // source tiles while keeping the camera bounded.
  //
  // Deliberately a flat 1000 rather than the site's own elevation_m:
  // automaticPitch reads next.elevation, which is *terrain* elevation and is 0
  // with no DEM attached. Feeding this a different figure would aim past its
  // cutoff rather than at it. Bearing is read live so a rotated map still hits
  // the same threshold automaticPitch computes for itself.
  function zoomFor3D(lngLat) {
    return map.calculateCameraOptionsFromCameraLngLatAltRotation(
      lngLat, 1000, map.getBearing(), 0).zoom + 1;
  }

  var overviewMinZoom = -2;
  var overviewMaxZoom = 19;
  var constrainedMaxZoom = overviewMaxZoom;
  var MAX_CAMERA_LAT = 89.9;
  function mercatorY(latitude) {
    var lat = Math.max(-MAX_CAMERA_LAT, Math.min(MAX_CAMERA_LAT, latitude));
    var sin = Math.sin(lat * Math.PI / 180);
    return 0.5 - Math.log((1 + sin) / (1 - sin)) / (4 * Math.PI);
  }
  function latitudeForMercatorY(y) {
    return Math.atan(Math.sinh(Math.PI * (1 - 2 * y))) * 180 / Math.PI;
  }

  // MapLibre normally raises zoom until a Mercator world is tall enough to
  // fill the canvas. That makes a full-world camera impossible on a portrait
  // screen even though the bottom sheet hides the empty lower area. Preserve
  // its normal vertical constraint whenever the world fills the viewport; at
  // wider zooms, keep the whole world on-canvas while allowing the overview
  // camera to place it in the visible space above the sheet.
  function constrainCamera(center, zoom) {
    var z = Math.max(overviewMinZoom, Math.min(constrainedMaxZoom, +zoom));
    var worldSize = 512 * Math.pow(2, z);
    // #map is full-bleed, so innerHeight is its authoritative CSS height and
    // avoids a layout read in this per-frame camera path.
    var height = window.innerHeight;
    var halfHeight = height / 2;
    var y = mercatorY(center.lat) * worldSize;
    var minY = worldSize >= height ? halfHeight : worldSize - halfHeight;
    var maxY = worldSize >= height ? worldSize - halfHeight : halfHeight;
    var constrainedY = Math.max(minY, Math.min(maxY, y));
    return {
      // Most interactions are nowhere near a pole, so avoid the inverse
      // projection and allocation unless the center actually needs clamping.
      center: constrainedY === y ? center : new maplibregl.LngLat(
        center.lng, latitudeForMercatorY(constrainedY / worldSize)),
      zoom: z
    };
  }

  if (!window.maplibregl) {
    showMapError("mapSoftwareError");
  } else {
    try {
      // Lazy mode downloads and initialises shaping only when RTL glyphs are
      // encountered. A relative URL keeps the worker usable under file://.
      if (maplibregl.setRTLTextPlugin && maplibregl.getRTLTextPluginStatus &&
          maplibregl.getRTLTextPluginStatus() === "unavailable") {
        maplibregl.setRTLTextPlugin(
          new URL("vendor/mapbox-gl-rtl-text.js", document.baseURI).href, true
        ).catch(function () {});
      }
      map = new maplibregl.Map({
        container: "map",
        style: "https://tiles.openfreemap.org/styles/dark",
        center: [0, 20],
        zoom: 2,
        // The temporary floor leaves room for a portrait viewport to fit the
        // world. Once the list has established its final size, the exact
        // all-sites camera becomes the real minimum in syncOverviewFloor().
        minZoom: -2,
        maxZoom: overviewMaxZoom,
        renderWorldCopies: true,
        attributionControl: false,
        locale: maplibreLocale(),
        dragRotate: true,
        pitchWithRotate: false,
        touchPitch: false,
        touchZoomRotate: true,
        canvasContextAttributes: { antialias: true },
        transformCameraUpdate: automaticPitch,
        transformConstrain: constrainCamera
      });
      // Keep the custom constraint synchronized with MapLibre's public
      // ceiling without adding a method call to every drag/zoom frame.
      var setMaxZoom = map.setMaxZoom;
      map.setMaxZoom = function (zoom) {
        constrainedMaxZoom = +zoom;
        return setMaxZoom.call(this, zoom);
      };
    } catch (e) {
      showMapError("webglError");
      map = null;
    }
  }

  // Both cards are opaque and sit ON the map, so anything framed without
  // allowing for them lands underneath and looks like it failed to move.
  var GUTTER = 24;

  // Measured from the card's leading EDGE to the far side of the viewport,
  // never from its own width or height. A sheet part-way through a drag hangs
  // below the viewport, so its height describes an obstacle bigger than the one
  // actually covering the map -- and once the sheet can move, that is the
  // normal case rather than an edge case.
  function coveredBelow(el) { return window.innerHeight - el.getBoundingClientRect().top; }
  function coveredRight(el) { return window.innerWidth - el.getBoundingClientRect().left; }
  function coveredLeft(el) { return el.getBoundingClientRect().right; }
  function rtl() { return locale.dir === "rtl"; }

  // Sheet gestures and search expansion are transient UI, not new definitions
  // of the atlas. Always derive the global floor from the list's resting half
  // detent so filters, detail cards and drag state cannot move that limit.
  function overviewCoveredBelow() {
    if (layout() !== "sheet" || !panelSheet) return coveredBelow(panelEl);
    var bottom = parseFloat(getComputedStyle(panelEl).bottom) || 0;
    return detents(panelSheet).half + bottom;
  }

  // cameraForBounds cannot satisfy padding that leaves nothing to frame into.
  // A full-height detail sheet on a landscape phone asked for 333px of vertical
  // padding inside 375px of viewport, which is not a camera: the site would be
  // placed by whatever MapLibre does when it runs out of room, not by us.
  // Scale each axis back proportionally so at least 30% of the canvas survives.
  //
  // This is a floor, not a resize -- on desktop the widest ask is 436px of
  // 1500px, so the factors are exactly 1 and the returned object is identical
  // to the un-clamped one.
  var MIN_FRAME = 0.3;
  function clampPad(pad) {
    var room = function (total, a, b) {
      var limit = total * (1 - MIN_FRAME);
      return a + b > limit ? limit / (a + b) : 1;
    };
    var kx = room(window.innerWidth, pad.left, pad.right);
    var ky = room(window.innerHeight, pad.top, pad.bottom);
    return { top: pad.top * ky, right: pad.right * kx,
             bottom: pad.bottom * ky, left: pad.left * kx };
  }

  function overviewPad() {
    if (layout() === "sheet") {
      return clampPad({ top: GUTTER, right: GUTTER,
        bottom: overviewCoveredBelow() + GUTTER, left: GUTTER });
    }
    return clampPad(rtl()
      ? { top: GUTTER, right: GUTTER, bottom: GUTTER,
          left: coveredLeft(panelEl) + GUTTER }
      : { top: GUTTER, right: coveredRight(panelEl) + GUTTER,
          bottom: GUTTER, left: GUTTER });
  }

  function framePad() {
    if (detailEl.hidden) return overviewPad();
    switch (layout()) {
      case "sheet":
        return clampPad({ top: GUTTER, right: GUTTER,
                          bottom: coveredBelow(detailEl) + GUTTER, left: GUTTER });
      // The detail card overlays the list on the right edge here rather than
      // taking the opposite one, so there is a single obstacle, not two.
      case "side":
        return clampPad(rtl()
          ? { top: GUTTER, right: GUTTER, bottom: GUTTER,
              left: coveredLeft(detailEl) + GUTTER }
          : { top: GUTTER, right: coveredRight(detailEl) + GUTTER,
              bottom: GUTTER, left: GUTTER });

        return clampPad(rtl()
          ? { top: GUTTER,
              right: window.innerWidth - detailEl.getBoundingClientRect().left + GUTTER,
              bottom: GUTTER, left: coveredLeft(panelEl) + GUTTER }
          : { top: GUTTER, right: coveredRight(panelEl) + GUTTER,
              bottom: GUTTER,
              left: detailEl.getBoundingClientRect().right + GUTTER });

    return detailEl.hidden ? overviewPad() : framePad();

    return {
      x: (pad.left + window.innerWidth - pad.right) / 2,

    var bounds = new maplibregl.LngLatBounds();
    sites.forEach(function (s) { bounds.extend([s.longitude, s.latitude]); });

  // The floor is the responsive camera for the complete, unfiltered atlas in
  // its resting shell. Detail cards and filters must not make it drift. The
  // -2 clamp is MapLibre's supported lower bound and only matters for
  // pathologically narrow viewports; normal phone widths remain above it.
  function syncOverviewFloor(reframe) {
    if (!map) return null;
    var padding = overviewPad();
    // cameraForBounds is exact to a fraction of a CSS pixel. Give boundary
    // sites two real pixels of breathing room so projection rounding cannot
    // leave an extremal site just outside the unobscured overview.
    Object.keys(padding).forEach(function (edge) { padding[edge] += 2; });
    var camera = map.cameraForBounds(boundsForSites(DATA.sites), {
      padding: padding, maxZoom: map.getMaxZoom()

    map.setMinZoom(camera.zoom);

      map.stop();
      map.jumpTo(camera);
