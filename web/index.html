<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tesla Iconic Charger badges — world map</title>

<!-- Tiles are the long pole once the script is local, so open the connection
     while the HTML is still parsing. Deliberately NO crossorigin: Leaflet
     requests tiles as plain no-CORS <img>, and a CORS-mode preconnect would
     sit unused while the browser opened a second connection anyway. -->
<link rel="preconnect" href="https://basemaps.cartocdn.com">

<!-- Vendored rather than CDN-loaded. Browsers partition the HTTP cache by
     top-level site, so a shared CDN copy is never reused across sites -- the
     third-party origin buys nothing and costs a DNS + TLS round trip that
     blocks map init. Both files are byte-identical to unpkg's leaflet@1.9.4
     (verified against the SRI hashes this page used to pin). -->
<link rel="stylesheet" href="vendor/leaflet.css">
<script defer src="vendor/leaflet.js"></script>
<script defer src="sites.js"></script>
<style>
  :root {
    color-scheme: dark;
    --page:           #000000;
    --surface-1:      #131313;

    /* The panel floats over the basemap, so "background" is a composite, not a
       constant. dark_all lands between #16 and #2a under a 22px blur, so every
       ratio below is quoted against #2a2a2a -- the worst case, a dense cluster
       of map labels smeared beneath the panel. On plain dark map they are far
       better. */
    --panel:          #141414d6;
    --panel-solid:    #141414;
    --edge:           #ffffff17;

    --text-primary:   #ffffff;   /* 14.4:1 */
    --text-secondary: #b9b9b9;   /*  7.3:1 */
    --text-muted:     #999999;   /*  5.0:1 */

    /* Tesla reserves its blue for the primary action alone, and the ratios
       agree with the convention: #3e6ae1 is 3.9:1 on the panel -- fine for a
       focus ring (3:1), short of the 4.5:1 that text needs. White ON the blue
       is 4.8:1, so it may be a filled button but never coloured text. There
       are deliberately no blue links in this file. */
    --accent:         #3e6ae1;
    --accent-ring:    #5b82f0;

    /* Map pin, styled after Tesla's own Supercharger marker.
       Gold on the dark basemap: 9.35:1 over water, 8.03:1 over land.
       Bolt on gold: 7.59:1. Swap --pin-gold to #d4af37 for antique gold. */
    --pin-gold: #e8b923;
    --pin-bolt: #2c2c2a;
    --pin-edge: #1b1b1b;

    /* Tesla ships Universal Sans across car, app and site. It is proprietary,
       so this is Tesla's own declared fallback -- a webfont would cost a round
       trip on the critical path for a family we cannot legally serve anyway.
       The Tesla read comes from weight and spacing, not the glyphs: 500 where
       a dashboard would reach for 600, and a lot more air. */
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    background: var(--page);
    color: var(--text-primary);
    font: 400 14px/1.45 var(--font);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  /* ------------------------------------------------------------ the map --- */
  /* Full-bleed: the map is the substrate and everything else floats on it. */
  #map { position: absolute; inset: 0; background: var(--surface-1); }
  .leaflet-container { background: var(--surface-1); font: inherit; }

  /* Round floating controls, bottom-right, clear of the panel.
     leaflet.css styles these with :first-child/:last-child/.leaflet-touch
     selectors that outrank a plain `.leaflet-bar a`, so the overrides have to
     match its specificity corner for corner rather than just come later. */
  .leaflet-bar { border: 0 !important; box-shadow: none; }
  .leaflet-bar a,
  .leaflet-bar a:hover,
  .leaflet-bar a:focus,
  .leaflet-touch .leaflet-bar a {
    width: 40px; height: 40px; line-height: 38px;
    border: 1px solid var(--edge); border-radius: 50%;
    background: var(--panel);
    -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
    color: var(--text-primary); font-size: 19px; font-weight: 400;
  }
  .leaflet-bar a:first-child,
  .leaflet-bar a:last-child,
  .leaflet-touch .leaflet-bar a:first-child,
  .leaflet-touch .leaflet-bar a:last-child { border-radius: 50%; }
  .leaflet-bar a:last-child { border-bottom: 1px solid var(--edge); }
  .leaflet-bar a:first-child { margin-bottom: 8px; }
  .leaflet-bar a:hover, .leaflet-bar a:focus { background: #262626e6; }
  .leaflet-bar a.leaflet-disabled,
  .leaflet-bar a.leaflet-disabled:hover { background: var(--panel); color: #5a5a5a; }
  .leaflet-control-attribution {
    padding: 2px 8px; border-radius: 999px;
    background: #000000a6 !important; color: var(--text-muted) !important; font-size: 10px;
  }
  .leaflet-control-attribution a { color: var(--text-secondary) !important; }

  /* ---------------------------------------------------------- the panel --- */
  /* A sibling of #map, never a child and never a Leaflet control. The
     continuous-zoom handler is bound to map.getContainer(), so a wheel over a
     sibling bubbles to <body> and cannot reach the map; nesting the panel
     inside the map container would need disableScrollPropagation, and would
     silently make this list unscrollable the day someone forgot it. */
  #panel {
    position: absolute; top: 16px; left: 16px; bottom: 16px; width: 372px;
    z-index: 1001;                  /* leaflet.css puts .leaflet-top/bottom at 1000 */
    display: flex; flex-direction: column; overflow: hidden;
    border: 1px solid var(--edge); border-radius: 18px;
    background: var(--panel);
    -webkit-backdrop-filter: blur(22px) saturate(140%);
    backdrop-filter: blur(22px) saturate(140%);
    box-shadow: 0 18px 50px #0000008c;
  }
  @supports not (backdrop-filter: blur(2px)) {
    #panel, .leaflet-bar a, .leaflet-bar a:hover { background: #141414f5; }
  }
  #panel > section { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  #panel > section[hidden] { display: none; }

  /* ------------------------------------------------------------- header --- */
  .head { padding: 18px 18px 12px; }
  h1 {
    margin: 0 0 14px; font-size: 15px; font-weight: 500; letter-spacing: -0.01em;
  }
  h1 span { display: block; margin-top: 3px; color: var(--text-muted); font-size: 12px; font-weight: 400; }

  .search { position: relative; display: flex; align-items: center; }
  .search .mag {
    position: absolute; left: 16px; color: var(--text-muted); pointer-events: none;
  }
  #q {
    width: 100%; height: 48px; padding: 0 42px 0 44px;
    border: 1px solid transparent; border-radius: 999px;
    background: #ffffff14; color: var(--text-primary);
    font: 400 15px/1 var(--font);
  }
  #q::placeholder { color: var(--text-muted); }
  #q:focus { outline: none; border-color: var(--accent-ring); background: #ffffff1f; }
  #q::-webkit-search-cancel-button { display: none; }
  #clear {
    position: absolute; right: 8px;
    display: flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; padding: 0;
    border: 0; border-radius: 50%; background: #ffffff1a;
    color: var(--text-secondary); cursor: pointer;
  }
  #clear:hover { background: #ffffff2b; color: var(--text-primary); }

  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
  .chip {
    min-height: 34px; padding: 0 14px;
    border: 0; border-radius: 999px;
    background: #ffffff14; color: var(--text-secondary);
    font: 500 13px/1 var(--font); cursor: pointer;
    transition: background 120ms ease-out, color 120ms ease-out;
  }
  .chip:hover { background: #ffffff26; color: var(--text-primary); }
  /* Tesla's selected state is a light fill with dark text, not a tinted
     outline. aria-pressed keeps the existing multi-select semantics. */
  .chip[aria-pressed="true"] { background: #f2f2f2; color: #111111; }
  .chip[aria-pressed="true"]:hover { background: #ffffff; }

  .countrow {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    margin-top: 14px;
  }
  #count { color: var(--text-muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  /* An action, not a region filter -- so deliberately outside the chips group. */
  .near {
    display: inline-flex; align-items: center; gap: 6px; flex: none;
    min-height: 30px; padding: 0 12px;
    border: 1px solid var(--edge); border-radius: 999px;
    background: transparent; color: var(--text-secondary);
    font: 500 12px/1 var(--font); cursor: pointer; white-space: nowrap;
  }
  .near:hover:not(:disabled) { background: #ffffff14; color: var(--text-primary); }
  .near[aria-pressed="true"] { background: #f2f2f2; border-color: #f2f2f2; color: #111111; }
  .near:disabled { opacity: 0.55; cursor: default; }
  #nearmsg { margin: 8px 0 0; color: var(--text-muted); font-size: 11.5px; }
  #nearmsg[hidden] { display: none; }

  /* --------------------------------------------------------------- list --- */
  #list { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 10px 14px; }
  .region-head {
    position: sticky; top: 0; z-index: 1;
    margin: 10px 0 2px; padding: 8px 8px 6px;
    background: var(--panel-solid); color: var(--text-muted);
    font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
  }
  .item {
    display: grid; grid-template-columns: 40px 1fr auto; align-items: center;
    gap: 12px; width: 100%;
    padding: 11px 8px;
    border: 0; border-radius: 12px;
    background: none; color: inherit; font: inherit; text-align: left; cursor: pointer;
  }
  /* `display: grid` above outranks the UA's `[hidden] { display: none }`,
     so filtered-out rows need this or they stay on screen. */
  .item[hidden] { display: none; }
  .item:hover { background: #ffffff12; }
  .item:focus-visible { outline: 2px solid var(--accent-ring); outline-offset: -2px; }
  .item[aria-current="true"] { background: #ffffff1f; }
  .ico {
    display: flex; align-items: center; justify-content: center;
    width: 40px; height: 40px; border-radius: 12px;
    background: #ffffff14; color: var(--text-secondary);
  }
  .item[aria-current="true"] .ico { background: var(--pin-gold); color: var(--pin-bolt); }
  .ico svg { fill: currentColor; display: block; }
  .txt { min-width: 0; }
  .nm {
    display: block; color: var(--text-primary); font-size: 15px; font-weight: 500;
    letter-spacing: -0.005em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .sub {
    display: block; margin-top: 2px; color: var(--text-muted); font-size: 12.5px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .approx {
    display: inline-block; margin-left: 7px; padding: 1px 6px; vertical-align: 1px;
    border-radius: 5px; background: #ffffff1a;
    color: var(--text-muted); font-size: 10px; font-weight: 500; letter-spacing: 0.03em;
  }
  .meta {
    display: flex; flex-direction: column; align-items: flex-end; justify-content: center;
    gap: 2px; flex: none;
    font-variant-numeric: tabular-nums;
  }
  .dist { color: var(--text-secondary); font-size: 12.5px; font-weight: 500; }
  .dist[hidden] { display: none; }
  .stalls { display: flex; align-items: center; gap: 3px; color: var(--text-muted); font-size: 12px; }
  .stalls svg { fill: currentColor; display: block; }
  .empty { padding: 26px 10px; color: var(--text-muted); }

  .foot {
    margin: 0; padding: 11px 18px 13px;
    border-top: 1px solid var(--edge);
    color: var(--text-muted); font-size: 11px; line-height: 1.5;
  }
  .foot svg { fill: currentColor; vertical-align: -1px; }

  /* ------------------------------------------------------- detail card --- */
  .dhead { padding: 14px 14px 0; }
  .iconbtn {
    display: flex; align-items: center; justify-content: center;
    width: 38px; height: 38px; padding: 0;
    border: 0; border-radius: 50%; background: #ffffff14;
    color: var(--text-primary); cursor: pointer;
  }
  .iconbtn:hover { background: #ffffff26; }
  .iconbtn:focus-visible, .chip:focus-visible, .near:focus-visible,
  #clear:focus-visible, .btn:focus-visible, .srow:focus-visible {
    outline: 2px solid var(--accent-ring); outline-offset: 2px;
  }
  .dbody { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 18px 20px; }
  .dbody h2 {
    margin: 0; font-size: 22px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.2;
  }
  .dmeta { margin: 6px 0 0; color: var(--text-muted); font-size: 12.5px; }

  .stats {
    display: flex; flex-wrap: wrap; gap: 8px;
    margin-top: 16px;
  }
  .stat {
    flex: 1 1 84px; padding: 11px 12px;
    border-radius: 12px; background: #ffffff0f;
  }
  .stat b {
    display: block; font-size: 18px; font-weight: 500; letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
  }
  .stat span { display: block; margin-top: 1px; color: var(--text-muted); font-size: 11.5px; }

  .dwhy { margin: 16px 0 0; color: var(--text-secondary); font-size: 13.5px; line-height: 1.55; }
  .dnote {
    margin: 10px 0 0; padding: 10px 12px;
    border-radius: 10px; background: #ffffff0f;
    color: var(--text-muted); font-size: 12px; line-height: 1.5;
  }

  .sitelist { margin-top: 18px; }
  .lbl {
    margin: 0 0 6px; color: var(--text-muted);
    font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
  }
  .srow {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    width: 100%; padding: 10px 12px; margin-top: 4px;
    border: 0; border-radius: 10px; background: #ffffff0f;
    color: var(--text-secondary); font: inherit; font-size: 13px; text-align: left; cursor: pointer;
  }
  .srow:hover { background: #ffffff1f; color: var(--text-primary); }
  .srow[aria-current="true"] { background: #ffffff26; color: var(--text-primary); }
  .srow .sst { flex: none; color: var(--text-muted); font-variant-numeric: tabular-nums; }

  .dbody dl {
    display: grid; grid-template-columns: auto 1fr; gap: 6px 14px;
    margin: 18px 0 0; padding-top: 16px; border-top: 1px solid var(--edge); font-size: 12.5px;
  }
  .dbody dt { color: var(--text-muted); }
  .dbody dd { margin: 0; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .dbody dd.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; }

  .dfoot { padding: 12px 18px 14px; border-top: 1px solid var(--edge); }
  .actions { display: flex; gap: 8px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 44px; padding: 0 18px;
    border-radius: 999px; background: #ffffff1a;
    color: var(--text-primary); font: 500 13.5px/1 var(--font);
    text-decoration: none; cursor: pointer;
  }
  .btn:hover { background: #ffffff2b; }
  /* The one place the blue appears. White on it is 4.8:1. */
  .btn.primary { flex: 1; background: var(--accent); color: #ffffff; }
  .btn.primary:hover { background: #3059cc; }

  /* ------------------------------------------------------ Supercharger pill */
  /* Modelled on Tesla's map marker: a capsule holding a bolt and the charger
     count. Built from HTML rather than a fixed SVG so the capsule grows with
     its digits - "164" needs more room than "6". */
  .cap {
    display: inline-flex; align-items: center; gap: 3px;
    height: 24px; padding: 0 8px;
    border: 1.5px solid var(--pin-edge); border-radius: 999px;
    background: var(--pin-gold);
    color: var(--pin-bolt);
    font: 600 12px/1 var(--font);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    transition: transform 90ms ease-out;
  }
  .cap svg { display: block; fill: var(--pin-bolt); flex: none; }

  /* Only map markers are pinned to a coordinate. Leaflet drives the OUTER
     element with translate3d(), so the centring transform lives on .cap. */
  .pin { background: none; border: 0; width: auto !important; height: auto !important; }
  .pin .cap {
    position: absolute;
    transform: translate(-50%, -50%);
    transform-origin: 50% 50%;
  }
  .leaflet-marker-icon.pin:hover .cap { transform: translate(-50%, -50%) scale(1.12); }
  .pin.is-selected .cap {
    transform: translate(-50%, -50%) scale(1.15);
    filter: drop-shadow(0 0 7px #e8b92399);
  }

  .leaflet-tooltip.tip {
    padding: 6px 11px; border: 1px solid var(--edge); border-radius: 999px;
    background: #000000e6; color: var(--text-primary);
    font: 500 12.5px/1 var(--font); box-shadow: none;
  }
  .leaflet-tooltip.tip::before { display: none; }

  /* -------------------------------------------------------------- narrow --- */
  /* Bottom sheet, the way the car does it on a portrait screen. */
  @media (max-width: 820px) {
    #panel {
      top: auto; left: 10px; right: 10px; bottom: 10px; width: auto;
      max-height: 64vh; border-radius: 20px;
    }
    .head { padding: 14px 14px 10px; }
    h1 { margin-bottom: 12px; }
    .dbody { padding: 12px 14px 18px; }
  }
</style>
</head>
<body>

<div id="map"></div>

<div id="panel">
  <section id="view-list">
    <div class="head">
      <h1>Iconic Chargers <span id="total"></span></h1>

      <div class="search">
        <svg class="mag" width="16" height="16" viewBox="0 0 16 16" fill="none"
             stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <circle cx="7" cy="7" r="4.6"/><path d="M10.6 10.6 14 14" stroke-linecap="round"/>
        </svg>
        <input id="q" type="search" placeholder="Search Iconic Chargers" autocomplete="off"
               aria-label="Search badges, cities and countries">
        <button id="clear" type="button" hidden aria-label="Clear search">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor"
               stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
            <path d="M3.6 3.6l6.8 6.8M10.4 3.6l-6.8 6.8"/>
          </svg>
        </button>
      </div>

      <div class="chips" id="filters" role="group" aria-label="Filter by region"></div>

      <div class="countrow">
        <span id="count" aria-live="polite"></span>
        <button id="near" class="near" type="button" aria-pressed="false">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor"
               stroke-width="1.5" aria-hidden="true">
            <circle cx="8" cy="8" r="2.6"/><circle cx="8" cy="8" r="6" opacity=".5"/>
            <path d="M8 .5v2M8 13.5v2M.5 8h2M13.5 8h2" stroke-linecap="round"/>
          </svg>
          <span id="nearlbl">Near me</span>
        </button>
      </div>
      <p id="nearmsg" hidden aria-live="polite"></p>
    </div>

    <div id="list"></div>

    <!-- The legend went with the colour key, but this distinction did not:
         Tesla's own map shows stalls FREE RIGHT NOW in the same visual
         language, and there is no live feed here. -->
    <p class="foot">
      <svg width="7" height="10" viewBox="0 0 9 13" aria-hidden="true">
        <path d="M5.6 0 0 7.4h3.4L2.3 13 9 5.2H5.1z"/></svg>
      is total stalls, not live availability.
    </p>
  </section>

  <section id="view-detail" hidden>
    <div class="dhead">
      <button id="back" class="iconbtn" type="button" aria-label="Back to list">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor"
             stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M11 3.5 5.5 9l5.5 5.5"/>
        </svg>
      </button>
    </div>
    <div class="dbody">
      <h2 id="d-title"></h2>
      <p class="dmeta" id="d-meta"></p>
      <div class="stats" id="d-stats"></div>
      <p class="dwhy" id="d-why"></p>
      <div id="d-notes"></div>
      <div id="d-sites"></div>
      <dl id="d-facts"></dl>
    </div>
    <!-- Outside .dbody on purpose: a nine-site badge pushes a scrolled action
         off the bottom, and the primary action is the one thing that should
         never need hunting for. -->
    <div class="dfoot"><div class="actions" id="d-actions"></div></div>
  </section>
</div>

<script>
// leaflet.js and sites.js are deferred from <head>, so they start downloading
// during parse instead of being discovered down here. Deferred scripts run
// after parsing but before DOMContentLoaded, so waiting on that event is what
// keeps this inline block -- and the single-file app -- ordered behind them.
document.addEventListener("DOMContentLoaded", function () {
  "use strict";

  var DATA = window.ICONIC;
  var BADGES = DATA.badges;
  var REGIONS = DATA.regions;

  // Reason used to be three saturated colours in the list. Tesla's UI is
  // achromatic apart from one reserved accent, so it is text now -- which also
  // means identity is never carried by colour alone.
  var REASON_LABEL = {
    flagship:     "Flagship Tesla site",
    significance: "Special significance",
    destination:  "Famous destination"
  };
  var REASON_SHORT = { flagship: "Flagship", significance: "Significance", destination: "Destination" };

  var sitesOf = {};
  DATA.sites.forEach(function (s) {
    (sitesOf[s.badge] = sitesOf[s.badge] || []).push(s);
  });

  var active = new Set(REGIONS);
  var query = "";
  var selected = null;
  var here = null;        // {lat, lng} once Near me is granted -- never on load
  var distKm = {};        // badge -> km to its NEAREST site
  var order = null;       // badge names by distance, or null for region order

  var panelEl = document.getElementById("panel");

  var map = L.map("map", {
    worldCopyJump: true, minZoom: 2, maxZoom: 17,
    // Left at the default deliberately: whole-level snapping is what keeps
    // fitBounds/setView/flyTo landing on a crisp raster level. The wheel
    // gesture below gets its smoothness without touching this -- see there.
    zoomSnap: 1,
    // Read by the wheel handler below, not by Leaflet's, which is off. On a
    // retina Mac Leaflet reads a 120px notch as a delta of 20 (wheelPxFactor
    // = 3 x devicePixelRatio), so 25 here is ~0.55 levels a notch: enough
    // that one notch of a discrete mouse wheel settles a whole level.
    wheelPxPerZoomLevel: 25,
    scrollWheelZoom: false
  });
  map.zoomControl.setPosition("bottomright");

  // No {s} sharding: a/b/c/d are one Fastly host behind a *.basemaps wildcard
  // cert, so the browser coalesces them onto a single HTTP/2 connection
  // regardless. The shards only ever cost three extra DNS lookups, and they
  // split the preconnect four ways.
  L.tileLayer("https://basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
    attribution:
      '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors ' +
      '&copy; <a href="https://carto.com/attributions">CARTO</a> &middot; ' +
      'site data <a href="https://supercharge.info">supercharge.info</a>',
    maxZoom: 20,
    // Selecting a badge flies the map across many zoom levels. Without this,
    // every level crossed en route requests a full screen of tiles that is
    // discarded before it can be seen -- competing with the tiles at the
    // destination, which are the only ones anybody looks at.
    // (keepBuffer was tried at 3, 4 and 6 and left at its default: it governs
    // which loaded tiles are *retained*, not which are fetched ahead, so it
    // changed neither the tiles needed for a view nor the cost of a drag.)
    updateWhenZooming: false
  }).addTo(map);

  // The panel is opaque and sits ON the map, so anything framed without
  // allowing for it lands underneath and looks like it failed to move.
  // _getBoundsCenterZoom honours paddingTopLeft/paddingBottomRight next to
  // maxZoom, so one helper covers every view call in this file.
  function framePad() {
    var r = panelEl.getBoundingClientRect();
    return window.innerWidth <= 820
      ? { paddingTopLeft: [24, 24], paddingBottomRight: [24, r.height + 24] }
      : { paddingTopLeft: [r.right + 24, 24], paddingBottomRight: [24, 24] };
  }

  // Straight after the tile layer, before any marker or panel work: a map
  // with no view requests no tiles, so this is the line that starts the
  // network. Everything placed above it is latency added to the first paint.
  map.fitBounds(
    L.latLngBounds(DATA.sites.map(function (s) { return [s.latitude, s.longitude]; })),
    framePad()
  );

  /* --------------------------------------------------------- wheel zoom ---
     Leaflet's own wheel zoom is off (scrollWheelZoom: false) because it goes
     through setView(), and setView() silently discards any zoom requested
     while a previous one is still animating:

       _tryAnimatedZoom(c, z, o) { if (!this._animatingZoom) { ...animate... }
                                   return true }        // <- true regardless
       setView: ... if (this._tryAnimatedZoom(...)) return this;   // dropped

     The animation is a 250ms CSS transition, and _performZoom zeroes its
     accumulated delta *before* the dropped call, so that motion is gone.
     Measured on the old handler, six identical notches moved the map 1 level
     at 30ms spacing, 2 at 60ms and 3 at 200ms -- the faster you scrolled, the
     more input was thrown away. Whole-level snapping hid it: each surviving
     notch jumped a full level, which is the "stepped" feel.

     So drive the gesture the way Leaflet drives pinch-zoom (Map.TouchZoom):
     a rAF loop calling map._move() directly. Three properties matter, all
     from the vendored 1.9.4 source:

       - _move() assigns `this._zoom = zoom` verbatim, with no _limitZoom.
         The gesture can therefore be fractional while zoomSnap stays 1, so
         every other view call in this file still lands on a whole level and
         none of them needed changing.
       - It never fires viewprereset. A non-animated setView() would, and
         GridLayer binds viewprereset to _invalidateAll -- one notch would
         drop every tile and rebuild the grid.
       - Tagged {pinch: true} it takes the same path as a flight through
         GridLayer._setView, so updateWhenZooming: false keeps holding and
         the grid is transformed rather than refetched mid-gesture.

     Private methods are used on purpose: Leaflet is vendored and pinned in
     this repo, so they cannot drift underneath us. */
  var WHEEL_EASE = 0.3;    // fraction of the remaining distance per frame
  var WHEEL_IDLE = 180;    // ms of quiet that ends the gesture
  var WHEEL_DEADZONE = 0.08;   // levels below which a gesture is a stray nudge
  var wz = { on: false, from: 0, goal: 0, zoom: 0, anchor: null, at: null, frame: 0, timer: 0 };

  // The centre that keeps `anchor` under the cursor at zoom z -- the same
  // formulation TouchZoom uses for the pinch midpoint.
  function wheelCenter(z) {
    var off = wz.at.subtract(map.getSize().divideBy(2));
    return map.unproject(map.project(wz.anchor, z).subtract(off), z);
  }

  function wheelFrame() {
    var z = wz.zoom + (wz.goal - wz.zoom) * WHEEL_EASE;
    if (Math.abs(wz.goal - z) < 0.002) z = wz.goal;
    if (z !== wz.zoom) {
      wz.zoom = z;
      map._move(wheelCenter(z), z, { pinch: true });
    }
    wz.frame = requestAnimationFrame(wheelFrame);
  }

  function wheelEnd() {
    if (!wz.on) return;
    wz.on = false;
    cancelAnimationFrame(wz.frame);
    // _limitZoom is where zoomSnap finally applies, so the map comes to rest
    // on a whole level and the raster tiles are crisp again. Settle on the
    // goal rather than the rendered zoom: if rAF was throttled mid-gesture,
    // the map should still finish where the wheel actually asked it to go.
    var z = map._limitZoom(wz.goal);
    // Rounding to nearest can land back where the gesture started -- one
    // notch is only ~0.55 levels and a gentle trackpad drag is less. Scrolling
    // and having nothing happen at all is worse than moving a level, so past
    // a dead zone the gesture always commits one level in the direction it
    // was already going.
    var moved = wz.goal - wz.from;
    if (z === wz.from && Math.abs(moved) > WHEEL_DEADZONE) {
      z = map._limitZoom(wz.from + (moved > 0 ? 1 : -1));
    }
    map._animateZoom(wheelCenter(z), z, true, map.options.zoomSnap);
  }

  // passive: false -- this listener calls preventDefault, without which
  // ctrl+wheel is the browser's own page zoom.
  map.getContainer().addEventListener("wheel", function (e) {
    e.preventDefault();
    // Leaflet's own delta normalisation and its own response curve, applied
    // per event instead of per debounced burst. Nothing device-specific is
    // reimplemented here; the curve saturates at four levels so a single
    // freak event cannot throw the map across the world.
    var d = L.DomEvent.getWheelDelta(e) / (4 * map.options.wheelPxPerZoomLevel);
    var levels = 4 * Math.log(2 / (1 + Math.exp(-Math.abs(d)))) / Math.LN2;
    if (d < 0) levels = -levels;
    if (!levels) return;                       // horizontal-only scroll

    wz.at = map.mouseEventToContainerPoint(e);
    if (!wz.on) {
      map._stop();                                         // cancel a flight
      if (map._animatingZoom) map._onZoomTransitionEnd();  // finish a button zoom
      wz.on = true;
      wz.from = wz.zoom = wz.goal = map.getZoom();
      map._moveStart(true, false);
      wz.frame = requestAnimationFrame(wheelFrame);
    }
    // Re-read each event so the zoom follows a cursor that moves mid-gesture.
    wz.anchor = map.containerPointToLatLng(wz.at);
    // Clamped rather than accumulated: otherwise ten notches past maxZoom
    // would have to be scrolled back before the map moved at all.
    wz.goal = Math.max(map.getMinZoom(), Math.min(map.getMaxZoom(), wz.goal + levels));

    clearTimeout(wz.timer);
    wz.timer = setTimeout(wheelEnd, WHEEL_IDLE);
  }, { passive: false });


  /* ------------------------------------------------------------ helpers --- */
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function place(s) {
    return [s.city, s.state, s.country].filter(Boolean).join(", ");
  }
  function shortPlace(s) {
    return [s.city, s.state || s.country].filter(Boolean).join(", ");
  }
  function text(el, s) {
    if (el.textContent !== s) el.textContent = s;
  }

  var BOLT =
    '<svg width="9" height="13" viewBox="0 0 9 13" aria-hidden="true">' +
      '<path d="M5.6 0 0 7.4h3.4L2.3 13 9 5.2H5.1z"/></svg>';
  var BOLT_SM =
    '<svg width="7" height="10" viewBox="0 0 9 13" aria-hidden="true">' +
      '<path d="M5.6 0 0 7.4h3.4L2.3 13 9 5.2H5.1z"/></svg>';

  // Miles where the locale expects them, kilometres otherwise. Tesla follows
  // the car's unit setting; a browser only offers the language tag.
  var MILES = /^en-US\b/i.test(navigator.language || "");
  function haversine(aLat, aLng, bLat, bLng) {
    var R = 6371, r = Math.PI / 180;
    var dLat = (bLat - aLat) * r, dLng = (bLng - aLng) * r;
    var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(aLat * r) * Math.cos(bLat * r) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
  }
  function fmtDist(km) {
    if (km == null) return "";
    var v = MILES ? km * 0.621371 : km;
    return (v >= 10 ? Math.round(v).toLocaleString() : v.toFixed(1)) + (MILES ? " mi" : " km");
  }

  /* ------------------------------------------------------------ markers --- */
  var layer = L.layerGroup().addTo(map);
  var marks = {};   // badge name -> [{marker, site, badge}]

  function pinIcon(stalls, label) {
    // role="img" + <title> rather than the marker's alt option: Leaflet only
    // applies alt to image icons, so a divIcon would otherwise be unnamed.
    var html =
      '<span class="cap" role="img" aria-label="' + esc(label) + '">' +
        BOLT + "<b>" + (stalls || "?") + "</b>" +
      "</span>";
    // iconSize null keeps Leaflet from stamping width/height/margins, so the
    // capsule can size itself; .cap centres on the coordinate in CSS.
    return L.divIcon({
      className: "pin", html: html, iconSize: null, tooltipAnchor: [0, -14]
    });
  }

  BADGES.forEach(function (badge) {
    marks[badge.badge] = sitesOf[badge.badge].map(function (s) {
      var label = badge.site_count > 1 ? badge.badge + " — " + s.name : badge.badge;
      var marker = L.marker([s.latitude, s.longitude], {
        icon: pinIcon(s.stalls, label + ", " + (s.stalls || "?") + " stalls"),
        riseOnHover: true,
        keyboard: true
      });
      marker.bindTooltip(esc(label), { className: "tip", direction: "top" });
      // No popup any more -- a pin opens the same detail card the list does.
      marker.on("click", function () { select(badge.badge, true, s); });
      return { marker: marker, site: s, badge: badge };
    });
  });

  /* ------------------------------------------------------------ filters --- */
  var filtersEl = document.getElementById("filters");
  var regionChip = {};

  // "No filter" and "every region ticked" select the same badges but are not
  // the same state to look at: lighting all five chips on load made the
  // selected style carry no information and turned the filter row into a
  // solid white block. So All is the resting state, and the region chips only
  // light up once a genuine subset is chosen.
  var allRegions = true;

  function syncChips() {
    allChip.setAttribute("aria-pressed", allRegions ? "true" : "false");
    REGIONS.forEach(function (r) {
      if (regionChip[r]) {
        regionChip[r].setAttribute("aria-pressed", !allRegions && active.has(r) ? "true" : "false");
      }
    });
  }

  function showAll() {
    active = new Set(REGIONS);
    allRegions = true;
    syncChips();
    render();
  }

  var allChip = document.createElement("button");
  allChip.className = "chip";
  allChip.type = "button";
  allChip.textContent = "All";
  allChip.addEventListener("click", showAll);
  filtersEl.appendChild(allChip);

  REGIONS.forEach(function (region) {
    var n = BADGES.filter(function (b) { return b.region === region; }).length;
    if (!n) return;
    var b = document.createElement("button");
    b.className = "chip";
    b.type = "button";
    b.dataset.region = region;
    b.textContent = region;
    b.addEventListener("click", function () {
      // Additive, which is what an explicit All chip implies: the first tap
      // narrows to that region, further taps add regions, and un-ticking the
      // last one falls back to All rather than showing nothing.
      if (allRegions) {
        active = new Set([region]);
        allRegions = false;
      } else if (active.has(region)) {
        active.delete(region);
      } else {
        active.add(region);
      }
      if (active.size === 0 || active.size === REGIONS.length) { showAll(); return; }
      syncChips();
      render();
    });
    filtersEl.appendChild(b);
    regionChip[region] = b;
  });
  syncChips();

  /* --------------------------------------------------------------- list --- */
  var listEl = document.getElementById("list");
  var countEl = document.getElementById("count");
  document.getElementById("total").textContent =
    DATA.badge_count + " badges · " + DATA.site_count + " Superchargers · " + DATA.snapshot_date;

  // Search index, built once. Concatenating every badge's sites into a
  // haystack on each keystroke was most of the per-key cost, and the strings
  // never change.
  var HAY = {};
  BADGES.forEach(function (b) {
    HAY[b.badge] = (
      b.badge + " " + b.why + " " + b.region + " " + REASON_SHORT[b.reason] + " " +
      sitesOf[b.badge].map(function (s) { return s.name + " " + place(s); }).join(" ")
    ).toLowerCase();
  });

  function visible() {
    var q = query.trim().toLowerCase();
    return BADGES.filter(function (b) {
      if (!active.has(b.region)) return false;
      return !q || HAY[b.badge].indexOf(q) !== -1;
    });
  }

  // The list is built once and then shown/hidden. Re-parsing 40 rows of
  // innerHTML on every keystroke was throwing away scroll position and
  // selection state as well as the DOM.
  var rowEl = {};      // badge name -> button
  var headEl = {};     // region -> sticky header
  var distEl = {};     // badge name -> the distance line in its row
  var emptyEl = document.createElement("p");
  emptyEl.className = "empty";
  emptyEl.textContent = "No badges match that search.";
  emptyEl.hidden = true;

  REGIONS.forEach(function (region) {
    var inRegion = BADGES.filter(function (b) { return b.region === region; });
    if (!inRegion.length) return;
    var h = document.createElement("div");
    h.className = "region-head";
    listEl.appendChild(h);
    headEl[region] = h;

    inRegion.forEach(function (b) {
      var group = sitesOf[b.badge];
      var sub = (b.site_count > 1
        ? b.site_count + " Superchargers"
        : shortPlace(group[0])) + " · " + REASON_SHORT[b.reason];
      var stalls = b.site_count > 1
        ? group.reduce(function (a, s) { return a + (s.stalls || 0); }, 0)
        : (group[0].stalls || "—");

      var el = document.createElement("button");
      el.className = "item";
      el.type = "button";
      el.dataset.badge = b.badge;
      el.innerHTML =
        '<span class="ico">' + BOLT + "</span>" +
        '<span class="txt">' +
          '<span class="nm">' + esc(b.badge) +
            (b.confidence === "approx" ? '<span class="approx">approx</span>' : "") +
          "</span>" +
          '<span class="sub">' + esc(sub) + "</span>" +
        "</span>" +
        '<span class="meta">' +
          '<span class="dist" hidden></span>' +
          '<span class="stalls">' + BOLT_SM + "<span>" + stalls + "</span></span>" +
        "</span>";
      el.addEventListener("click", function () { select(b.badge, true); });
      listEl.appendChild(el);
      rowEl[b.badge] = el;
      distEl[b.badge] = el.querySelector(".dist");
    });
  });
  listEl.appendChild(emptyEl);

  // Region order is simply the order the nodes were built in, so keep a
  // snapshot to restore when Near me is switched back off.
  var naturalOrder = Array.prototype.slice.call(listEl.children);

  // Rows are built once, so distance sorting reorders by appendChild -- which
  // MOVES the existing nodes rather than recreating them, keeping the whole
  // point of the reconciling render intact.
  function applyOrder() {
    var seq = order
      ? order.map(function (n) { return rowEl[n]; }).concat([emptyEl])
      : naturalOrder;
    seq.forEach(function (el) { listEl.appendChild(el); });
  }

  /* --------------------------------------------------------- the render --- */
  var shown = new Set();     // badge names currently on the map

  function render() {
    var rows = visible();
    var want = new Set(rows.map(function (b) { return b.badge; }));

    // Only add/remove what actually changed. clearLayers() followed by a full
    // re-add destroyed and rebuilt all 53 marker elements on every keystroke,
    // even when the result set was identical.
    Object.keys(marks).forEach(function (name) {
      var on = want.has(name);
      if (on === shown.has(name)) return;
      marks[name].forEach(function (m) {
        if (on) { layer.addLayer(m.marker); } else { layer.removeLayer(m.marker); }
      });
      if (on) { shown.add(name); } else { shown.delete(name); }
    });

    // Filtering the selection away has to clear the row's aria-current too.
    // The old code got this free by rebuilding every row; now the rows persist,
    // so a dropped selection would otherwise leave a row announcing itself as
    // current with no marker selected anywhere -- and, since the detail card
    // replaced the popup, a card open for a badge that is no longer listed.
    if (selected && !want.has(selected)) {
      rowEl[selected].removeAttribute("aria-current");
      highlight(null);
      selected = null;
      if (detailEl.hidden === false) showList(false);
    }

    // Writing textContent replaces the text node whether or not the string
    // differs, so every unguarded write is a DOM mutation for nothing.
    var siteTotal = rows.reduce(function (a, b) { return a + b.site_count; }, 0);
    text(countEl, rows.length === BADGES.length
      ? BADGES.length + " badges · " + DATA.site_count + " Superchargers"
      : rows.length + " of " + BADGES.length + " badges · " + siteTotal +
        (siteTotal === 1 ? " Supercharger" : " Superchargers"));

    BADGES.forEach(function (b) {
      rowEl[b.badge].hidden = !want.has(b.badge);
      var d = distEl[b.badge];
      d.hidden = !here;
      if (here) text(d, fmtDist(distKm[b.badge]));
    });

    // Sorted by distance, the region headings are meaningless -- and the rows
    // no longer sit under them.
    REGIONS.forEach(function (region) {
      var h = headEl[region];
      if (!h) return;
      if (order) { h.hidden = true; return; }
      var n = 0;
      BADGES.forEach(function (b) { if (b.region === region && want.has(b.badge)) n++; });
      h.hidden = n === 0;
      if (n) text(h, region + " · " + n);
    });
    emptyEl.hidden = rows.length > 0;
  }

  // Typing faster than the display refreshes should still cost one render.
  var queued = false;
  function scheduleRender() {
    if (queued) return;
    queued = true;
    requestAnimationFrame(function () { queued = false; render(); });
  }

  /* --------------------------------------------------------- detail card --- */
  var listView   = document.getElementById("view-list");
  var detailEl   = document.getElementById("view-detail");
  var backEl     = document.getElementById("back");
  var dTitle     = document.getElementById("d-title");
  var dMeta      = document.getElementById("d-meta");
  var dStats     = document.getElementById("d-stats");
  var dWhy       = document.getElementById("d-why");
  var dNotes     = document.getElementById("d-notes");
  var dSites     = document.getElementById("d-sites");
  var dFacts     = document.getElementById("d-facts");
  var dActions   = document.getElementById("d-actions");

  function stat(value, label) {
    return '<div class="stat"><b>' + esc(String(value)) + "</b><span>" + esc(label) + "</span></div>";
  }

  function renderDetail(badge, site) {
    var group = sitesOf[badge.badge];

    text(dTitle, badge.badge);
    text(dMeta, REASON_LABEL[badge.reason] + " · " + badge.region);

    // Aggregates and per-site figures must not share the strip: "9
    // Superchargers / 54 stalls total / 250 kW" reads as though 250 kW
    // described all nine. Power is per-site, so for a multi-site badge it
    // belongs in the facts below, which describe the focused Supercharger.
    var stats = "";
    if (badge.site_count > 1) {
      stats += stat(badge.site_count, "Superchargers");
      stats += stat(group.reduce(function (a, s) { return a + (s.stalls || 0); }, 0), "stalls total");
    } else {
      stats += stat(site.stalls || "—", "stalls");
      if (site.power_kw) stats += stat(site.power_kw + " kW", "peak");
    }
    if (here) stats += stat(fmtDist(distKm[badge.badge]), "away");
    dStats.innerHTML = stats;

    text(dWhy, badge.why);

    var notes = "";
    if (badge.note) notes += '<p class="dnote">' + esc(badge.note) + "</p>";
    if (badge.confidence === "approx") {
      notes += '<p class="dnote">' + (badge.site_count > 1
        ? "Matched to these Superchargers by proximity"
        : "Matched to this Supercharger by proximity") +
        " — Tesla does not publish the mapping, so it is not confirmed in the app.</p>";
    }
    dNotes.innerHTML = notes;

    // Multi-site badges list their Superchargers; picking one re-points the
    // facts below and flies to it.
    if (badge.site_count > 1) {
      dSites.innerHTML = '<div class="sitelist"><p class="lbl">Superchargers</p>' +
        group.map(function (s, i) {
          return '<button class="srow" type="button" data-i="' + i + '"' +
            (s === site ? ' aria-current="true"' : "") + ">" +
            '<span class="snm">' + esc(s.name) + "</span>" +
            '<span class="sst">' + (s.stalls || "—") + "</span></button>";
        }).join("") + "</div>";
    } else {
      dSites.innerHTML = "";
    }

    var facts = [
      ["Supercharger", esc(site.name)],
      ["Address", esc([site.address, place(site)].filter(Boolean).join(", "))],
      ["Coordinates", '<span class="mono">' + site.latitude.toFixed(5) + ", " +
        site.longitude.toFixed(5) + "</span>"]
    ];
    if (badge.site_count > 1 && site.power_kw) facts.push(["Power", site.power_kw + " kW"]);
    if (site.elevation_m != null) facts.push(["Elevation", site.elevation_m + " m"]);
    facts.push(["Listed", site.opened || "—"]);
    dFacts.innerHTML = facts.map(function (f) {
      return "<dt>" + f[0] + "</dt><dd" + (f[0] === "Coordinates" ? ' class="mono"' : "") +
        ">" + f[1] + "</dd>";
    }).join("");

    var actions =
      '<a class="btn primary" target="_blank" rel="noopener" ' +
        'href="https://www.google.com/maps/search/?api=1&amp;query=' +
        site.latitude + "," + site.longitude + '">Open in Google Maps</a>';
    if (site.tesla_location_id) {
      actions += '<a class="btn" target="_blank" rel="noopener" ' +
        'href="https://www.tesla.com/findus/location/supercharger/' +
        encodeURIComponent(site.tesla_location_id) + '">Tesla</a>';
    }
    dActions.innerHTML = actions;
  }

  dSites.addEventListener("click", function (e) {
    var btn = e.target.closest(".srow");
    if (!btn || !selected) return;
    var s = sitesOf[selected][+btn.dataset.i];
    renderDetail(byName[selected], s);
    map.flyToBounds(L.latLngBounds([[s.latitude, s.longitude], [s.latitude, s.longitude]]),
      Object.assign({ maxZoom: Math.max(map.getZoom(), 12), duration: 0.6 }, framePad()));
  });

  function showDetail(badge, site) {
    renderDetail(badge, site);
    listView.hidden = true;
    detailEl.hidden = false;
    detailEl.querySelector(".dbody").scrollTop = 0;
    backEl.focus();
  }

  function showList(refocus) {
    detailEl.hidden = true;
    listView.hidden = false;
    if (refocus !== false && selected && rowEl[selected]) rowEl[selected].focus();
  }

  backEl.addEventListener("click", function () {
    showList(true);
    // The list is what the URL now describes; the pin stays highlighted so it
    // is still obvious where you were.
    try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
  });

  /* ------------------------------------------------------ select and fly --- */
  var byName = {};
  BADGES.forEach(function (b) { byName[b.badge] = b; });

  function highlight(name) {
    Object.keys(marks).forEach(function (k) {
      var on = k === name;
      marks[k].forEach(function (m) {
        var el = m.marker.getElement();   // null while the marker is filtered out
        if (el) el.classList.toggle("is-selected", on);
        m.marker.setZIndexOffset(on ? 1000 : 0);
      });
    });
    Object.keys(rowEl).forEach(function (k) {
      if (k === name) { rowEl[k].setAttribute("aria-current", "true"); }
      else { rowEl[k].removeAttribute("aria-current"); }
    });
    if (name && rowEl[name]) rowEl[name].scrollIntoView({ block: "nearest" });
  }

  // The animation is a nicety, never the mechanism: a hidden tab pauses
  // requestAnimationFrame, so a flight started there would never land and the
  // card would describe a place the map never reached. Landing is always forced.
  function frame(name, site) {
    var group = marks[name];
    var badge = byName[name];
    var pts = group.map(function (m) { return [m.site.latitude, m.site.longitude]; });
    var bounds = L.latLngBounds(pts);
    // flyToBounds takes bounds where flyTo could not, so multi-site badges get
    // the flight too instead of jumping. A degenerate single-point bounds is
    // safe precisely because an explicit numeric maxZoom is passed.
    var maxZoom = group.length > 1 ? 9 : Math.max(map.getZoom(), 9);
    var opts = Object.assign({ maxZoom: maxZoom }, framePad());
    var done = false;

    function land() {
      if (done) return;
      done = true;
      map.fitBounds(bounds, Object.assign({ animate: false }, opts));
      showDetail(badge, site || group[0].site);
    }

    if (document.hidden) { land(); return; }
    map.once("moveend", land);
    map.flyToBounds(bounds, Object.assign({ duration: 0.7 }, opts));
    setTimeout(land, 1400);
  }

  function select(name, fly, site) {
    if (!marks[name]) return;
    if (location.hash.slice(1) !== encodeURIComponent(name)) {
      try { history.replaceState(null, "", "#" + encodeURIComponent(name)); } catch (e) {}
    }
    selected = name;
    highlight(name);
    if (fly) { frame(name, site); } else { showDetail(byName[name], site || sitesOf[name][0]); }
  }

  /* ------------------------------------------------------------ search --- */
  var qEl = document.getElementById("q");
  var clearEl = document.getElementById("clear");

  qEl.addEventListener("input", function (e) {
    query = e.target.value;
    clearEl.hidden = !query;
    scheduleRender();
  });
  clearEl.addEventListener("click", function () {
    qEl.value = ""; query = ""; clearEl.hidden = true;
    qEl.focus();
    scheduleRender();
  });

  /* ----------------------------------------------------------- near me --- */
  var nearEl = document.getElementById("near");
  var nearLbl = document.getElementById("nearlbl");
  var nearMsg = document.getElementById("nearmsg");

  function say(msg) {
    text(nearMsg, msg || "");
    nearMsg.hidden = !msg;
  }

  nearEl.addEventListener("click", function () {
    if (here) {                                   // toggle back to region order
      here = null; order = null; distKm = {};
      nearEl.setAttribute("aria-pressed", "false");
      say("");
      applyOrder();
      render();
      return;
    }
    if (!navigator.geolocation) { say("This browser can't share a location."); return; }

    nearEl.disabled = true;
    text(nearLbl, "Locating…");
    say("");
    navigator.geolocation.getCurrentPosition(function (pos) {
      here = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      // Distance to the badge's NEAREST Supercharger, not to the stored
      // centroid -- for Great Barrier Reef the centroid is the sea.
      BADGES.forEach(function (b) {
        distKm[b.badge] = sitesOf[b.badge].reduce(function (min, s) {
          return Math.min(min, haversine(here.lat, here.lng, s.latitude, s.longitude));
        }, Infinity);
      });
      order = BADGES.map(function (b) { return b.badge; })
        .sort(function (a, b) { return distKm[a] - distKm[b]; });
      nearEl.disabled = false;
      nearEl.setAttribute("aria-pressed", "true");
      text(nearLbl, "Near me");
      applyOrder();
      render();
      listEl.scrollTop = 0;
    }, function (err) {
      nearEl.disabled = false;
      text(nearLbl, "Near me");
      say(err && err.code === 1
        ? "Location permission denied — still sorted by region."
        : "Couldn't get your location — still sorted by region.");
    }, { timeout: 10000, maximumAge: 600000 });
  });

  /* -------------------------------------------------------------- start --- */
  render();

  // #<badge name> deep-links, so a specific badge is shareable.
  function openFromHash() {
    var name;
    try { name = decodeURIComponent(location.hash.slice(1)); } catch (e) { return; }
    if (name && marks[name]) select(name, true);
  }
  window.addEventListener("hashchange", openFromHash);
  openFromHash();

  // The panel's width is part of every framing decision, so a resize that
  // swaps the left panel for the bottom sheet has to be re-framed.
  var rt = 0;
  window.addEventListener("resize", function () {
    clearTimeout(rt);
    rt = setTimeout(function () {
      if (selected && marks[selected]) {
        var pts = marks[selected].map(function (m) { return [m.site.latitude, m.site.longitude]; });
        map.fitBounds(L.latLngBounds(pts), Object.assign(
          { animate: false, maxZoom: Math.max(map.getZoom(), 9) }, framePad()));
      }
    }, 200);
  });
});
</script>
</body>
</html>
