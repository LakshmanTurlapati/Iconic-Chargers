worker_processes auto;
pid /tmp/nginx.pid;

error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  types {
    text/csv csv;
    application/geo+json geojson;
    application/javascript mjs;
    application/manifest+json webmanifest;
    application/yaml cff;
    text/markdown md;
  }

  log_format fly '$remote_addr - $remote_user [$time_local] "$request" '
                 '$status $body_bytes_sent "$http_referer" '
                 '"$http_user_agent" "$http_fly_request_id"';
  access_log /dev/stdout fly;

  charset utf-8;
  server_tokens off;
  # Nginx's automatic directory-slash redirects must remain origin-relative.
  # Fly terminates TLS in front of this container, whose internal listener is
  # plain HTTP on 8080; absolute redirects would otherwise leak that endpoint.
  absolute_redirect off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  etag on;
  client_body_temp_path /tmp/nginx-client-body;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_proxied any;
  gzip_types
    application/geo+json
    application/javascript
    application/json
    application/manifest+json
    application/xml
    image/svg+xml
    text/css
    text/csv
    text/javascript
    text/plain
    text/xml
    application/yaml;

  # Match only the raw, still-percent-encoded request target. This provides a
  # single clean URL for every generated directory without ever interpolating
  # decoded path bytes into a response header.
  map $request_uri $index_redirect {
    default "";
    ~^/web/index\.html(?:\?.*)?$ "";
    ~^(?<index_directory>/[A-Za-z0-9-]+(?:/[A-Za-z0-9-]+)*)/index\.html(?:\?.*)?$ $index_directory/;
  }

  # Fly health checks can arrive with an internal Host header. Everything else
  # on an unknown hostname is sent to the one public, canonical origin.
  server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location = /index.html { return 308 https://iconicchargers.com/$is_args$args; }
    location = /web { return 308 https://iconicchargers.com/$is_args$args; }
    location = /web/ { return 308 https://iconicchargers.com/$is_args$args; }
    location = /web/index.html { return 308 https://iconicchargers.com/$is_args$args; }

    # $request_uri retains percent encoding. Never interpolate decoded $uri in
    # a response header: encoded CR/LF bytes could otherwise split Location.
    location / { return 308 https://iconicchargers.com$request_uri; }
  }

  # These public aliases are deliberately redirect-only so they cannot become
  # competing origins in search indexes.
  server {
    listen 8080;
    listen [::]:8080;
    server_name www.iconicchargers.com iconic-chargers.fly.dev;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location = /index.html { return 308 https://iconicchargers.com/$is_args$args; }
    location = /web { return 308 https://iconicchargers.com/$is_args$args; }
    location = /web/ { return 308 https://iconicchargers.com/$is_args$args; }
    location = /web/index.html { return 308 https://iconicchargers.com/$is_args$args; }
    location / { return 308 https://iconicchargers.com$request_uri; }
  }

  server {
    listen 8080;
    listen [::]:8080;
    server_name iconicchargers.com;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    error_page 404 /404.html;

    if ($http_x_forwarded_proto = "http") {
      return 308 https://iconicchargers.com$request_uri;
    }

    if ($index_redirect != "") {
      return 308 $index_redirect$is_args$args;
    }

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location = /index.html {
      # The index module internally resolves `/` to this URI. Redirect only a
      # client request for index.html; otherwise serve the root document.
      if ($request_uri ~ ^/index\.html(?:\?|$)) {
        return 308 https://iconicchargers.com/$is_args$args;
      }
      expires -1;
      try_files $uri =404;
    }

    location = /web {
      return 308 https://iconicchargers.com/$is_args$args;
    }

    location = /web/ {
      return 308 https://iconicchargers.com/$is_args$args;
    }

    location = /web/index.html {
      return 308 https://iconicchargers.com/$is_args$args;
    }

    location = /404.html {
      internal;
      expires off;
      add_header Cache-Control "no-store" always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      add_header X-Frame-Options SAMEORIGIN always;
      add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location ~* \.html$ {
      expires -1;
      try_files $uri =404;
    }

    location ~* \.(?:json|geojson|csv|xml|txt|cff|md)$ {
      expires 1h;
      try_files $uri =404;
    }

    # These assets are intentionally unhashed, so keep them fresh across a
    # deploy while still allowing short shared-cache reuse.
    location ~* \.(?:css|js|mjs|webmanifest)$ {
      expires 1h;
      try_files $uri =404;
    }

    location ~* \.(?:png|jpe?g|gif|webp|svg|ico|woff2?|ttf)$ {
      expires 7d;
      try_files $uri =404;
    }

    location ~ /\. {
      deny all;
    }

    location / {
      try_files $uri $uri/ =404;
    }
  }
}
